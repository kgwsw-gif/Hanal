        var subSnap=await db.collection('submissions').where('name','==',name).where('date','>=',startD).where('date','<=',endD).get();
        var outSnap=await db.collection('outings').where('name','==',name).where('date','>=',startD).where('date','<=',endD).get();
        var subs2=subSnap.docs.map(function(d){return Object.assign({id:d.id},d.data())}).filter(function(s){return s.status!=='cancelled'});
        var outs2=outSnap.docs.map(function(d){return Object.assign({id:d.id},d.data())}).filter(function(o){return !o.status||o.status!=='cancelled'});
        var stayCount=subs2.filter(function(s){return s.status==='stay'}).length;
        var outCount=subs2.filter(function(s){return s.status==='out'}).length;
        var outingCount=outs2.length;
        var allDates=[];var cur=new Date(startD+'T00:00:00');var endDate=new Date(endD+'T00:00:00');
        while(cur<=endDate){allDates.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0'));cur.setDate(cur.getDate()+1)}

        html+='<div class="space-y-1 max-h-60 overflow-y-auto">';
        allDates.forEach(function(dateStr){
            var sub=subs2.find(function(s){return s.date===dateStr});
            var out=outs2.find(function(o){return o.date===dateStr});
            var di=formatDateWithDay(dateStr);
            var dateClass=di.isHoliday?'text-danger-600':di.isWeekend?'text-info-600':'text-gray-600';

            html+='<div class="flex items-center justify-between py-2 px-3 border-b border-surface-100"><span class="text-sm font-medium '+dateClass+'">'+dateStr.substring(5)+(di.holiday?' '+di.holiday:'')+'</span><span class="text-sm font-bold '+statusClass+'"><i class="fas '+icon+' mr-1"></i>'+status+'</span></div>';
        });
        html+='</div></div>';
        area.innerHTML=html;
    }catch(e){area.innerHTML='<div class="text-sm text-danger-500 text-center py-3 mt-3">조회 실패: '+escapeHtml(e.message)+'</div>'}

async function loadResignHistory(){
    var area=document.getElementById('resignHistoryResult');
    area.innerHTML='<div class="text-sm text-gray-400 text-center py-3">조회 중...</div>';
    try{
        var approved=resignRequests.filter(function(r){return r.status==='approved'});
        var pending=resignRequests.filter(function(r){return r.status==='pending'});

        // ★ 중복 제거: 같은 학과+이름이면 교육생 직접 신청건 우선, 관리자 자동생성건 제거
        var uniqueMap={};
        approved.forEach(function(r){
            var key=r.department+'_'+r.name;
            if(!uniqueMap[key]){
                uniqueMap[key]=r;
            }else{
                // 이미 있으면: deletedByAdmin이 아닌 건(교육생 직접신청)을 우선
                if(r.deletedByAdmin&&!uniqueMap[key].deletedByAdmin){
                    // 기존이 교육생 신청이면 유지, 현재(자동생성)는 무시
                }else if(!r.deletedByAdmin&&uniqueMap[key].deletedByAdmin){
                    // 현재가 교육생 신청이면 교체
                    uniqueMap[key]=r;
                }else{
                    // 둘 다 같은 타입이면 최신 날짜 우선
                    if((r.approvedDate||'')>(uniqueMap[key].approvedDate||'')){
                        uniqueMap[key]=r;
                    }
                }
            }
        });
        approved=Object.values(uniqueMap);

        if(approved.length===0&&pending.length===0){

                var hvacSnap = await db.collection('hvacRequests')
                    .where('requestedBy','==',oldName)
                    .get();
                if(!hvacSnap.empty){
                    var hvacBatch = db.batch();
                    hvacSnap.docs.forEach(function(doc){
                        hvacBatch.update(doc.ref, {requestedBy: newName, updatedAt: new Date().toISOString()});
                    });
                    await hvacBatch.commit();
                }
                
                // 10. 시설 민원 업데이트
                var facSnap = await db.collection('facilityRequests')
                    .where('student','==',oldName)
                    .get();
                if(!facSnap.empty){
                    var facBatch = db.batch();
                    facSnap.docs.forEach(function(doc){
                        facBatch.update(doc.ref, {student: newName, updatedAt: new Date().toISOString()});
                    });
                    await facBatch.commit();
                }
                
                // 11. 출입 신청 업데이트
                var accSnap = await db.collection('accessRequests')
                    .where('student','==',oldName)
                    .get();
                if(!accSnap.empty){
                    var accBatch = db.batch();
                    accSnap.docs.forEach(function(doc){
                        accBatch.update(doc.ref, {student: newName, updatedAt: new Date().toISOString()});
                    });
                    await accBatch.commit();
                }
                
                // 12. 호실 메모 업데이트 (roomMemos는 호실 기준이라 변경 불필요)
                
                // 13. 비밀번호 변경 이력 업데이트
                var pwLogSnap = await db.collection('passwordChangeLogs')
                    .where('name','==',oldName)
                    .get();
                if(!pwLogSnap.empty){
                    var pwBatch = db.batch();
                    pwLogSnap.docs.forEach(function(doc){
                        pwBatch.update(doc.ref, {name: newName, updatedAt: new Date().toISOString()});
                    });
                    await pwBatch.commit();
                }
                 // 로컬 캐시 동기화 (Firestore와 즉시 일치)
                if(students[dept]){
                    var localIdx = students[dept].indexOf(oldName);
                    if(localIdx !== -1) students[dept][localIdx] = newName;
                }
                if(DEPARTMENT_LEADERS[dept] && DEPARTMENT_LEADERS[dept].name === oldName){
                    DEPARTMENT_LEADERS[dept].name = newName;
                }

                showToast(oldName + ' → ' + newName + ' 이름 변경 완료', 'success');
                showSuccessAnimation('이름 변경 완료', oldName + ' → ' + newName);
                
                // UI 초기화
                document.getElementById('editStudentInfo').style.display = 'none';
                document.getElementById('editStudentName').value = '';
                document.getElementById('editStudentNewName').value = '';
                render();
                
            }catch(e){
                showToast('이름 변경 실패: ' + e.message, 'error');
                console.error('이름 변경 오류:', e);
            }
        }, '변경'
    );
}


async function moveStudentDept(){
    var oldDept=document.getElementById('editStudentDept').value;
    var name=document.getElementById('editStudentName').value;
    var newDept=document.getElementById('editStudentNewDept').value;
    if(!oldDept||!name||!newDept){showToast('모든 항목을 선택하세요','warning');return}
    if(oldDept===newDept){showToast('같은 학과입니다','warning');return}
    openConfirmModal('학과 이동',escapeHtml(name)+'을(를)<br><b>'+escapeHtml(oldDept)+'</b> → <b>'+escapeHtml(newDept)+'</b>로 이동?',async function(){
        try{
            var oldList=(window._secureData.getStudentsByDept(oldDept)||[]).filter(function(s){return s!==name});
            var newList=(window._secureData.getStudentsByDept(newDept)||[]).concat([name]);
            var batch=db.batch();
            batch.set(db.collection('students').doc(oldDept),{students:oldList,updatedAt:new Date().toISOString()});
            batch.set(db.collection('students').doc(newDept),{students:newList,updatedAt:new Date().toISOString()});
            batch.set(db.collection('roomNumbers').doc(name),{department:newDept,updatedAt:new Date().toISOString()},{merge:true});
            batch.set(db.collection('passwords').doc(name),{department:newDept,updatedAt:new Date().toISOString()},{merge:true});
            if(DEPARTMENT_LEADERS[oldDept]&&DEPARTMENT_LEADERS[oldDept].name===name){batch.delete(db.collection('departmentLeaders').doc(oldDept))}
            await batch.commit();
            showToast(name+' → '+newDept+' 이동 완료','success');
            document.getElementById('editStudentInfo').style.display='none';
            render();
        }catch(e){showToast('이동 실패: '+e.message,'error')}
    },'이동');
}

function _makeSubSectionsCollapsible() {
    setTimeout(function() {
        var titles = {};

            var h3 = allH3[i];
            var text = h3.textContent.trim();

            for (var title in titles) { if (text.indexOf(title) > -1) { key = titles[title]; break; } }
            if (!key) continue;
            if (h3.getAttribute('data-collapse-done')) continue;
            h3.setAttribute('data-collapse-done', '1');
            var container = h3.parentElement;
            if (!container) continue;
            var bodyDiv = document.createElement('div');
            bodyDiv.id = 'subSec-' + key;
            if (_subSectionStates[key]) bodyDiv.style.display = 'none';
            var children = [];
            var started = false;
            for (var j = 0; j < container.children.length; j++) {
                if (container.children[j] === h3 || container.children[j].contains && container.children[j].contains(h3)) { started = true; continue; }
                if (started) children.push(container.children[j]);
            }
            for (var c = 0; c < children.length; c++) { bodyDiv.appendChild(children[c]); }
            container.appendChild(bodyDiv);
            var chevron = document.createElement('i');

            chevron.className = 'fas ' + (_subSectionStates[key] ? 'fa-chevron-down' : 'fa-chevron-up') + ' text-gray-400 transition-transform';

if (key !== 'delStudent') {
                h3.style.color = '#4f46e5';

                for (var ic = 0; ic < icons.length; ic++) { icons[ic].style.color = '#4f46e5'; }

container.style.padding = '12px 16px';

container.style.borderRadius = '12px';
            container.style.width = '100%';
            container.style.boxSizing = 'border-box';

            h3.style.padding = '12px 0';}

(function(){
    function _fixStudentSection() {
        setTimeout(function() {

            var toggle = document.querySelector('[onclick*="toggleManageSection(\'sec-students\')"]');

            var wrapper = toggle.closest('.mb-4');
            if (!wrapper) return;
            var all = wrapper.querySelectorAll('*');
            var secToggleDiv = toggle.closest('.flex.items-center');
            for (var i = 0; i < all.length; i++) {
                var el = all[i];
                if (secToggleDiv && secToggleDiv.contains(el)) continue;
                if (el === secStudents) continue;
                if (el.id === 'secIcon-sec-students') continue;
                if (!secStudents.contains(el) && el.parentElement === wrapper) {
                    el.style.display = isHidden ? 'none' : '';
                }
            }
            var next = wrapper.nextElementSibling;
            while (next) {
                if (next.querySelector && next.querySelector('[onclick*="sec-passwords"]')) break;
                if (next.querySelector && next.querySelector('[onclick*="sec-resign"]')) break;
                next.style.display = isHidden ? 'none' : '';
                next = next.nextElementSibling;
            }
            var settingsCard = wrapper.closest('.bg-white.rounded-3xl');
            if (!settingsCard) return;
            var pwToggle = document.querySelector('[onclick*="toggleManageSection(\'sec-passwords\')"]');
            var rsToggle = document.querySelector('[onclick*="toggleManageSection(\'sec-resign\')"]');
            var pwBlock = pwToggle ? pwToggle.closest('.mb-4') : null;
            var rsBlock = rsToggle ? rsToggle.closest('.mb-4') : null;
            if (pwBlock && !settingsCard.contains(pwBlock)) {
                settingsCard.appendChild(pwBlock);
            }
            if (rsBlock && !settingsCard.contains(rsBlock)) {
                settingsCard.appendChild(rsBlock);
            }
            if (pwBlock) pwBlock.style.display = isHidden ? 'none' : '';
            if (rsBlock) rsBlock.style.display = isHidden ? 'none' : '';
        }, 10);
    }
    var _ot = toggleManageSection;
    toggleManageSection = function(id) { _ot(id); if(id==='sec-students') _fixStudentSection(); };
    var _ota = toggleAllManageSections;
    toggleAllManageSections = function(e) { _ota(e); _fixStudentSection(); };
    var _or = render;
    render = function() { _or(); _fixStudentSection(); _makeSubSectionsCollapsible(); };
})();

// ============ 서버 검증 강화 (덮어쓰기) ============
async function checkServerConnection(){
    try{
        await Promise.race([
            db.collection('settings').doc('submitControl').get({source:'server'}),
            new Promise(function(_,reject){setTimeout(function(){reject(new Error('TIMEOUT'))},8000)})
        ]);
        return true;
    }catch(e){return false}
}

async function submitStatus(dept, name, status) {
    if (!navigator.onLine) {
        showToast('인터넷 연결이 없습니다. Wi-Fi 또는 데이터를 확인 후 다시 시도해주세요.', 'error');
        if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        return;
    }
    var sd = getSelectedDate();
    var docId = sd + '_' + dept + '_' + name;
    if (currentMode === 'student') {
        var now = new Date();
        var existingSub = submissions.find(function(s) { return s.id === docId && s.status !== 'cancelled'; });
        if (existingSub && now.getHours() >= 23) {
    showToast('23시 이후에는 신청을 변경할 수 없습니다.', 'warning');
    return;
}
    }
    if (window._submitLock) {
        showToast('제출 처리 중입니다.', 'info');
        return;
    }
    window._submitLock = true;
    var loadingOverlay = document.createElement('div');
    loadingOverlay.id = 'submitLoadingOverlay';
    loadingOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:10000';
    loadingOverlay.innerHTML = '<div style="background:white;border-radius:20px;padding:32px 40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.2)"><i class="fas fa-spinner fa-spin" style="font-size:32px;color:#6366f1;margin-bottom:12px"></i><div style="font-size:16px;font-weight:700;color:#374151">서버에 전송 중...</div><div style="font-size:13px;color:#6b7280;margin-top:4px">잠시만 기다려주세요</div></div>';
    document.body.appendChild(loadingOverlay);
    try {
        var serverReachable = await checkServerConnection();
        if (!serverReachable) { throw new Error('SERVER_UNREACHABLE'); }
        await db.collection('submissions').doc(docId).set({department:dept,name:name,status:status,date:sd,timestamp:new Date().toLocaleTimeString('ko-KR'),submitDate:new Date().toISOString()});
        var verified = false;
        // 검증 재조회: 서버 우선 → 실패 시 1초 후 재시도 → 그래도 안되면 기본(캐시 포함) 조회
        try {
            var verifyDoc = await db.collection('submissions').doc(docId).get({source:'server'});
            if (verifyDoc.exists && verifyDoc.data().status === status) { verified = true; }
        } catch (verifyErr) {
            console.warn('검증 1차 실패, 재시도:', verifyErr.message);
            try {
                await new Promise(function(r){setTimeout(r,1000)});
                var retryDoc = await db.collection('submissions').doc(docId).get({source:'server'});
                if (retryDoc.exists && retryDoc.data().status === status) { verified = true; }
            } catch (retryErr) {
                console.warn('검증 2차 실패, 캐시 확인:', retryErr.message);
                try {
                    var cacheDoc = await db.collection('submissions').doc(docId).get();
                    if (cacheDoc.exists && cacheDoc.data().status === status) { verified = true; }
                } catch (cacheErr) {}
            }
        }

        if (verified) {
            showToast(status==='stay'?'잔류(Stay) 신청 완료':'외박(Out) 신청 완료','success');
            showSuccessAnimation(status==='stay'?'잔류(Stay) 신청 완료':'외박(Out) 신청 완료',name+' · '+new Date().toLocaleTimeString('ko-KR'));
        } else {
            try { await db.collection('submissions').doc(docId).delete(); } catch(e) {}
            showToast('⚠️ 인터넷 연결이 불안정합니다! 신청이 서버에 저장되지 않았습니다.','error');
            if (navigator.vibrate) navigator.vibrate([300,100,300,100,300]);
            openModal('<div class="p-6 text-center"><div style="width:70px;height:70px;margin:0 auto 16px;border-radius:50%;background:#fef2f2;display:flex;align-items:center;justify-content:center"><i class="fas fa-wifi" style="font-size:28px;color:#dc2626"></i></div><h3 class="text-xl font-bold text-danger-700 mb-2">신청 실패!</h3><p class="text-sm text-gray-600 mb-4">인터넷 연결이 불안정하여<br>서버에 저장되지 않았습니다.</p><div class="bg-danger-50 border border-danger-200 rounded-xl p-4 mb-4 text-left"><div class="text-sm font-bold text-danger-700 mb-1">해결 방법:</div><div class="text-sm text-danger-600">1. Wi-Fi 또는 데이터 연결 확인<br>2. 브라우저 새로고침<br>3. 다시 잔류/외박 버튼 누르기</div></div><button onclick="closeModal()" class="w-full py-3.5 bg-danger-500 text-white rounded-2xl font-bold text-base btn-press">확인</button></div>');
        }
        render();
    } catch(e) {
        var errorMsg = e.message==='SERVER_UNREACHABLE'?'서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.':'신청 실패: '+e.message;
        showToast(errorMsg,'error');
        if (navigator.vibrate) navigator.vibrate([300,100,300,100,300]);
        try { await db.collection('submissions').doc(docId).delete(); } catch(delErr) {}
    } finally {
        window._submitLock = false;
        var overlay = document.getElementById('submitLoadingOverlay');
        if (overlay) overlay.remove();
    }
}

async function submitOuting(dept,name,t1,t2,reason){
    if(!navigator.onLine){showToast('인터넷 연결이 없습니다.','error');return}
    if(window._submitLock){showToast('처리 중입니다.','info');return}
    window._submitLock=true;
    var sd=getSelectedDate();var docId=sd+'_'+dept+'_'+name;
    try{
        var serverOk=await checkServerConnection();
        if(!serverOk){showToast('서버에 연결할 수 없습니다.','error');return}
        await db.collection('outings').doc(docId).set({department:dept,name:name,date:sd,outingTime:t1,returnTime:t2,reason:reason,timestamp:new Date().toLocaleTimeString('ko-KR')});
        var verified=false;
        try{var verify=await db.collection('outings').doc(docId).get({source:'server'});if(verify.exists)verified=true}catch(e){verified=false}
        if(verified){
            showToast('외출(Go Out) 신청 완료','success');
            showSuccessAnimation('외출(Go Out) 신청 완료',name+' · '+new Date().toLocaleTimeString('ko-KR'));

function updatePenaltyStudentList(){var dept=document.getElementById('penaltyDept').value;var sel=document.getElementById('penaltyStudent');sel.innerHTML='<option value="">교육생 선택</option>';if(dept&&students[dept])sortStudentsByRoom(students[dept]).forEach(function(n){var o=document.createElement('option');o.value=n;o.textContent=formatStudentNameRaw(n);sel.appendChild(o)})}
function updatePenaltyPts(){var sel=document.getElementById('penaltyType');var scoreInput=document.getElementById('penaltyScore');var infoEl=document.getElementById('penaltyActionInfo');var opt=sel.options[sel.selectedIndex];if(!opt||!opt.dataset.pts){scoreInput.value=0;if(infoEl)infoEl.innerHTML='';return}var pts=parseInt(opt.dataset.pts);if(pts>0){scoreInput.value=pts;scoreInput.readOnly=false;scoreInput.style.opacity='1';scoreInput.min='0'}else{scoreInput.value='';scoreInput.readOnly=false;scoreInput.style.opacity='1';scoreInput.focus()}var actionHtml='';if(pts>=10){actionHtml='<div class="p-3 bg-danger-50 border border-danger-200 rounded-xl mt-2"><div class="text-sm font-bold text-danger-700"><i class="fas fa-exclamation-triangle mr-1"></i>조치: 즉시 강제퇴사</div><div class="text-xs text-danger-600 mt-1">해당 행위는 예외 없이 즉시 퇴사 조치됩니다.</div></div>'}else if(pts>=5){actionHtml='<div class="p-3 bg-warning-50 border border-warning-200 rounded-xl mt-2"><div class="text-sm font-bold text-warning-700"><i class="fas fa-exclamation-circle mr-1"></i>조치: 벌점 누적 + 학내봉사 5일</div></div>'}else if(pts>=3){actionHtml='<div class="p-3 bg-warning-50 border border-warning-200 rounded-xl mt-2"><div class="text-sm font-bold text-warning-700"><i class="fas fa-exclamation-circle mr-1"></i>조치: 벌점 누적 + 학내봉사 3일</div></div>'}else if(pts>=2){actionHtml='<div class="p-3 bg-info-50 border border-info-200 rounded-xl mt-2"><div class="text-sm font-bold text-info-700"><i class="fas fa-info-circle mr-1"></i>조치: 경고 + 벌점 누적</div></div>'}actionHtml+='<div class="p-2 bg-surface-50 border border-surface-200 rounded-xl mt-2 text-xs text-gray-500"><i class="fas fa-lightbulb text-warning-500 mr-1"></i>점수를 0으로 변경하면 벌점 없이 경고 조치만 부여됩니다.</div>';if(infoEl)infoEl.innerHTML=actionHtml}
async function submitPenalty(){var dept=document.getElementById('penaltyDept').value;var name=document.getElementById('penaltyStudent').value;var typeEl=document.getElementById('penaltyType');var type=typeEl.value;var score=parseInt(document.getElementById('penaltyScore').value);var date=document.getElementById('penaltyDate').value;var reason=document.getElementById('penaltyReason').value.trim();if(!dept||!name){showToast('학과와 교육생을 선택하세요','warning');return}if(!type){showToast('벌점 유형을 선택하세요','warning');return}if(isNaN(score)||score<0){showToast('벌점 점수를 입력하세요','warning');return}if(!date){showToast('날짜를 선택하세요','warning');return}var actionText='';if(score>=10)actionText='즉시 강제퇴사';else if(score>=5)actionText='벌점 누적 + 학내봉사 5일';else if(score>=3)actionText='벌점 누적 + 학내봉사 3일';else if(score>=2)actionText='경고 + 벌점 누적';else if(score>0) actionText='벌점 누적';else actionText='경고 조치 (벌점 없음)';var isFirstMissing=false;if(type==='인원보고 미제출'){var prevMissing=penaltyPoints.filter(function(p){return p.name===name&&p.type==='인원보고 미제출'&&p.status==='active'});if(prevMissing.length===0){isFirstMissing=true;score=0;actionText='경고 (첫 회 경고)'}}try{var penaltyTime=document.getElementById('penaltyTime')?document.getElementById('penaltyTime').value:'';await db.collection('penaltyPoints').add({department:dept,name:name,type:type,score:score,date:date,violationTime:penaltyTime||'',reason:isFirstMissing?'인원보고 미제출/지연제출 1회 경고 (다음 미제출/지연제출 시 벌점 부여)':(reason||type),action:actionText,room:window._secureData.getRoomNumber(name)||'',givenBy:isSuperAdmin?'슈퍼관리자':'관리자',createdAt:new Date().toISOString(),status:'active',isWarning:isFirstMissing});closeModal();if(isFirstMissing){showToast(name+'에게 인원보고 미제출/지연제출 첫 회 경고 부여','warning');showSuccessAnimation('첫 회 경고 부여',name+' · 다음 미제출/지연제출 시 벌점 1점 부여')}else{showToast(name+'에게 벌점 '+score+'점 부여 완료','success');showSuccessAnimation('벌점 부여 완료',name+' · '+type+' '+score+'점')}}catch(e){showToast('벌점 부여 실패: '+e.message,'error')}}

// ============ 기숙사 문서 안내 시스템 ============
function showAddDocumentModal(){
    openInputModal('문서 등록',[
        {label:'문서 제목',type:'text',placeholder:'예: 기숙사 생활 안내문'},
        {label:'문서 설명 (선택)',type:'text',placeholder:'예: 2025학년도 기숙사 규정'},
        {label:'구글 드라이브 링크',type:'text',placeholder:'https://drive.google.com/...'},
        {label:'문서 유형',type:'select',options:[
            {value:'rule',label:'규정/안내문'},
            {value:'form',label:'서식/양식'},
            {value:'penalty',label:'벌점표'},
            {value:'etc',label:'기타'}
        ]}
    ],async function(){
        var title=document.getElementById('modalInput0').value.trim();
        var desc=document.getElementById('modalInput1').value.trim();
        var link=document.getElementById('modalInput2').value.trim();
        var type=document.getElementById('modalInput3').value;
        if(!title){showToast('문서 제목을 입력하세요','warning');return}
        if(!link){showToast('구글 드라이브 링크를 입력하세요','warning');return}
        if(!link.startsWith('http')){showToast('올바른 링크를 입력하세요 (https://...)','warning');return}
        try{
            await db.collection('dormDocuments').add({title:title,description:desc,link:link,type:type,order:dormDocuments.length,createdAt:new Date().toISOString(),createdBy:isSuperAdmin?'슈퍼관리자':'관리자'});
            closeModal();showToast('문서 등록 완료','success')
        }catch(e){showToast('등록 실패: '+e.message,'error')}
    });
}
async function deleteDocument(docId){openConfirmModal('문서 삭제','이 문서를 삭제하시겠습니까?',async function(){try{await db.collection('dormDocuments').doc(docId).delete();showToast('문서 삭제 완료','success')}catch(e){showToast('삭제 실패','error')}},'삭제')}
async function editDocument(docId){
    var doc=dormDocuments.find(function(d){return d.id===docId});if(!doc)return;
    openInputModal('문서 수정',[
        {label:'문서 제목',type:'text',value:doc.title},
        {label:'문서 설명',type:'text',value:doc.description||''},
        {label:'구글 드라이브 링크',type:'text',value:doc.link},
        {label:'문서 유형',type:'select',value:doc.type||'etc',options:[
            {value:'rule',label:'규정/안내문'},
            {value:'form',label:'서식/양식'},
            {value:'penalty',label:'벌점표'},
            {value:'etc',label:'기타'}
        ]}
    ],async function(){
        var title=document.getElementById('modalInput0').value.trim();
        var desc=document.getElementById('modalInput1').value.trim();
        var link=document.getElementById('modalInput2').value.trim();
        var type=document.getElementById('modalInput3').value;
        if(!title||!link){showToast('제목과 링크는 필수입니다','warning');return}
        try{await db.collection('dormDocuments').doc(docId).update({title:title,description:desc,link:link,type:type,updatedAt:new Date().toISOString()});closeModal();showToast('문서 수정 완료','success')}catch(e){showToast('수정 실패','error')}
    });
}
function getDocTypeInfo(type){var types={rule:{label:'규정/안내',icon:'fa-book',color:'primary'},form:{label:'서식/양식',icon:'fa-file-alt',color:'success'},penalty:{label:'벌점표',icon:'fa-exclamation-triangle',color:'danger'},etc:{label:'기타',icon:'fa-folder',color:'gray'}};return types[type]||types.etc}

async function loadSubmitRanking(mode){
window._submitRankMode=mode;
window._submitRankData=null;
window._submitRankShowCount=20;
render();
var el=document.getElementById('submitRankingResult');
if(el) el.innerHTML='<div class="text-center py-8"><i class="fas fa-spinner fa-spin text-2xl text-primary-400"></i><div class="text-sm text-gray-400 mt-2">조회 중...</div></div>';
try{
  var endDate=getCurrentDate();
  var startDate=new Date();
  startDate.setDate(startDate.getDate()-30);
  var startStr=startDate.getFullYear()+'-'+String(startDate.getMonth()+1).padStart(2,'0')+'-'+String(startDate.getDate()).padStart(2,'0');
  var snap=await db.collection('submissions').where('date','>=',startStr).where('date','<=',endDate).get();
  var studentMap={};
  snap.docs.forEach(function(d){
    var data=d.data();
    if(data.status==='cancelled')return;
    if(!data.name||!data.department)return;
    if(data.date&&isWeekendOrHoliday(data.date))return;
    if(!studentMap[data.name]) studentMap[data.name]={name:data.name,dept:data.department,totalCount:0,lateCount:0,proxyCount:0,goodCount:0,times:[]};
    var s=studentMap[data.name];
    s.totalCount++;
    var isProxy=!!data.modifiedBy;
    if(isProxy) s.proxyCount++;
    var h=0,m=0;
    if(data.submitDate){
      var dt=new Date(data.submitDate);
      h=dt.getHours();m=dt.getMinutes();
    }else if(data.timestamp&&data.timestamp!=='자동처리'){
      var ts=data.timestamp;
      var isPM=ts.indexOf('오후')!==-1;
      var nums=ts.replace(/[^0-9:]/g,'').split(':');
      h=parseInt(nums[0])||0;m=parseInt(nums[1])||0;
      if(isPM&&h<12)h+=12;
      if(!isPM&&h===12)h=0;
    }else{return;}
    var totalMin=h*60+m;
    s.times.push(totalMin);
    if(isProxy||totalMin>=21*60+10) s.lateCount++;
    if(!isProxy&&totalMin<21*60) s.goodCount++;
  });
  var result=[];
  Object.keys(studentMap).forEach(function(name){
    var s=studentMap[name];
    if(s.times.length===0)return;
    var avg=Math.round(s.times.reduce(function(a,b){return a+b},0)/s.times.length);
    s.avgTime=String(Math.floor(avg/60)).padStart(2,'0')+':'+String(avg%60).padStart(2,'0');
    result.push(s);
  });
  if(mode==='late'){
    result=result.filter(function(s){return s.lateCount>0});
    result.sort(function(a,b){return b.lateCount-a.lateCount||b.proxyCount-a.proxyCount});
  }else{
    result=result.filter(function(s){return s.goodCount>0});
    result.sort(function(a,b){return b.goodCount-a.goodCount||a.avgTime.localeCompare(b.avgTime)});
  }
  window._submitRankData=result;
  render();
}catch(e){
  console.error('제출 랭킹 조회 실패:',e);
  if(el) el.innerHTML='<div class="text-center text-danger-500 py-4">조회 실패</div>';
}
}

  try{
    var endDate=getCurrentDate();
    var startDate=new Date();
    startDate.setDate(startDate.getDate()-30);
    var startStr=startDate.getFullYear()+'-'+String(startDate.getMonth()+1).padStart(2,'0')+'-'+String(startDate.getDate()).padStart(2,'0');
    var snap=await db.collection('submissions').where('name','==',name).where('date','>=',startStr).where('date','<=',endDate).get();
    var records=[];
    var times=[];var lateCount=0;var proxyCount=0;var goodCount=0;
    snap.docs.forEach(function(d){
      var data=d.data();
      if(data.status==='cancelled')return;
      if(data.date&&isWeekendOrHoliday(data.date))return;
      var h=0,m=0,timeStr='';
      var isProxy=!!data.modifiedBy;
      if(data.submitDate){
        var dt=new Date(data.submitDate);
        h=dt.getHours();m=dt.getMinutes();
        timeStr=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      }else if(data.timestamp&&data.timestamp!=='자동처리'){
        var ts=data.timestamp;
        var isPM=ts.indexOf('오후')!==-1;
        var nums=ts.replace(/[^0-9:]/g,'').split(':');
        h=parseInt(nums[0])||0;m=parseInt(nums[1])||0;
        if(isPM&&h<12)h+=12;
        if(!isPM&&h===12)h=0;
        timeStr=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
      }else{return;}
      var totalMin=h*60+m;
      times.push(totalMin);
      if(isProxy) proxyCount++;
      if(isProxy||totalMin>=21*60+10) lateCount++;
      if(!isProxy&&totalMin<21*60) goodCount++;
      records.push({date:data.date||'',time:timeStr,totalMin:totalMin,isProxy:isProxy,status:data.status||'',dept:data.department||''});
    });
    records.sort(function(a,b){return b.date.localeCompare(a.date)});
    var avgMin=times.length>0?Math.round(times.reduce(function(a,b){return a+b},0)/times.length):0;
    var avgH=Math.floor(avgMin/60);var avgM=avgMin%60;
    var avgStr=String(avgH).padStart(2,'0')+':'+String(avgM).padStart(2,'0');
    var avgColor=avgH>=21?'text-danger-600':avgH>=20?'text-warning-600':'text-success-600';
    var dept=records.length>0?records[0].dept:'';
    var h2='<div class="p-6">';
    h2+='<h2 class="text-xl font-bold text-gray-800 mb-1"><i class="fas fa-user-circle text-primary-500 mr-2"></i>'+escapeHtml(name)+'</h2>';
    h2+='<div class="text-sm text-gray-500 mb-4">'+escapeHtml(dept)+' · 최근 30일</div>';
    h2+='<div class="grid grid-cols-4 gap-3 mb-5">';
    h2+='<div class="text-center p-3 bg-surface-50 rounded-xl"><div class="text-2xl font-black '+avgColor+'">'+avgStr+'</div><div class="text-xs text-gray-500 mt-1">평균시간</div></div>';
    h2+='<div class="text-center p-3 bg-surface-50 rounded-xl"><div class="text-2xl font-black text-gray-700">'+times.length+'</div><div class="text-xs text-gray-500 mt-1">총 제출</div></div>';
    h2+='<div class="text-center p-3 bg-danger-50 rounded-xl"><div class="text-2xl font-black text-danger-600">'+lateCount+'</div><div class="text-xs text-gray-500 mt-1">지각/대리</div></div>';
    h2+='<div class="text-center p-3 bg-success-50 rounded-xl"><div class="text-2xl font-black text-success-600">'+goodCount+'</div><div class="text-xs text-gray-500 mt-1">모범제출</div></div>';
    h2+='</div>';
    h2+='<div class="flex items-center gap-2 mb-2">';
    h2+='<div class="text-sm font-bold text-gray-600">제출 내역</div>';
    h2+='<button onclick="filterSubmitDetail(\'all\')" class="px-2 py-1 rounded-lg text-xs font-bold '+((!window._submitDetailFilter||window._submitDetailFilter==='all')?'bg-primary-500 text-white':'bg-surface-100 text-gray-500')+'">전체</button>';
    h2+='<button onclick="filterSubmitDetail(\'late\')" class="px-2 py-1 rounded-lg text-xs font-bold '+(window._submitDetailFilter==='late'?'bg-danger-500 text-white':'bg-surface-100 text-gray-500')+'">지각/대리</button>';
    h2+='<button onclick="filterSubmitDetail(\'good\')" class="px-2 py-1 rounded-lg text-xs font-bold '+(window._submitDetailFilter==='good'?'bg-success-500 text-white':'bg-surface-100 text-gray-500')+'">모범</button>';
    h2+='</div>';
    h2+='<div style="max-height:300px;overflow-y:auto">';
    var filteredRecords=records.filter(function(r){
      var f=window._submitDetailFilter||'all';
      var isL=r.isProxy||r.totalMin>=21*60+10;
      var isG=!r.isProxy&&r.totalMin<21*60;
      if(f==='late')return isL;
      if(f==='good')return isG;
      return true;
    });
    filteredRecords.forEach(function(r){
      var isLate=r.isProxy||r.totalMin>=21*60+10;
      var rowBg=r.isProxy?'bg-warning-50':isLate?'bg-danger-50':r.totalMin<21*60?'bg-success-50':'bg-surface-50';
      var timeColor=r.isProxy?'text-warning-600':isLate?'text-danger-600':r.totalMin<21*60?'text-success-600':'text-gray-600';
      var tag=r.isProxy?'<span class="text-xs bg-warning-200 text-warning-700 px-1.5 py-0.5 rounded-full font-bold ml-2">대리</span>':isLate?'<span class="text-xs bg-danger-200 text-danger-700 px-1.5 py-0.5 rounded-full font-bold ml-2">지각</span>':r.totalMin<21*60?'<span class="text-xs bg-success-200 text-success-700 px-1.5 py-0.5 rounded-full font-bold ml-2">모범</span>':'';
      h2+='<div class="flex items-center justify-between p-2 rounded-lg mb-1 '+rowBg+'">';
      h2+='<span class="text-sm text-gray-700">'+r.date+'</span>';
      h2+='<span class="font-bold '+timeColor+'">'+r.time+tag+'</span>';
      h2+='</div>';
    });
    h2+='</div></div>';
    openModal(h2);
  }catch(e){
    console.error(e);
    openModal('<div class="p-6 text-center text-danger-500">조회 실패</div>');
  }
}
function filterSubmitDetail(mode){
  window._submitDetailFilter=mode;
  var name=document.querySelector('#modalContent h2');
  if(name){
    var n=name.textContent.trim();
    showStudentSubmitDetail(n);
  }
}

</script>

// 호실 카드뷰의 학생 표시에 "예비" 뱃지 추가
(function(){
    var _origRender = window.render;
    if (!_origRender) return;
    
    window.render = function() {
        _origRender.apply(this, arguments);
        // 렌더링 후 예비입사자 표시 적용
        setTimeout(applyPendingBadges, 50);
    };
    
    function applyPendingBadges() {
        // 호실 카드뷰의 모든 멤버 div를 찾아서 예비 뱃지 추가
        var allMemberDivs = document.querySelectorAll('[data-photo-name]');
        allMemberDivs.forEach(function(thumbDiv) {
            var name = thumbDiv.getAttribute('data-photo-name');
            if (!name) return;
            
            // 부모 요소 (학생 한 명을 감싸는 div)
            var parent = thumbDiv.parentElement;
            if (!parent) return;
            
            // 이미 예비 뱃지가 있으면 스킵
            if (parent.querySelector('.pending-badge')) return;
            
            var isPending = window._secureData.isPending(name);
            if (!isPending) return;
            
            var expDate = window._secureData.getExpectedDate(name);
            
            // 부모에 점선 테두리 적용
            parent.style.opacity = '0.7';
            parent.style.borderLeft = '3px dashed #f59e0b';
            parent.style.paddingLeft = '4px';
            
            // 이름 부분에 "예비" 뱃지 추가
            var nameDiv = parent.querySelector('div[style*="font-weight"]');
            if (nameDiv && !nameDiv.querySelector('.pending-badge')) {
                var badge = document.createElement('span');
                badge.className = 'pending-badge';
                badge.style.cssText = 'display:inline-block;background:#fef3c7;color:#92400e;font-size:10px;font-weight:800;padding:1px 5px;border-radius:4px;margin-right:4px';
                badge.textContent = '예비';
                nameDiv.insertBefore(badge, nameDiv.firstChild);
            }
            
            // 학과 표시 옆에 예정일 추가
            if (expDate) {
                var deptDivs = parent.querySelectorAll('div');
                for (var i = 0; i < deptDivs.length; i++) {
                    var d = deptDivs[i];
                    if (d.textContent && d.textContent.indexOf('[') === 0 && !d.querySelector('.pending-date')) {

                        dateSpan.textContent = ' · 예정: ' + expDate;

                        break;
                    }
                }
            }
        });
    }
    
    // 페이지 로드 후 한 번 실행
    setTimeout(applyPendingBadges, 1000);
})();

// ============ [강력 도구] 특정 이름의 모든 잔재 데이터 강제 삭제 (콘솔에서 호출 가능) ============
window.forceDeleteStudent = async function(targetName) {
    if (!targetName) { console.error('이름을 입력하세요. 예: forceDeleteStudent("이현우")'); return; }
    console.log('=== [강제삭제] 시작:', targetName, '===');
    var report = { passwords: false, roomNumbers: false, deptsRemovedFrom: [] };
    try {
        // 1) passwords 삭제
        var pSnap = await db.collection('passwords').doc(targetName).get();
        if (pSnap.exists) {
            await db.collection('passwords').doc(targetName).delete();
            report.passwords = true;
            console.log('  ✓ passwords/' + targetName + ' 삭제됨');
        } else { console.log('  - passwords/' + targetName + ' 없음'); }
        // 2) roomNumbers 삭제
        var rSnap = await db.collection('roomNumbers').doc(targetName).get();
        if (rSnap.exists) {
            await db.collection('roomNumbers').doc(targetName).delete();
            report.roomNumbers = true;
            console.log('  ✓ roomNumbers/' + targetName + ' 삭제됨');
        } else { console.log('  - roomNumbers/' + targetName + ' 없음'); }
        // 3) 모든 학과 students 배열에서 제거
        var allStudentsSnap = await db.collection('students').get();
        for (var i = 0; i < allStudentsSnap.docs.length; i++) {
            var doc = allStudentsSnap.docs[i];
            var arr = doc.data().students || [];
            if (arr.indexOf(targetName) !== -1) {
                var newArr = arr.filter(function(n) { return n !== targetName; });
                await db.collection('students').doc(doc.id).set({ students: newArr, updatedAt: new Date().toISOString() });
                report.deptsRemovedFrom.push(doc.id);
                console.log('  ✓ students/' + doc.id + ' 에서 제거됨');
            }
        }
        console.log('=== [강제삭제] 완료:', report, '===');
        if (typeof showToast === 'function') showToast(targetName + ' 완전 삭제 완료 - 다시 등록 가능', 'success');
        alert('[완전 삭제 완료]\n\n이름: ' + targetName + '\npasswords 삭제: ' + (report.passwords ? '✓' : '✗없음') + '\nroomNumbers 삭제: ' + (report.roomNumbers ? '✓' : '✗없음') + '\nstudents에서 제거된 학과: ' + (report.deptsRemovedFrom.length ? report.deptsRemovedFrom.join(', ') : '없음') + '\n\n이제 예비 입사자로 다시 등록해보세요.');
        return report;
    } catch (e) {
        console.error('[강제삭제] 실패:', e);
        alert('강제 삭제 실패: ' + (e.message || e.code));
    }
};

window.diagnoseStudent = async function(targetName) {
    if (!targetName) { console.error('이름을 입력하세요. 예: diagnoseStudent("이현우")'); return; }
    console.log('=== [진단] 시작:', targetName, '===');
    try {
        var p = await db.collection('passwords').doc(targetName).get();

        var foundInDepts = [];
        sSnap.docs.forEach(function(d) {

        msg += 'roomNumbers 문서: ' + (r.exists ? '존재 (' + JSON.stringify(r.data()) + ')' : '없음') + '\n\n';

        alert('진단 실패: ' + (e.message || e.code));
    }
};

async function submitPendingStudent() {
    var dept = document.getElementById('pendingDept').value;
    var name = document.getElementById('pendingName').value.trim();
    var room = document.getElementById('pendingRoom').value.trim();
    var pw = document.getElementById('pendingPw').value.trim();
    var birthYear = document.getElementById('pendingBirth').value.trim();
    var expDate = document.getElementById('pendingExpDate').value;
    
    if (!dept || !name || !pw) { showToast('학과, 이름, 비밀번호는 필수입니다', 'warning'); return; }
    if (pw.length < 4) { showToast('비밀번호는 4자리 이상', 'warning'); return; }
    if (!expDate) { showToast('입사 예정일을 선택하세요', 'warning'); return; }
    
    // 중복 체크 - 어느 학과에 있는지 명확하게 표시
    var existsInDept = '';
    departments.forEach(function(d) {
        if ((students[d] || []).includes(name)) existsInDept = d;
    });
    if (existsInDept) {
        showToast('이미 [' + existsInDept + ']에 "' + name + '"이(가) 등록되어 있습니다', 'warning');
        return;
    }
    
    // 호실 중복 체크 (고아 체크 이전에)
    if (room) {
        var rc = 0;
        var roomOccupants = [];
        departments.forEach(function(d2) {
            (students[d2] || []).forEach(function(n2) {
                if (window._secureData.getRoomNumber(n2) === room) {
                    rc++;
                    roomOccupants.push(n2 + '(' + d2 + ')');
                }
            });
        });
        if (rc >= 2) {
            showToast(room + '호 정원 초과: ' + roomOccupants.join(', '), 'warning');
            return;
        }
    }
    
    // 고아 데이터 체크 및 강제 정리 (await로 완전 동기 처리)
    try {
        var orphanCheck = await db.collection('passwords').doc(name).get();
        var orphanRoomCheck = await db.collection('roomNumbers').doc(name).get();
        if (orphanCheck.exists || orphanRoomCheck.exists) {
            var prevDept = '';
            if (orphanRoomCheck.exists && orphanRoomCheck.data().department) prevDept = orphanRoomCheck.data().department;
            else if (orphanCheck.exists && orphanCheck.data().department) prevDept = orphanCheck.data().department;
            var proceed = confirm('"' + name + '"의 이전 등록 데이터가 남아있습니다.' + (prevDept ? '\n(이전 학과: ' + prevDept + ')' : '') + '\n\n⚠더 강력한 방법으로 완전 삭제 후 등록될 것입니다.\n계속하시겠습니까?');
            if (!proceed) {
                showToast('등록 취소됨', 'info');
                return;
            }
            // ★ 강제삭제: forceDeleteStudent를 await로 호출 (각 삭제를 개별 await로 순차 실행)
            console.log('[예비등록] 고아 강제 정리 시작:', name);
            try {
                if (orphanCheck.exists) await db.collection('passwords').doc(name).delete();
                if (orphanRoomCheck.exists) await db.collection('roomNumbers').doc(name).delete();
                // 모든 학과 students 배열에서 제거 (Firestore에서 직접 조회 - stale 데이터 회피)
                var allDeptSnap = await db.collection('students').get();
                for (var ai = 0; ai < allDeptSnap.docs.length; ai++) {
                    var ddoc = allDeptSnap.docs[ai];
                    var darr = ddoc.data().students || [];
                    if (darr.indexOf(name) !== -1) {
                        var fa = darr.filter(function(n) { return n !== name; });
                        await db.collection('students').doc(ddoc.id).set({ students: fa, updatedAt: new Date().toISOString() });
                        console.log('  ✓ students/' + ddoc.id + ' 에서 ' + name + ' 제거');
                    }
                }
                console.log('[예비등록] 고아 정리 완료');
                // onSnapshot 반영 대기 (충분한 시간)
                await new Promise(function(r) { setTimeout(r, 800); });
            } catch (cleanupErr) {
                console.error('[예비등록] 고아 정리 실패:', cleanupErr);
                alert('고아 데이터 정리 실패: ' + (cleanupErr.message || cleanupErr.code) + '\n\nF12 콘솔에서 forceDeleteStudent("' + name + '") 을 실행하세요.');
                return;
            }
        }
    } catch (e) {
        console.warn('[예비등록] 고아 체크 실패:', e);
    }
    
    // 입사자 등록 (각 쓰기를 개별로 await - batch 대신 개별 실행으로 실패되는 쓰기 식별 가능)
    try {
        console.log('[예비등록] 실제 등록 시작:', { name: name, dept: dept, room: room, expDate: expDate });
        var todayDate = getCurrentDate();
        var ageVal = null;
        if (birthYear) {
            var by = parseInt(birthYear);
            if (by >= 1950 && by <= 2015) { ageVal = new Date().getFullYear() - by; }
            else if (by >= 0 && by <= 99) { var fullYear = by <= 30 ? 2000 + by : 1900 + by; ageVal = new Date().getFullYear() - fullYear; }
        }
        
        // 1) roomNumbers 새로 쓰기 (완전 덮어쓰기)
        var roomData = {
            department: dept,
            registeredDate: todayDate,
            status: 'pending',
            expectedMoveInDate: expDate,
            pendingCreatedAt: new Date().toISOString(),
            updatedAt: new Date().toISOString()
        };
        if (room) roomData.room = room;
        if (ageVal) roomData.age = ageVal;
        await db.collection('roomNumbers').doc(name).set(roomData);
        console.log('  ✓ roomNumbers 쓰기 완료');
        
        // 2) passwords 새로 쓰기
        await db.collection('passwords').doc(name).set({
            password: pw,
            department: dept,
            registeredDate: todayDate,
            status: 'pending',
            updatedAt: new Date().toISOString()
        });
        console.log('  ✓ passwords 쓰기 완료');
        
        // ★ 예방 핵심: 재등록 시 잘못된 잔여 퇴사이력 자동 정리 → 호실/통계 오류 재발 차단
        try {
            var cleared = await cleanupResignHistory(name);
            if (cleared > 0) console.log('  ✓ 쟔여 퇴사이력 ' + cleared + '건 자동 정리');
        } catch (cleanErr) { console.warn('  ⚠ 잔여 이력 정리 실패 (등록은 완료):', cleanErr); }
        
        // 3) students 입니어 - Firestore에서 직접 최신 데이터 조회 (stale 데이터 회피)
        var deptDoc = await db.collection('students').doc(dept).get();
        var currentDeptList = (deptDoc.exists && deptDoc.data().students) ? deptDoc.data().students : [];
        var updated = currentDeptList.indexOf(name) !== -1
            ? currentDeptList.slice()
            : currentDeptList.concat([name]);
        // 호실 기준 정렬 (room 데이터 조회는 secureData 대신 각자 실시간 fallback)
        updated.sort(function(a, b) {
            var ra = parseInt((a === name ? room : (window._secureData.getRoomNumber(a) || '999')) || '999');
            var rb = parseInt((b === name ? room : (window._secureData.getRoomNumber(b) || '999')) || '999');
            return ra - rb;
        });
        await db.collection('students').doc(dept).set({ students: updated, updatedAt: new Date().toISOString() });
        console.log('  ✓ students[' + dept + '] 쓰기 완료:', updated);
        
        // ★ 핵심: onSnapshot 동기화 지연을 회피하기 위해 클라이언트 students 객체를 직접 갱신
        // (Firestore onSnapshot이 늦게 도착해도 화면은 이미 갱신됨)
        if (typeof students === 'object' && students !== null) {
            students[dept] = updated.slice();
        }
        // 클라이언트 캐시에도 종속 동기화 (Firestore 직접 재조회)
        try {
            var verifySnap = await db.collection('students').doc(dept).get();
            if (verifySnap.exists) {
                var serverList = verifySnap.data().students || [];
                students[dept] = serverList.slice();
                console.log('  ✓ 클라이언트 캐시 직접 동기화 완료:', serverList.length + '명');
            }
        } catch (verifyErr) {
            console.warn('  ⚠ 검증 조회 실패 (등록은 완료됨):', verifyErr);
        }
        
        closeModal();
        showToast(name + ' 예비 입사자 등록 완료 ✓', 'success');
        showSuccessAnimation('예비 입사자 등록', name + ' · 예정일 ' + expDate);
        // 즉시 화면 갱신 (setTimeout 제거 - students는 이미 위에서 갱신됨)
        if (typeof render === 'function') render();
        // 추가 안전장치: 1초 뒤 다시 한번 갱신
        setTimeout(function() {
            if (typeof updateStudentsList === 'function') updateStudentsList();
            if (typeof render === 'function') render();
        }, 1000);
    } catch (e) {
        console.error('[예비등록] 등록 실패:', e);
        showToast('등록 실패: ' + (e.message || e.code || '알 수 없는 오류'), 'error');
        alert('예비입사자 등록 실패\n\n오류 메시지: ' + (e.message || e.code || JSON.stringify(e)) + '\n\n▶ 해결 방법:\n1. F12 를 눌러 개발자도구 열기\n2. Console 탭에 다음 명령 입력:\n   diagnoseStudent("' + name + '")\n3. 조회 결과 확인 후 필요시:\n   forceDeleteStudent("' + name + '")\n4. 다시 등록 시도');
    }
}

// ============ 예비입사자 입사 처리 ============
async function confirmMoveIn(name) {
    var dept = '';
    departments.forEach(function(d) {
        if ((students[d] || []).includes(name)) dept = d;
    });
    if (!dept) { showToast('학과 정보를 찾을 수 없습니다', 'error'); return; }
    
    var today = getCurrentDate();
    var room = window._secureData.getRoomNumber(name) || '미배정';
    
    openConfirmModal('입사 처리',
        '<b>' + escapeHtml(name) + '</b>님을 정식 입사 처리합니다.<br><br>' +
        '학과: ' + escapeHtml(dept) + '<br>' +
        '호실: ' + escapeHtml(room) + '<br>' +
        '실제 입사일: <b>' + today + '</b>로 등록됩니다.',
        async function() {
            try {
                var batch = db.batch();
                batch.update(db.collection('roomNumbers').doc(name), {
                    status: 'active',
                    registeredDate: today,
                    movedInAt: new Date().toISOString(),
                    updatedAt: new Date().toISOString()
                });
                batch.update(db.collection('passwords').doc(name), {
                    status: 'active',
                    registeredDate: today,
                    updatedAt: new Date().toISOString()
                });
                await batch.commit();
                showToast(name + ' 입사 처리 완료', 'success');
                showSuccessAnimation('입사 처리 완료', name + ' · ' + today + ' 입사');
                render();
            } catch (e) {
                showToast('입사 처리 실패: ' + e.message, 'error');
            }
        }, '입사 처리'
    );
}

// ============ 예비입사자 정보 수정 ============
async function editPendingStudent(name) {
    var currentRoom = window._secureData.getRoomNumber(name) || '';
    var currentExpDate = window._secureData.getExpectedDate(name) || '';
    
    openInputModal('예비 입사자 수정', [
        { label: '호실', type: 'text', value: currentRoom, placeholder: '예: 301' },
        { label: '입사 예정일', type: 'date', value: currentExpDate }
    ], async function() {
        var newRoom = document.getElementById('modalInput0').value.trim();
        var newDate = document.getElementById('modalInput1').value;
        if (!newDate) { showToast('입사 예정일을 입력하세요', 'warning'); return; }
        
        if (newRoom && newRoom !== currentRoom) {
            var rc = 0;
            departments.forEach(function(d2) {
                (students[d2] || []).forEach(function(n2) {
                    if (n2 !== name && window._secureData.getRoomNumber(n2) === newRoom) rc++;
                });
            });
            if (rc >= 2) { showToast(newRoom + '호는 이미 2명이 배정되어 있습니다', 'warning'); return; }
        }
        
        try {
            var updateData = {
                expectedMoveInDate: newDate,
                updatedAt: new Date().toISOString()
            };
            if (newRoom) updateData.room = newRoom;
            await db.collection('roomNumbers').doc(name).update(updateData);
            closeModal();
            showToast(name + ' 정보 수정 완료', 'success');
        } catch (e) {
            showToast('수정 실패', 'error');
        }
    });
}

// ============ 예비입사자 등록 취소 ============
async function cancelPendingStudent(name, dept) {
    openConfirmModal('예비 등록 취소',
        '<b>' + escapeHtml(name) + '</b>님의 예비 입사 등록을 취소합니다.<br><br>' +
        '<span class="text-danger-600">이 학생의 모든 데이터가 삭제됩니다.</span><br>' +
        '<span class="text-xs text-gray-500">(퇴사 이력에는 남지 않습니다)</span>',
        async function() {
            try {
                var batch = db.batch();
                var updated = (window._secureData.getStudentsByDept(dept) || []).filter(function(s) { return s !== name; });
                batch.set(db.collection('students').doc(dept), { students: updated, updatedAt: new Date().toISOString() });
                batch.delete(db.collection('roomNumbers').doc(name));
                batch.delete(db.collection('passwords').doc(name));
                await batch.commit();
                showToast(name + ' 예비 등록 취소 완료', 'success');
                render();
            } catch (e) {
                showToast('취소 실패: ' + e.message, 'error');
            }
        }, '취소', '돌아가기'
    );
}

// ============ 입사 예정일 도래자 일괄 처리 ============
async function autoConfirmDueMoveIns() {
    var today = getCurrentDate();
    var dueList = [];
    // ★ _secureData 기준으로 구성 (students 캠시 회피)
    var _allStuD = window._secureData.getAllStudents();
    var _seenD = {};
    Object.keys(_allStuD).forEach(function(dept) {
        if (dept === '_guest') return;
        (_allStuD[dept] || []).forEach(function(name) {
            if (_seenD[name]) return;
            _seenD[name] = true;
            if (window._secureData.isPending(name)) {
                var expDate = window._secureData.getExpectedDate(name);
                if (expDate && expDate <= today) {
                    dueList.push({ name: name, dept: dept, expDate: expDate });
                }
            }
        });
    });
    departments.forEach(function(dept) {
        (students[dept] || []).forEach(function(name) {
            if (_seenD[name]) return;
            _seenD[name] = true;
            if (window._secureData.isPending(name)) {
                var expDate = window._secureData.getExpectedDate(name);
                if (expDate && expDate <= today) {
                    dueList.push({ name: name, dept: dept, expDate: expDate });
                }
            }
        });
    });
    
    if (dueList.length === 0) {
        showToast('입사 예정일이 도래한 예비입사자가 없습니다', 'info');
        return;
    }
    
    var listHtml = dueList.map(function(p) {
        return '• ' + escapeHtml(p.name) + ' (' + escapeHtml(p.dept) + ') - 예정일: ' + escapeHtml(p.expDate);
    }).join('<br>');
    
    openConfirmModal('일괄 입사 처리',
        '<b>' + dueList.length + '명</b>의 입사 예정일이 도래했습니다.<br><br>' +
        '<div class="text-sm text-left bg-surface-50 rounded-xl p-3 max-h-40 overflow-y-auto">' + listHtml + '</div><br>' +
        '모두 입사 처리할까요?<br>(등록일은 오늘 ' + today + '로 갱신됩니다)',
        async function() {
            try {
                var batch = db.batch();
                dueList.forEach(function(p) {
                    batch.update(db.collection('roomNumbers').doc(p.name), {
                        status: 'active',
                        registeredDate: today,
                        movedInAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    });
                    batch.update(db.collection('passwords').doc(p.name), {
                        status: 'active',
                        registeredDate: today,
                        updatedAt: new Date().toISOString()
                    });
                });
                await batch.commit();
                showToast(dueList.length + '명 일괄 입사 처리 완료', 'success');
                showSuccessAnimation('일괄 입사 처리', dueList.length + '명 입사 완료');
                render();
            } catch (e) {
                showToast('일괄 처리 실패: ' + e.message, 'error');
            }
        }, '일괄 처리'
    );
}

// ============ 예비입사자 관리 플로팅 버튼 ============
function showPendingManagePanel() {
    var pendingList = [];
    // ★ _secureData 기준으로 구성 (students 캠시 동기화 문제 회피)
    var _allStuP = window._secureData.getAllStudents();
    var _seenNames = {};
    Object.keys(_allStuP).forEach(function(dept) {
        if (dept === '_guest') return;
        (_allStuP[dept] || []).forEach(function(name) {
            if (_seenNames[name]) return;
            _seenNames[name] = true;
            if (window._secureData.isPending(name)) {
                pendingList.push({
                    dept: dept,
                    name: name,
                    room: window._secureData.getRoomNumber(name) || '',
                    expectedDate: window._secureData.getExpectedDate(name) || ''
                });
            }
        });
    });
    // fallback: students 객체에는 있지만 _allStuP에 누락된 경우
    departments.forEach(function(dept) {
        (students[dept] || []).forEach(function(name) {
            if (_seenNames[name]) return;
            _seenNames[name] = true;
            if (window._secureData.isPending(name)) {
                pendingList.push({
                    dept: dept,
                    name: name,
                    room: window._secureData.getRoomNumber(name) || '',
                    expectedDate: window._secureData.getExpectedDate(name) || ''
                });
            }
        });
    });
    
    var today = getCurrentDate();
    pendingList.sort(function(a, b) { return (a.expectedDate || '').localeCompare(b.expectedDate || ''); });
    
    var h = '<div class="p-6">';
    h += '<div class="flex items-center justify-between mb-4">';
    h += '<h3 class="text-xl font-bold text-gray-900"><i class="fas fa-clock text-yellow-500 mr-2"></i>예비 입사자 관리';
    if (pendingList.length > 0) h += ' <span class="text-base text-yellow-600">(' + pendingList.length + '명)</span>';
    h += '</h3></div>';
    
    h += '<div class="grid grid-cols-2 gap-2 mb-4">';
    h += '<button onclick="closeModal();showAddPendingStudentModal()" class="py-3 bg-yellow-500 text-white rounded-xl font-bold text-sm btn-press shadow-button"><i class="fas fa-plus mr-1"></i>예비 등록</button>';
    if (pendingList.length > 0) {
        h += '<button onclick="closeModal();autoConfirmDueMoveIns()" class="py-3 bg-success-500 text-white rounded-xl font-bold text-sm btn-press shadow-button"><i class="fas fa-magic mr-1"></i>예정일 도래 일괄처리</button>';
    } else {
        h += '<button class="py-3 bg-surface-100 text-gray-400 rounded-xl font-bold text-sm" disabled><i class="fas fa-magic mr-1"></i>일괄처리</button>';
    }
    h += '</div>';
    
    if (pendingList.length === 0) {
        h += '<div class="text-center py-8 text-gray-400 bg-surface-50 rounded-2xl border border-surface-200"><i class="fas fa-inbox text-3xl mb-2"></i><div class="text-sm">예비 입사자가 없습니다</div><div class="text-xs mt-1">"예비 등록" 버튼으로 등록하세요</div></div>';
    } else {
        h += '<div class="space-y-2 max-h-[55vh] overflow-y-auto">';
        pendingList.forEach(function(p) {
            var isDue = p.expectedDate && p.expectedDate <= today;
            var bgClass = isDue ? 'bg-orange-50 border-orange-300' : 'bg-yellow-50 border-yellow-200';
            
            h += '<div class="p-4 rounded-xl border-2 ' + bgClass + '">';
            h += '<div class="flex items-center justify-between mb-2 flex-wrap gap-2">';
            h += '<div class="flex items-center gap-2 flex-wrap">';
            if (p.room) h += '<span class="font-bold text-lg text-gray-800">' + escapeHtml(p.room) + '호</span>';
            h += '<span class="text-base font-bold text-gray-700">' + escapeHtml(p.name) + '</span>';
            h += '<span class="text-xs text-gray-500">[' + escapeHtml(p.dept) + ']</span>';
            if (isDue) h += '<span class="px-2 py-0.5 bg-orange-500 text-white text-xs font-bold rounded-full"><i class="fas fa-bell mr-1"></i>입사일 도래</span>';
            h += '</div></div>';
            h += '<div class="text-sm text-gray-600 mb-3"><i class="fas fa-calendar-check mr-1 text-yellow-600"></i>입사 예정일: <b>' + escapeHtml(p.expectedDate || '미정') + '</b></div>';
            h += '<div class="flex gap-2">';
            h += '<button onclick="closeModal();confirmMoveIn(\'' + safeAttr(p.name) + '\')" class="flex-1 py-2.5 bg-success-500 text-white rounded-xl text-sm font-bold btn-press shadow-button"><i class="fas fa-check-circle mr-1"></i>입사 처리</button>';
            h += '<button onclick="closeModal();editPendingStudent(\'' + safeAttr(p.name) + '\')" class="px-4 py-2.5 bg-info-50 text-info-600 rounded-xl text-sm font-bold btn-press border border-info-200"><i class="fas fa-edit"></i></button>';
            h += '<button onclick="closeModal();cancelPendingStudent(\'' + safeAttr(p.name) + '\',\'' + safeAttr(p.dept) + '\')" class="px-4 py-2.5 bg-danger-50 text-danger-600 rounded-xl text-sm font-bold btn-press border border-danger-200"><i class="fas fa-times"></i></button>';
            h += '</div></div>';
        });
        h += '</div>';
    }
    
    h += '<button onclick="closeModal()" class="w-full mt-4 py-3 bg-surface-100 text-gray-500 rounded-2xl font-bold text-sm btn-press">닫기</button>';
    h += '</div>';
    
    openModal(h);
}

// ============ 관리자 화면에 "예비 입사자" 플로팅 버튼 추가 ============
(function(){
    function addPendingFloatBtn() {
        // 관리자 모드가 아니면 버튼 제거
        if (!isAdminLoggedIn || isOfficeLoggedIn || currentMode !== 'admin') {
            var existing = document.getElementById('pendingFloatBtn');
            if (existing) existing.remove();
            return;
        }
        
        // 이미 있으면 카운트만 업데이트
        var existing = document.getElementById('pendingFloatBtn');
        var pendingCount = 0;
        var dueCount = 0;
        var today = getCurrentDate();
        
        // ★ _secureData 기준으로 카운트 (students 캠시 회피)
        var _allStuF = window._secureData.getAllStudents();
        var _seenF = {};
        Object.keys(_allStuF).forEach(function(dept) {
            if (dept === '_guest') return;
            (_allStuF[dept] || []).forEach(function(name) {
                if (_seenF[name]) return;
                _seenF[name] = true;
                if (window._secureData.isPending(name)) {
                    pendingCount++;
                    var expDate = window._secureData.getExpectedDate(name);
                    if (expDate && expDate <= today) dueCount++;
                }
            });
        });
        departments.forEach(function(dept) {
            (students[dept] || []).forEach(function(name) {
                if (_seenF[name]) return;
                _seenF[name] = true;
                if (window._secureData.isPending(name)) {
                    pendingCount++;
                    var expDate = window._secureData.getExpectedDate(name);
                    if (expDate && expDate <= today) dueCount++;
                }
            });
        });
        
        if (existing) {
            var countEl = existing.querySelector('.pending-count');
            var dueEl = existing.querySelector('.pending-due');
            if (countEl) countEl.textContent = pendingCount;
            if (dueEl) {
                if (dueCount > 0) {
                    dueEl.style.display = 'flex';
                    dueEl.textContent = dueCount;
                } else {
                    dueEl.style.display = 'none';
                }
            }
            return;
        }
        
        // 버튼 생성
        var btn = document.createElement('button');
        btn.id = 'pendingFloatBtn';
        btn.onclick = function() { showPendingManagePanel(); };
        btn.style.cssText = 'position:fixed;bottom:24px;right:24px;width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,#fbbf24,#f59e0b);color:white;border:none;box-shadow:0 8px 24px rgba(245,158,11,0.4);cursor:pointer;z-index:40;display:flex;align-items:center;justify-content:center;transition:transform 0.2s;font-size:0';
        btn.innerHTML = 
            '<i class="fas fa-clock" style="font-size:24px;color:white"></i>' +
            '<span class="pending-count" style="position:absolute;top:-4px;right:-4px;min-width:24px;height:24px;background:#dc2626;color:white;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;padding:0 6px;border:2px solid white">' + pendingCount + '</span>' +
            '<span class="pending-due" style="position:absolute;bottom:-4px;right:-4px;min-width:24px;height:24px;background:#ea580c;color:white;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;padding:0 6px;border:2px solid white;display:' + (dueCount > 0 ? 'flex' : 'none') + ';animation:pulseSoft 1.5s ease-in-out infinite">' + dueCount + '</span>';
        
        btn.onmouseover = function() { this.style.transform = 'scale(1.1)'; };
        btn.onmouseout = function() { this.style.transform = 'scale(1)'; };
        
        // 툴팁
        btn.title = '예비 입사자 관리';
        
        document.body.appendChild(btn);
    }
    
    // render 함수 후크
    var _origRender = window.render;
    window.render = function() {
        _origRender.apply(this, arguments);
        setTimeout(addPendingFloatBtn, 100);
    };
    
    // 페이지 로드 후 한 번 실행
    setTimeout(addPendingFloatBtn, 1500);
