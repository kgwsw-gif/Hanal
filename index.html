// === 오래된 로그 자동 정리 함수 (90일 이상 자동 삭제) ===
async function cleanupOldLogs(){
    try{
        // 하루 1회만 실행 (성능 보호)
        var today = new Date().toISOString().slice(0,10);
        var lastRun = localStorage.getItem('lastLogCleanup');
        if(lastRun === today) return;
        
        // 90일 이전 기준 시점 계산
        var cutoff = new Date();
        cutoff.setDate(cutoff.getDate() - 90);
        var cutoffISO = cutoff.toISOString();
        
        var totalDeleted = 0;
        var targetCollections = ['loginLogs', 'passwordChangeLogs'];
        
        for(var ci=0; ci<targetCollections.length; ci++){
            var colName = targetCollections[ci];
            try{
                var snap = await db.collection(colName)
                    .where('timestamp', '<', cutoffISO)
                    .limit(400)
                    .get();
                if(snap.empty) continue;
                
                var batch = db.batch();
                var count = 0;
                snap.docs.forEach(function(d){
                    batch.delete(d.ref);
                    count++;
                });
                if(count > 0){
                    await batch.commit();
                    totalDeleted += count;
                    console.log('['+colName+'] '+count+'건 자동 삭제 (90일 경과)');
                }
            } catch(colErr){
                console.warn('['+colName+'] 정리 실패:', colErr.message);
            }
        }
        
        localStorage.setItem('lastLogCleanup', today);
        if(totalDeleted > 0){
            console.log('✅ 로그 자동 정리 완료: 총 '+totalDeleted+'건 삭제');
        } else {
            console.log('✅ 로그 자동 정리 완료: 삭제 대상 없음');
        }
    } catch(e){
        console.error('로그 자동 정리 오류:', e.message);
    }
}

function updateStudentsList(){
    students={};
    var today=getCurrentDate();
    var approved=resignRequests.filter(function(r){return r.status==='approved'&&r.approvedDate&&r.approvedDate<=today});
    // ★ _secureData.getAllStudents() 이용하여 전체 데이터 가져오기 (departments 누락 이슈 회피)
    var allStu=window._secureData.getAllStudents()||{};
    var allDeptKeys=Object.keys(allStu);
    // departments 배열과 allStu의 key를 모두 고려
    var deptSet={};
    departments.forEach(function(d){deptSet[d]=true});
    allDeptKeys.forEach(function(d){if(d!=='_guest')deptSet[d]=true});
    Object.keys(deptSet).forEach(function(dept){
        var original=(allStu[dept]||window._secureData.getStudentsByDept(dept)||[]);
        students[dept]=original.filter(function(name){return !approved.some(function(r){return r.department===dept&&r.name===name})});
    });
    var guestList=allStu['_guest']||window._secureData.getStudentsByDept('_guest')||[];
    if(guestList.length>0) students['_guest']=guestList;
}
function getApprovedResignSet(targetDate){
    var baseDate=targetDate||getCurrentDate();
    var set=new Set();
    // ★ 예방: roomNumbers에 실제로 살아있는 사람은 approvedSet에서 자동 제외 (고아 데이터 방어)
    var roomEntries=(window._secureData&&window._secureData.getAllRoomEntries)?window._secureData.getAllRoomEntries():{};
    (typeof resignRequests!=='undefined'?resignRequests:[]).filter(function(r){return r.status==='approved'&&r.approvedDate&&r.approvedDate<=baseDate}).forEach(function(r){
        // roomNumbers에 해당 이름이 있고 status가 'resigned'가 아니면 → 고아 이력이므로 무시
        var entry=roomEntries[r.name];
        if(entry&&entry.status&&entry.status!=='resigned'){
            // 고아 이력 감지 → 통계에서 제외하지 않음 (추후 자동정리에서 제거됨)
            return;
        }
        set.add(r.department+'_'+r.name);
    });
    return set;
}
// ★ 공통 헬퍼: 특정 이름의 잔여 resignRequests 레코드 일괄 삭제 (재등록 시 호출)
async function cleanupResignHistory(name,opts){
    if(!name||!db) return 0;
    opts=opts||{};
    try{
        var snap=await db.collection('resignRequests').where('name','==',name).get();
        if(snap.empty) return 0;
        var batch=db.batch();var n=0;
        snap.forEach(function(d){
            var data=d.data();
            // 재등록 시점보다 과거 이력은 모두 제거 (status 무관)
            // 하지만 onlyApproved=true이면 approved만 제거
            if(opts.onlyApproved&&data.status!=='approved') return;
            batch.delete(d.ref);n++;
        });
        if(n>0){
            await batch.commit();
            console.log('[cleanupResignHistory] '+name+' 쟔여 퇴사이력 '+n+'건 자동 정리');
        }
        return n;
    }catch(e){
        console.warn('[cleanupResignHistory] 실패:',name,e);
        return 0;
    }
}
// ★ 자가진단: roomNumbers에 살아있는데 resignRequests에 approved 이력이 남은 orphan 명단 반환
function findOrphanResigns(){
    var entries=(window._secureData&&window._secureData.getAllRoomEntries)?window._secureData.getAllRoomEntries():{};
    var problems=[];
    (typeof resignRequests!=='undefined'?resignRequests:[]).forEach(function(r){
        if(r.status!=='approved') return;
        var e=entries[r.name];
        if(e&&e.status!=='resigned'){
            problems.push({id:r.id,name:r.name,dept:r.department,room:e.room,status:e.status});
        }
    });
    return problems;
}
// ★ 일괄 자동 정리 (관리자가 수동 호출 가능)
window.cleanupAllOrphanResigns=async function(silent){
    var problems=findOrphanResigns();
    if(problems.length===0){if(!silent) console.log('✓ 고아 퇴사이력 없음'); return 0;}
    if(!silent) console.warn('⚠ 고아 퇴사이력 '+problems.length+'건 발견:',problems);

};
function getDeptStudentList(dept,targetDate,includePending){
    var baseDate=targetDate||getCurrentDate();
    var allowPending=!!includePending;
    var names=[];var seen={};
    function add(name){if(!name||seen[name])return;seen[name]=true;names.push(name)}
    var allStu=window._secureData.getAllStudents()||{};
    (allStu[dept]||[]).forEach(add);
    var roomEntries=window._secureData.getAllRoomEntries?window._secureData.getAllRoomEntries():{};
    Object.keys(roomEntries).forEach(function(name){
        var info=roomEntries[name]||{};
        var mappedDept=info.department||window._secureData.getDepartmentByName(name);
        if(mappedDept===dept) add(name);
    });
    var approvedSet=getApprovedResignSet(baseDate);
    return names.filter(function(name){
        if(approvedSet.has(dept+'_'+name)) return false;
        var regDate=window._secureData.getRegisteredDate(name);
        if(regDate&&regDate>baseDate) return false;
        if(!allowPending&&window._secureData.isPending(name)) return false;
        return true;
    });
}
function findDeptByNameFallback(name){
    if(!name) return null;
    // 1) passwords/roomNumbers 에서 department 필드
    var d=window._secureData.getDepartmentByName?window._secureData.getDepartmentByName(name):null;
    if(d) return d;
    // 2) _stu (students 컴렉션)에서 역검색
    var allStu=window._secureData.getAllStudents()||{};
    var keys=Object.keys(allStu);
    for(var i=0;i<keys.length;i++){
        if(keys[i]==='_guest') continue;
        if((allStu[keys[i]]||[]).indexOf(name)!==-1) return keys[i];
    }
    // 3) 클라이언트 students 객체에서 역검색
    if(typeof students==='object'&&students){
        var dks=Object.keys(students);
        for(var j=0;j<dks.length;j++){
            if(dks[j]==='_guest') continue;
            if((students[dks[j]]||[]).indexOf(name)!==-1) return dks[j];
        }
    }
    return null;
}
function buildRoomOccupancyMap(targetDate,includePending){
    var baseDate=targetDate||getCurrentDate();
    var allowPending=(includePending!==false);
    var roomMap={};
    // ★ 호실 카드 렌더링은 "퇴사 미래일" 도 무시하지 않고, status='resigned'만 직접 차단
    //   (resignRequests에 잘못된 approved 이력이 있어도 호실 카드는 영향 받지 않게)
    var roomEntries=window._secureData.getAllRoomEntries?window._secureData.getAllRoomEntries():{};
    Object.keys(roomEntries).forEach(function(name){
        var info=roomEntries[name]||{};
        var room=info.room||window._secureData.getRoomNumber(name);
        if(!room) return; // 호실이 없으면 표시 불가
        var dept=info.department||findDeptByNameFallback(name)||'미분류';
        var regDate=info.registeredDate||window._secureData.getRegisteredDate(name);
        if(regDate&&regDate>baseDate) return;
        var status=info.status||window._secureData.getStatus(name)||'active';
        if(status==='resigned') return; // 직접 퇴사 표식만 차단
        if(!allowPending&&status==='pending') return;
        if(!roomMap[room]) roomMap[room]=[];
        if(!roomMap[room].some(function(m){return m.name===name})) roomMap[room].push({name:name,dept:dept,status:status});
    });
    // 2단계: 학과별 students 명단에는 있는데 roomNumbers에는 없는 경우(너문)
    departments.forEach(function(dept){
        getDeptStudentList(dept,baseDate,allowPending).forEach(function(name){
            var room=window._secureData.getRoomNumber(name);
            if(!room) return;
            if(!roomMap[room]) roomMap[room]=[];
            if(!roomMap[room].some(function(m){return m.name===name})) roomMap[room].push({name:name,dept:dept,status:window._secureData.getStatus(name)||'active'});
        });
    });
    return roomMap;
}

function getAvailableDates(){

function calcAgeFromBirth(birthStr){
    if(!birthStr)return null;
    var s=String(birthStr).replace(/[^0-9]/g,'');
    var year=null;
    if(s.length===8){year=parseInt(s.substring(0,4))}
    else if(s.length===6){var yy=parseInt(s.substring(0,2));year=yy>=0&&yy<=30?2000+yy:1900+yy}
    else if(s.length===4){year=parseInt(s)}
    else if(s.length===2){var yy2=parseInt(s);year=yy2>=0&&yy2<=30?2000+yy2:1900+yy2}
    if(!year||year<1950||year>2015)return null;
    var age=new Date().getFullYear()-year;
    return age>0&&age<80?age:null;
}

function playNotifSound(){
if(!soundEnabled) return;
    try{
        var AudioCtx=window.AudioContext||window.webkitAudioContext;
        if(!AudioCtx)return;
        var ctx=new AudioCtx();
        function beep(freq,startTime){
            var osc=ctx.createOscillator();
            var gain=ctx.createGain();
            osc.connect(gain);gain.connect(ctx.destination);
            osc.type='sine';
            osc.frequency.value=freq;
            gain.gain.setValueAtTime(0.5,ctx.currentTime+startTime);
            gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+startTime+0.3);
            osc.start(ctx.currentTime+startTime);
            osc.stop(ctx.currentTime+startTime+0.3);
        }
        beep(800,0);beep(1000,0.15);beep(1200,0.3);
    }catch(e){console.log('sound error:',e)}
}var _prevSubmissionCount=null;

    endHour: 21, endMinute: 10,         // 종료: 21:10
    intervalMin: 10,                    // 10분마다
    snoozeMin: 10                       // 닫기 후 10분 대기
};
var _reminderState = {
    lastShownAt: 0,        // 마지막 표시 시각 (timestamp)
    snoozedUntil: 0,       // 스누즈 만료 시각
    isShowing: false,      // 현재 모달 표시 중인지

// 시뮬레이션 시간 가져오기 (테스트용)
function _getReminderNow() {
    if (_reminderState.testMode && _reminderState.testTime !== null) {
        var d = new Date();
        d.setHours(Math.floor(_reminderState.testTime / 60));
        d.setMinutes(_reminderState.testTime % 60);
        d.setSeconds(0);
        return d;
    }
    return new Date();
}

// 시뮬레이션 모드 ON (콘솔에서 호출)
window.testReminder = function(hourMin) {
    if (!hourMin) {
        console.log('사용법: testReminder("20:40") 또는 testReminder("21:00")');
        console.log('해제: testReminder(false)');
        return;
    }
    if (hourMin === false) {
        _reminderState.testMode = false;
        _reminderState.testTime = null;
        _reminderState.snoozedUntil = 0;
        _reminderState.lastShownAt = 0;
        console.log('✓ 시뮬레이션 모드 해제');
        return;
    }
    var parts = hourMin.split(':');
    var h = parseInt(parts[0]);
    var m = parseInt(parts[1] || '0');
    _reminderState.testMode = true;
    _reminderState.testTime = h * 60 + m;
    _reminderState.snoozedUntil = 0;
    _reminderState.lastShownAt = 0;
    console.log('✓ 시뮬레이션 시간 설정:', hourMin);
    console.log('  → 5초 안에 알림이 뜨면 정상 동작');
    setTimeout(checkSubmissionReminder, 1000);
};

// 알림 표시 조건 확인
function _shouldShowReminder() {
    // 1. 학생 모드만
    if (currentMode !== 'student' || !currentStudent) return false;

    // 2. 게스트는 제외
    if (isGuestLoggedIn) return false;

    // 3. 모달 이미 열려있으면 스킵
    if (_reminderState.isShowing) return false;

    var now = _getReminderNow();
    var nowMin = now.getHours() * 60 + now.getMinutes();
    var nowTimestamp = now.getTime();

    // 4. 스누즈 중이면 스킵
    if (nowTimestamp < _reminderState.snoozedUntil) return false;

    // 5. 시간 범위 체크 (20:40 ~ 21:10)
    var startMin = _reminderConfig.startHour * 60 + _reminderConfig.startMinute;
    var endMin = _reminderConfig.endHour * 60 + _reminderConfig.endMinute;
    if (nowMin < startMin || nowMin > endMin) return false;

    // 6. 오늘이 외박/잔류 신청일인지 (잔류 확인만 하는 날 제외)
    var todayStr = getCurrentDate();
    if (isWeekendOrHoliday(todayStr)) return false;

    // 7. 본인이 아직 제출 안 했는지 확인
    var dept = currentStudentDept();
    if (!dept) return false;
    var mySub = submissions.find(function(s) {
        return s.department === dept && s.name === currentStudent
            && s.date === todayStr && s.status !== 'cancelled';
    });
    var myOuting = outings.find(function(o) {
        return o.department === dept && o.name === currentStudent
            && o.date === todayStr && (!o.status || o.status !== 'cancelled');
    });
    if (mySub || myOuting) return false; // 이미 제출함

    // 8. 인원보고가 비활성화 상태면 알림 안 함
    var check = isSubmitAllowed();
    if (!check.allowed) return false;

    return true;
}

function getAutoOutSubmissions(targetDate) {
    var isAutoOut = isWeekendOrHoliday(targetDate);
    var realSubs = submissions.filter(function(s) { return s.date === targetDate && s.status !== 'cancelled' });
    var realOuts = outings.filter(function(o) { return o.date === targetDate && (!o.status || o.status !== 'cancelled') });
    
    if (!isAutoOut) return { submissions: realSubs, outings: realOuts };
    
    // 주말/공휴일: 미제출자를 외박으로 자동 추가
    var submittedNames = new Set();
    realSubs.forEach(function(s) { submittedNames.add(s.department + '_' + s.name) });
    realOuts.forEach(function(o) { submittedNames.add(o.department + '_' + o.name) });
    submissions.filter(function(s) { return s.date === targetDate && s.status === 'cancelled' }).forEach(function(s) { submittedNames.add(s.department + '_' + s.name) });
    
    var autoSubs = realSubs.slice(); // 복사
    
    departments.forEach(function(dept) {
        var deptStudents = (students[dept] || []).filter(function(name) {
            if (window._secureData.isPending(name)) return false;
            var regDate = window._secureData.getRegisteredDate(name);
            return !regDate || regDate <= targetDate;
        });
        deptStudents.forEach(function(name) {
            var key = dept + '_' + name;
            if (!submittedNames.has(key) && !(window._excludedAuto&&window._excludedAuto.indexOf('auto_'+dept+'_'+name)!==-1)) {
                autoSubs.push({
                    id: 'auto_' + dept + '_' + name,
                    department: dept,
                    name: name,
                    status: 'out',
                    date: targetDate,
                    timestamp: '자동처리',
                    isAuto: true
                });
            }
        });
    });
    
    return { submissions: autoSubs, outings: realOuts };
}

async function submitStatus(dept, name, status) {
    // 1단계: 오프라인이면 아예 차단
    if (!navigator.onLine) {
        showToast('인터넷 연결이 없습니다. Wi-Fi 또는 데이터를 확인 후 다시 시도해주세요.', 'error');
        if (navigator.vibrate) navigator.vibrate([300, 100, 300]);
        return;
    }

    var sd = getSelectedDate();
    var docId = sd + '_' + dept + '_' + name;

    // 23시 이후 변경 제한 (교육생만)
    if (currentMode === 'student') {
        var now = new Date();
        var existingSub = submissions.find(function(s) {
            return s.id === docId && s.status !== 'cancelled';
        });
        if (existingSub && now.getHours() >= 23) {
            showToast('23시 이후에는 신청을 변경할 수 없습니다.', 'warning');
            return;
        }
    }

    // 2단계: 제출 중 UI 잠금 (중복 클릭 방지)
    if (window._submitLock) {
        showToast('제출 처리 중입니다. 잠시만 기다려주세요.', 'info');
        return;
    }
    window._submitLock = true;

    // 로딩 표시
    var loadingOverlay = document.createElement('div');
    loadingOverlay.id = 'submitLoadingOverlay';
    loadingOverlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.3);backdrop-filter:blur(4px);display:flex;align-items:center;justify-content:center;z-index:10000';
    loadingOverlay.innerHTML = '<div style="background:white;border-radius:20px;padding:32px 40px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.2)"><i class="fas fa-spinner fa-spin" style="font-size:32px;color:#6366f1;margin-bottom:12px"></i><div style="font-size:16px;font-weight:700;color:#374151">서버에 전송 중...</div><div style="font-size:13px;color:#6b7280;margin-top:4px">잠시만 기다려주세요</div></div>';
    document.body.appendChild(loadingOverlay);

    try {
        // 3단계: 실제 서버 연결 가능 여부를 먼저 확인
        var serverReachable = await checkServerConnection();
        if (!serverReachable) {
            throw new Error('SERVER_UNREACHABLE');
        }

        // 4단계: Firestore에 저장
        await db.collection('submissions').doc(docId).set({
            department: dept,
            name: name,
            status: status,
            date: sd,
            timestamp: new Date().toLocaleTimeString('ko-KR'),
            submitDate: new Date().toISOString()
        });

        // 5단계: 서버에서 직접 읽어서 검증 (캐시 우회)
        var verified = false;
        try {
            var verifyDoc = await db.collection('submissions').doc(docId)
                .get({ source: 'server' }); // ★ 핵심: 캐시가 아닌 서버에서 직접 읽기
            if (verifyDoc.exists && verifyDoc.data().status === status) {
                verified = true;
            }
        } catch (verifyErr) {
            // 서버에서 직접 읽기 실패 = 네트워크 문제
            console.log('서버 검증 실패:', verifyErr);
            verified = false;
        }

        // 6단계: 검증 결과에 따른 처리
        if (verified) {
            // 성공 확인
            showToast(
                status === 'stay' ? '잔류(Stay) 신청 완료' : '외박(Out) 신청 완료',
                'success'
            );
            showSuccessAnimation(
                status === 'stay' ? '잔류(Stay) 신청 완료' : '외박(Out) 신청 완료',
                name + ' · ' + new Date().toLocaleTimeString('ko-KR')
            );
        } else {
            // 캐시에만 저장되고 서버에는 안 간 경우 → 캐시 데이터 삭제 시도
            try {
                await db.collection('submissions').doc(docId).delete();
            } catch (e) { /* 무시 */ }

            showToast(
                '⚠️ 인터넷 연결이 불안정합니다! 신청이 서버에 저장되지 않았습니다. Wi-Fi 또는 데이터 연결을 확인 후 다시 시도해주세요.',
                'error'
            );
            if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);

            // 실패 알림 모달
            openModal(
                '<div class="p-6 text-center">'
                + '<div style="width:70px;height:70px;margin:0 auto 16px;border-radius:50%;background:#fef2f2;display:flex;align-items:center;justify-content:center">'
                + '<i class="fas fa-wifi" style="font-size:28px;color:#dc2626"></i></div>'
                + '<h3 class="text-xl font-bold text-danger-700 mb-2">신청 실패!</h3>'
                + '<p class="text-sm text-gray-600 mb-4">인터넷 연결이 불안정하여<br>서버에 저장되지 않았습니다.</p>'
                + '<div class="bg-danger-50 border border-danger-200 rounded-xl p-4 mb-4 text-left">'
                + '<div class="text-sm font-bold text-danger-700 mb-1">해결 방법:</div>'
                + '<div class="text-sm text-danger-600">1. Wi-Fi 또는 데이터 연결을 확인하세요<br>'
                + '2. 브라우저를 새로고침하세요<br>'
                + '3. 다시 잔류/외박 버튼을 눌러주세요</div></div>'
                + '<button onclick="closeModal()" class="w-full py-3.5 bg-danger-500 text-white rounded-2xl font-bold text-base btn-press">확인</button>'
                + '</div>'
            );
        }

        render();

    } catch (e) {
        // 네트워크 에러 처리
        var errorMsg = '';
        if (e.message === 'SERVER_UNREACHABLE') {
            errorMsg = '서버에 연결할 수 없습니다. 인터넷 연결을 확인하세요.';
        } else if (e.code === 'unavailable' || e.message.includes('offline')) {
            errorMsg = '네트워크가 불안정합니다. 잠시 후 다시 시도하세요.';
        } else {
            errorMsg = '신청 실패: ' + e.message;
        }

        showToast(errorMsg, 'error');
        if (navigator.vibrate) navigator.vibrate([300, 100, 300, 100, 300]);

        // 실패 시 캐시에 남은 데이터 정리
        try {
            await db.collection('submissions').doc(docId).delete();
        } catch (delErr) { /* 무시 */ }

    } finally {
        // 잠금 해제 & 로딩 제거
        window._submitLock = false;
        var overlay = document.getElementById('submitLoadingOverlay');
        if (overlay) overlay.remove();
    }
}

// 서버 연결 상태 확인 함수
async function checkServerConnection() {
    try {
        // Firestore 서버에 가벼운 읽기 요청으로 연결 확인
        var testDoc = await Promise.race([
            db.collection('settings').doc('submitControl').get({ source: 'server' }),
            new Promise(function(_, reject) {
                setTimeout(function() { reject(new Error('TIMEOUT')); }, 5000);
            })
        ]);
        return true;
    } catch (e) {
        console.log('서버 연결 확인 실패:', e.message);
        return false;
    }
}

async function saveHvacMode(mode){try{await db.collection('settings').doc('hvacControl').set({mode:mode,updatedAt:new Date().toISOString()},{merge:true});hvacMode=mode;showToast(mode==='heating'?'난방 모드로 변경':'냉방 모드로 변경','success');render()}catch(e){showToast('저장 실패','error')}}

async function cancelHvacRequest(reqId){
    var req=hvacRequests.find(function(r){return r.id===reqId});
    if(!req)return;
    openConfirmModal('취소 요청',escapeHtml(req.room)+'호 '+(hvacMode==='heating'?'난방':'냉방')+' 신청을 취소하시겠습니까?',async function(){
        try{
            await db.collection('hvacRequests').doc(reqId).update({
                status:'cancel_requested',
                cancelRequestedBy:currentStudent,
                cancelRequestedAt:new Date().toISOString()
            });
            showToast('취소 요청 완료','success');
            render();
        }catch(e){
            showToast('취소 요청 실패','error');
        }
    },'취소 요청');
}

async function confirmCancelHvac(reqId){
    try{
        await db.collection('hvacRequests').doc(reqId).delete();
        stopHvacAlarm();
        showToast('취소 승인 완료','success');
        render();
    }catch(e){
        showToast('처리 실패','error');
    }
}

async function confirmAllHvac(){
    var pending=hvacRequests.filter(function(r){return r.status==='pending'});
    if(pending.length===0){showToast('대기 중인 신청이 없습니다','info');return}
    openConfirmModal('일괄 승인','대기 중인 '+pending.length+'건을 모두 승인하시겠습니까?',async function(){
        try{
            var batch=db.batch();
            pending.forEach(function(r){
                batch.update(db.collection('hvacRequests').doc(r.id),{status:'confirmed',confirmedAt:new Date().toISOString()});
            });
            await batch.commit();
            stopHvacAlarm();
            showToast(pending.length+'건 일괄 승인 완료','success');
            render();
        }catch(e){
            showToast('일괄 승인 실패','error');
        }
    },'승인');
}

    var now=new Date();

    // 23시 넘으면 마감
    if(now.getHours()>=23){
        showToast('신청 시간이 마감되었습니다 (23시 이전)','warning');
        return;
    }

    // 오늘 날짜 구하기
    var todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    var dayOfWeek=now.getDay(); // 0=일 1=월 2=화 3=수 4=목 5=금 6=토
    var isHolidayToday=!!HOLIDAYS[todayStr]; // 공휴일이면 true
    var isWeekend=(dayOfWeek===0||dayOfWeek===6); // 토일이면 true

    // 공휴일, 토, 일이 아닌 평일만 시간 체크
    if(!isHolidayToday && !isWeekend){
        var currentMinutes=now.getHours()*60+now.getMinutes();

        // 월(1), 수(3), 금(5) → 17시30분 이후
        if(dayOfWeek===1||dayOfWeek===3||dayOfWeek===5){
            if(currentMinutes<17*60+30){
                var rH=Math.floor((17*60+30-currentMinutes)/60);
                var rM=(17*60+30-currentMinutes)%60;
                showToast('월·수·금은 오후 5:30 이후 신청 가능 ('+rH+'시간 '+rM+'분 후)','warning');
                return;
            }
        }

        // 화(2), 목(4) → 15시30분 이후
        if(dayOfWeek===2||dayOfWeek===4){
            if(currentMinutes<15*60+30){
                var rH2=Math.floor((15*60+30-currentMinutes)/60);
                var rM2=(15*60+30-currentMinutes)%60;
                showToast('화·목은 오후 3:30 이후 신청 가능 ('+rH2+'시간 '+rM2+'분 후)','warning');
                return;
            }
        }
    }

    var student=currentStudent;
    if(!student){showToast('로그인 정보 없음','error');return}
    var roomNum=window._secureData.getRoomNumber(student);
    if(!roomNum){showToast('호실 정보를 확인할 수 없습니다','error');return}
    var today=getCurrentDate();
    try{
        var existing=await db.collection('hvacRequests').where('room','==',roomNum).where('date','==',today).get();
        if(!existing.empty){showToast('오늘 이미 신청된 호실입니다','warning');return}
        await db.collection('hvacRequests').add({room:roomNum,type:hvacMode,requestedBy:student,department:currentStudentDept(),date:today,createdAt:new Date().toISOString(),status:'pending'});
        showToast(roomNum+'호 '+(hvacMode==='heating'?'난방':'냉방')+' 신청 완료','success');
        showSuccessAnimation((hvacMode==='heating'?'난방':'냉방')+' 신청 완료',currentStudent+' · '+new Date().toLocaleTimeString('ko-KR'));
        render();
    }catch(e){showToast('신청 실패','error')}
}

function getLotteryMonth(){
    var now=new Date();
    var y=now.getFullYear();
    var m=now.getMonth()+1;
    return y+'-'+String(m).padStart(2,'0');
}
function isLotteryMonth(){
    var m=new Date().getMonth()+1;
    if(m===7||m===8||m===12)return false;
    return true;
}
function getLotteryMonthLabel(){
    var now=new Date();
    return now.getFullYear()+'년 '+(now.getMonth()+1)+'월';
}
function getMonthDateRange(){
    var now=new Date();
    var y=now.getFullYear();
    var m=now.getMonth();
    var first=new Date(y,m,1);
    var last=new Date(y,m+1,0);
    var startStr=y+'-'+String(m+1).padStart(2,'0')+'-01';
    var endStr=y+'-'+String(m+1).padStart(2,'0')+'-'+String(last.getDate()).padStart(2,'0');
    return{start:startStr,end:endStr,totalDays:last.getDate()};
}
function isMonthEnded(){
    var now=new Date();
    var last=new Date(now.getFullYear(),now.getMonth()+1,0);
    return now.getDate()>last.getDate()-1;
}
async function checkStudentLotteryEligible(studentName,dept){
    if(!isLotteryMonth())return{eligible:false,reason:'이번 달은 이벤트 기간이 아닙니다'};
    var range=getMonthDateRange();
    var today=getCurrentDate();
    var checkEnd=today<range.end?today:range.end;
    
    var allDates=[];
    var cur=new Date(range.start+'T00:00:00');
    var end=new Date(checkEnd+'T00:00:00');
    while(cur<=end){
        var ds=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
        var regDate=window._secureData.getRegisteredDate(studentName);
        if(!regDate||regDate<=ds){
            allDates.push(ds);
        }
        cur.setDate(cur.getDate()+1);
    }
    
    if(allDates.length===0)return{eligible:false,reason:'이번 달 해당 기간이 없습니다'};
    
    try{
        var subSnap=await db.collection('submissions').where('name','==',studentName).where('department','==',dept).where('date','>=',range.start).where('date','<=',checkEnd).get();
        var outSnap=await db.collection('outings').where('name','==',studentName).where('department','==',dept).where('date','>=',range.start).where('date','<=',checkEnd).get();
        
        var submittedDates=new Set();
        subSnap.docs.forEach(function(d){
            var data=d.data();
            if(data.status!=='cancelled')submittedDates.add(data.date);
        });
        outSnap.docs.forEach(function(d){
            var data=d.data();
            if(!data.status||data.status!=='cancelled')submittedDates.add(data.date);
        });
        
        var missedDates=[];
        allDates.forEach(function(ds){
            if(!submittedDates.has(ds)){
                if(isWeekendOrHoliday(ds)){
                    submittedDates.add(ds);
                }else{
                    missedDates.push(ds);
                }
            }
        });
        
        var rate=Math.round((allDates.length-missedDates.length)/allDates.length*100);
        
        if(missedDates.length>0){
            return{eligible:false,reason:'인원보고 '+rate+'% (미제출 '+missedDates.length+'일)',rate:rate,missed:missedDates.length,total:allDates.length};
        }
        return{eligible:true,reason:'인원보고 100% 달성!',rate:100,missed:0,total:allDates.length};
    }catch(e){
        return{eligible:false,reason:'확인 중 오류 발생'};
    }
}
async function checkAlreadyScratched(studentName){
    var monthKey=getLotteryMonth();
    try{
        var doc=await db.collection('lotteryResults').doc(monthKey+'_'+studentName).get();
        if(doc.exists)return doc.data();
        return null;
    }catch(e){return null}
}
async function getMonthWinner(){
    var monthKey=getLotteryMonth();
    try{
        var snap=await db.collection('lotteryResults').where('month','==',monthKey).where('result','==','win').get();
        if(!snap.empty)return snap.docs[0].data();
        return null;
    }catch(e){return null}
}
async function scratchLottery(studentName,dept){
    var monthKey=getLotteryMonth();
    var already=await checkAlreadyScratched(studentName);
    if(already){
        if(already.result==='win'){
            showLotteryResult(true,studentName);
        }else{
            showLotteryResult(false,studentName);
        }
        return;
    }
    
    var winner=await getMonthWinner();
    var result='lose';
    
    if(!winner){
        var today=new Date();
        var lastDay=new Date(today.getFullYear(),today.getMonth()+1,0);
        var remainDays=lastDay.getDate()-today.getDate();
        
        var snap=await db.collection('lotteryResults').where('month','==',monthKey).get();
        var totalScratched=snap.docs.length;
        
        var allEligible=0;
        for(var i=0;i<departments.length;i++){
            var deptStudents=students[departments[i]]||[];
            for(var j=0;j<deptStudents.length;j++){
                var check=await checkStudentLotteryEligible(deptStudents[j],departments[i]);
                if(check.eligible)allEligible++;
            }
        }
        
        var remainEligible=Math.max(1,allEligible-totalScratched);
        var winChance=1/remainEligible;
        
        if(remainDays<=3)winChance=Math.min(1,winChance*3);
        if(remainDays<=1)winChance=1;
        
        if(Math.random()<winChance)result='win';
    }
    
    await db.collection('lotteryResults').doc(monthKey+'_'+studentName).set({
        month:monthKey,
        student:studentName,
        department:dept,
        result:result,
        scratchedAt:new Date().toISOString()
    });
    
    showLotteryResult(result==='win',studentName);
}

async function loadLotteryHistory(){

async function resetLotteryMonth(){
    if(!isSuperAdmin){showToast('슈퍼 관리자만 가능','error');return}
    var monthKey=getLotteryMonth();
    openConfirmModal('이벤트 초기화',getLotteryMonthLabel()+' 이벤트 결과를 모두 초기화하시겠습니까?<br><br>모든 참여 기록과 당첨 결과가 삭제됩니다.',async function(){
        try{
            var snap=await db.collection('lotteryResults').where('month','==',monthKey).get();
            var batch=db.batch();
            snap.docs.forEach(function(d){batch.delete(d.ref)});
            await batch.commit();
            showToast('이벤트 초기화 완료','success');
            loadLotteryAdminData();
        }catch(e){showToast('초기화 실패','error')}
    },'초기화');
}

function showVehicleSearch(){var area=document.getElementById('vehicleListResult');if(!area)return;var keyword=(document.getElementById('vehicleNumberInput')?document.getElementById('vehicleNumberInput').value.trim():'').toLowerCase();var selDeptRaw=(document.getElementById('vehicleDept')?document.getElementById('vehicleDept').value:'');if(selDeptRaw===''){{area.innerHTML='';return}}var selDept=selDeptRaw==='_all'?'':selDeptRaw;var list=[];departments.forEach(function(dept){if(selDept&&dept!==selDept)return;(students[dept]||[]).forEach(function(name){if(vehicleNumbers[name]){if(keyword&&vehicleNumbers[name].toLowerCase().indexOf(keyword)===-1&&name.toLowerCase().indexOf(keyword)===-1)return;list.push({dept:dept,name:name,room:window._secureData.getRoomNumber(name)||'',vehicle:vehicleNumbers[name]})}})});if(list.length===0){area.innerHTML='<div class="text-sm text-gray-400 text-center py-3">등록된 차량이 없습니다</div>';return}list.sort(function(a,b){return parseInt(a.room||'999')-parseInt(b.room||'999')});var h='<div class="text-xs font-bold text-blue-600 mb-2">등록 차량 '+list.length+'대</div><div class="space-y-1 max-h-60 overflow-y-auto">';list.forEach(function(item){h+='<div class="flex items-center justify-between bg-white px-3 py-2 rounded-lg border border-surface-200"><div><span class="text-sm font-bold text-gray-700">'+(item.room?item.room+'호 ':'')+escapeHtml(item.name)+'</span><span class="text-xs text-gray-500 ml-2">['+escapeHtml(item.dept)+']</span></div><div class="flex items-center gap-2"><span class="text-sm font-bold text-blue-600">'+escapeHtml(item.vehicle)+'</span><button onclick="saveVehicleNumber(\''+safeAttr(item.name)+'\',\'\');showVehicleSearch()" class="text-danger-400 hover:text-danger-600" style="font-size:10px"><i class="fas fa-times"></i></button></div></div>'});h+='</div>';area.innerHTML=h}
async function downloadVehicleExcel(){try{await loadExcelJS();var wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('차량번호');ws.columns=[{header:'학과',key:'dept',width:25},{header:'이름',key:'name',width:15},{header:'호실',key:'room',width:10},{header:'차량번호',key:'vehicle',width:20}];ws.getRow(1).font={bold:true};departments.forEach(function(dept){(students[dept]||[]).forEach(function(name){if(vehicleNumbers[name])ws.addRow({dept:dept,name:name,room:window._secureData.getRoomNumber(name)||'',vehicle:vehicleNumbers[name]})})});var buf=await wb.xlsx.writeBuffer();var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='차량번호_'+getCurrentDate()+'.xlsx';a.click();showToast('다운로드 완료','success')}catch(e){showToast('다운로드 실패: '+e.message,'error')}}
function uploadVehicleExcel(){loadExcelJS().then(function(){var input=document.createElement('input');input.type='file';input.accept='.xlsx,.xls';input.onchange=async function(e){var file=e.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=async function(e){try{showToast('파일 처리 중...','info');var wb=new ExcelJS.Workbook();await wb.xlsx.load(new Uint8Array(e.target.result));var ws=wb.worksheets[0];if(!ws){showToast('시트 없음','error');return}var data=[];ws.eachRow(function(row,rn){if(rn===1)return;var name=row.getCell(2).value?row.getCell(2).value.toString().trim():'';var vehicle=row.getCell(4).value?row.getCell(4).value.toString().trim():'';if(name&&vehicle)data.push({name:name,vehicle:vehicle})});if(data.length===0){showToast('등록할 차량번호 없음','warning');return}openConfirmModal('차량번호 업로드',data.length+'대 차량번호를 등록하시겠습니까?',async function(){var cnt=0;for(var i=0;i<data.length;i++){await db.collection('vehicleNumbers').doc(data[i].name).set({vehicleNumber:data[i].vehicle,updatedAt:new Date().toISOString()});cnt++}showToast(cnt+'대 차량번호 등록 완료','success');render()})}catch(err){showToast('파일 처리 실패: '+err.message,'error')}};reader.readAsArrayBuffer(file)};input.click()})}

async function executeResignDelete(reqId){
    var confirmInput=document.getElementById('resignConfirmInput');
    if(!confirmInput||confirmInput.value.trim()!=='삭제'){
        showToast('"삭제"를 정확히 입력해주세요','warning');
        if(confirmInput){confirmInput.focus();confirmInput.style.borderColor='#dc2626';confirmInput.style.background='#fef2f2'}
        return;
    }
    
    var req=resignRequests.find(function(r){return r.id===reqId});
    if(!req){showToast('퇴사 신청을 찾을 수 없습니다','error');return}
    
    var name=req.name;
    var dept=req.department;
    
    closeModal();
    var overlay=document.createElement('div');
    overlay.id='resignDeleteOverlay';
    overlay.style.cssText='position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:10000';

        '<i class="fas fa-spinner fa-spin" style="font-size:40px;color:#dc2626;margin-bottom:16px"></i>' +
        '<div style="font-size:18px;font-weight:bold;color:#1f2937;margin-bottom:8px">개인정보 파기 중...</div>' +
        '<div id="resignDeleteStatus" style="font-size:13px;color:#6b7280;margin-bottom:16px">준비 중...</div>' +
        '<div style="background:#f3f4f6;border-radius:12px;padding:4px"><div id="resignDeleteBar" style="background:linear-gradient(90deg,#ef4444,#dc2626);height:10px;border-radius:8px;width:0%;transition:width 0.3s"></div></div>' +
        '<div id="resignDeleteLog" style="margin-top:16px;text-align:left;max-height:120px;overflow-y:auto;font-size:11px;color:#4b5563;font-family:monospace"></div>' +
        '</div>';
    document.body.appendChild(overlay);
    
    function updateProgress(pct, text){
        var bar=document.getElementById('resignDeleteBar');
        var status=document.getElementById('resignDeleteStatus');
        var log=document.getElementById('resignDeleteLog');
        if(bar)bar.style.width=pct+'%';
        if(status)status.textContent=text;
        if(log)log.innerHTML='<div style="color:#059669">✓ '+text+'</div>'+log.innerHTML;
    }
    
    var deletedCount={photos:0,storage:0,vehicles:0,submissions:0,outings:0,penalties:0,messages:0,access:0,facility:0,hvac:0,lottery:0,passLogs:0,fcm:0,resigns:0};
    
    try{
        updateProgress(5,'사진 파일 확인 중...');
        try{
            var photoDoc=await db.collection('photos').doc(name).get();
            if(photoDoc.exists){
                var photoData=photoDoc.data();
                if(photoData.storagePath){
                    try{
                        await storage.ref(photoData.storagePath).delete();
                        deletedCount.storage=1;
                        updateProgress(10,'Storage 사진 파일 삭제 ✓');
                    }catch(e){console.log('Storage 사진 삭제 실패:',e.message)}
                }
            }
        }catch(e){console.log('사진 정보 조회 실패:',e.message)}
        
        updateProgress(15,'개인 정보 삭제 중...');
        var batch1=db.batch();
        batch1.delete(db.collection('passwords').doc(name));
        batch1.delete(db.collection('roomNumbers').doc(name));
        batch1.delete(db.collection('vehicleNumbers').doc(name));
        batch1.delete(db.collection('photos').doc(name));
        batch1.delete(db.collection('fcmTokens').doc(name));
        await batch1.commit();
        updateProgress(25,'비밀번호·호실·차량·사진 삭제 ✓');
        deletedCount.vehicles=1;
        deletedCount.photos=1;

        }
        
        var collections=[
            {col:'submissions',field:'name',label:'출결 이력',key:'submissions'},
            {col:'outings',field:'name',label:'외출 이력',key:'outings'},
            {col:'outingHistory',field:'name',label:'외출 기록',key:'outings'},
            {col:'penaltyPoints',field:'name',label:'벌점 이력',key:'penalties'},
            {col:'passwordChangeLogs',field:'name',label:'비밀번호 변경 이력',key:'passLogs'},
            {col:'accessRequests',field:'student',label:'출입 신청',key:'access'},
            {col:'facilityRequests',field:'student',label:'시설 민원',key:'facility'},

            {col:'lotteryResults',field:'student',label:'복권 결과',key:'lottery'}
        ];
        
        var progressBase=40;
        var progressStep=50/collections.length;
        
        for(var i=0;i<collections.length;i++){

                var snap=await db.collection(c.col).where(c.field,'==',name).get();
                if(!snap.empty){
                    var batch=db.batch();
                    var cnt=0;
                    snap.forEach(function(doc){
                        batch.delete(doc.ref);
                        cnt++;
                    });
                    await batch.commit();
                    deletedCount[c.key]=(deletedCount[c.key]||0)+cnt;
                    updateProgress(Math.round(progressBase+progressStep*(i+1)),c.label+' '+cnt+'건 삭제 ✓');
                }

            if(!msgSnap.empty){
                var msgBatch=db.batch();
                msgSnap.forEach(function(doc){msgBatch.delete(doc.ref);deletedCount.messages++});
                await msgBatch.commit();
            }
        }catch(e){console.log('메시지 삭제 실패:',e.message)}
        
        updateProgress(95,'퇴사 신청 이력 정리 중...');
        try{
            var resignSnap=await db.collection('resignRequests').where('name','==',name).get();
            if(!resignSnap.empty){
                var resignBatch=db.batch();
                resignSnap.forEach(function(doc){resignBatch.delete(doc.ref);deletedCount.resigns++});
                await resignBatch.commit();
            }
        }catch(e){console.log('퇴사 이력 삭제 실패:',e.message)}
        
        try{
            var leaderDoc=await db.collection('departmentLeaders').doc(dept).get();
            if(leaderDoc.exists&&leaderDoc.data().name===name){
                await db.collection('departmentLeaders').doc(dept).delete();
                updateProgress(98,'학과대표 정보 정리 ✓');
            }
        }catch(e){}
        
        if(studentPhotos[name]) delete studentPhotos[name];
        
        updateProgress(100,'✅ 완전 파기 완료!');
        
        setTimeout(function(){
            overlay.remove();
            var totalDeleted=deletedCount.submissions+deletedCount.outings+deletedCount.penalties+deletedCount.messages+deletedCount.access+deletedCount.facility+deletedCount.hvac+deletedCount.lottery+deletedCount.passLogs+deletedCount.resigns;
            
            openModal(
                '<div class="p-6 text-center">' +
                '<div style="width:80px;height:80px;margin:0 auto 16px;border-radius:50%;background:linear-gradient(135deg,#10b981,#059669);display:flex;align-items:center;justify-content:center">' +
                '<i class="fas fa-check" style="font-size:40px;color:white"></i>' +
                '</div>' +
                '<h3 class="text-xl font-bold text-success-700 mb-2">✅ 개인정보 완전 파기 완료</h3>' +
                '<p class="text-sm text-gray-600 mb-4">' + escapeHtml(name) + '님의 모든 개인정보가<br>안전하게 영구 삭제되었습니다.</p>' +
                '<div class="bg-success-50 border border-success-200 rounded-xl p-4 mb-4 text-left text-sm">' +
                '<div class="font-bold text-success-700 mb-2">삭제 내역</div>' +
                '<div class="text-success-600 space-y-1">' +
                '<div>• 개인 식별 정보: 4건 (비밀번호·호실·차량·사진)</div>' +
                '<div>• Storage 사진 파일: ' + (deletedCount.storage>0?'1건':'없음') + '</div>' +
                '<div>• 출결/외출 이력: ' + (deletedCount.submissions+deletedCount.outings) + '건</div>' +
                '<div>• 벌점 이력: ' + deletedCount.penalties + '건</div>' +
                '<div>• 메시지·신청 내역: ' + (deletedCount.messages+deletedCount.access+deletedCount.facility+deletedCount.hvac+deletedCount.lottery) + '건</div>' +
                '<div>• 기타 이력: ' + (deletedCount.passLogs+deletedCount.resigns) + '건</div>' +
                '<div class="font-bold mt-2 pt-2 border-t border-success-200">총 ' + (totalDeleted+5) + '건 삭제</div>' +
                '</div></div>' +
                '<button onclick="closeModal()" class="w-full py-3.5 bg-success-500 text-white rounded-2xl font-bold text-base btn-press shadow-button">확인</button>' +
                '</div>'
            );
            
            showToast(name + ' 개인정보 완전 파기 완료', 'success');

    }catch(e){

        showToast('파기 처리 실패: '+e.message,'error');

async function rejectResign(reqId){
    var req=resignRequests.find(function(r){return r.id===reqId});
    if(!req){showToast('퇴사 신청을 찾을 수 없습니다','error');return}
    openConfirmModal('퇴사 거부',
        '<b>'+escapeHtml(req.name)+'</b> ('+escapeHtml(req.department)+')<br>'+
        '퇴사 신청을 거부하시겠습니까?',
        async function(){
            try{
                await db.collection('resignRequests').doc(reqId).update({
                    status:'rejected',
                    rejectedBy:'관리자',
                    rejectedAt:new Date().toISOString(),
                    updatedAt:new Date().toISOString()
                });
                showToast(req.name+' 퇴사 거부','success');
                render();
            }catch(e){showToast('거부 실패: '+e.message,'error')}
        },'거부','취소');
}

async function submitResign(dept,name,resignDate,reason){
    if(!navigator.onLine){showToast('인터넷 연결이 없습니다.','error');return}
    var existing=resignRequests.find(function(r){return r.department===dept&&r.name===name&&r.status==='pending'});
    if(existing){showToast('이미 퇴사 신청이 진행 중입니다','warning');return}
    // ★ 예방: 새 퇴사 신청 처리 전 과거 잔여 approved 이력 자동 정리 (재등록한 경우)
    try{await cleanupResignHistory(name,{onlyApproved:true})}catch(e){}
    try{
        var docId=dept+'_'+name+'_'+Date.now();
        await db.collection('resignRequests').doc(docId).set({
            department:dept,name:name,reason:reason,resignDate:resignDate,
            status:'pending',createdAt:new Date().toISOString()
        });
        showToast('퇴사 신청이 접수되었습니다','success');
        showSuccessAnimation('퇴사 신청 완료',name+' · 예정일 '+resignDate);
        render();
    }catch(e){showToast('퇴사 신청 실패: '+e.message,'error')}
}

async function sendUnsubmittedAlert(){if(menuControlSettings.showUnsubmittedAlert===false){showToast('미제출자 알림이 비활성화 상태입니다','warning');return;}var ts=submissions.filter(function(s){return s.date===currentDate&&s.status!=='cancelled'}),to=outings.filter(function(o){return o.date===currentDate&&(!o.status||o.status!=='cancelled')});var sent=0;departments.forEach(function(dept){if(!DEPARTMENT_LEADERS[dept])return;var ns=getDeptStudentList(dept,currentDate,false).filter(function(s){return!ts.find(function(sub){return sub.department===dept&&sub.name===s})&&!to.find(function(o){return o.department===dept&&o.name===s})});if(ns.length===0)return;var names=ns.map(function(n){return formatStudentNameRaw(n)}).join(', ');var text='[미제출 알림] '+currentDate+'\n\n'+dept+' 미제출 '+ns.length+'명:\n'+names+'\n\n인원보고를 독려해주세요.';db.collection('messages').add({type:'admin-to-leader',department:dept,text:text,sender:'system',status:'unread',createdAt:new Date().toISOString(),isAlert:true});sent++;});if(sent>0){closeModal();showToast(sent+'개 학과 대표에게 알림 발송 완료','success');showSuccessAnimation('알림 발송 완료',sent+'개 학과 대표에게 전송');}else{showToast('미제출자가 없거나 학과대표가 없습니다','info');}}
function collectCurrentData(targetDate, listType) {
    if (!listType) listType = 'overnight';
    var deptData = {}, today = targetDate || getCurrentDate();
    var autoData = getAutoOutSubmissions(today);
    var ts = autoData.submissions;
    
    departments.forEach(function(dept) {
        var active = getDeptStudentList(dept, today, false);
        var total = active.length;
        var femTotal = active.filter(function(s) { return s.includes('(여)') }).length;
        var ds = ts.filter(function(s) { return s.department === dept && !window._secureData.isPending(s.name); });
        var oN = ds.filter(function(s) { return s.status === 'out' }).map(function(s) { return s.name });
        var sN = ds.filter(function(s) { return s.status === 'stay' }).map(function(s) { return s.name });
        var display = listType === 'stay' ? sN : oN;
        
        deptData[dept] = {
            total: total,
            totalFemale: femTotal,
            accident: oN.length,
            accidentFemale: oN.filter(function(s) { return s.includes('(여)') }).length,
            current: sN.length,
            currentFemale: sN.filter(function(s) { return s.includes('(여)') }).length,
            overnight: oN.length,
            overnightFemale: oN.filter(function(s) { return s.includes('(여)') }).length,
            overnightStudents: display
        };
    });
    return deptData;
}function mergeSmartelec(d){var e=d['스마트전기(전기)과']||{total:0,totalFemale:0,accident:0,accidentFemale:0,current:0,currentFemale:0,overnight:0,overnightFemale:0,overnightStudents:[]},f=d['스마트전기(소방)과']||{total:0,totalFemale:0,accident:0,accidentFemale:0,current:0,currentFemale:0,overnight:0,overnightFemale:0,overnightStudents:[]};return{total:e.total+f.total,totalFemale:e.totalFemale+f.totalFemale,accident:e.accident+f.accident,accidentFemale:e.accidentFemale+f.accidentFemale,current:e.current+f.current,currentFemale:e.currentFemale+f.currentFemale,overnight:e.overnight+f.overnight,overnightFemale:e.overnightFemale+f.overnightFemale,overnightStudents:e.overnightStudents.concat(f.overnightStudents)}}

var studentPhotos = {};

function preloadAllPhotos() {
    if (_photosLoaded) return;
    _photosLoaded = true;
    db.collection('photos').get().then(function(snap) {
        snap.docs.forEach(function(d) {
            var data = d.data();
            // Storage URL 우선
            if (data.photoUrl) {
                studentPhotos[d.id] = data.photoUrl;
            } 
            // 기존 Base64
            else if (data.photo) {
                studentPhotos[d.id] = data.photo;
            }
        });
        // 이미 호실현황이 열려있으면 썸네일 업데이트
        document.querySelectorAll('[data-photo-name]').forEach(function(el) {
            var name = el.getAttribute('data-photo-name');
            if (studentPhotos[name] && !el.querySelector('img')) {
                el.innerHTML = '<img src="' + studentPhotos[name] + '" style="width:100%;height:100%;object-fit:cover;border-radius:inherit">';
            }
        });
    }).catch(function() {});
}

function loadStudentPhoto(name, callback) {
    if (studentPhotos[name] !== undefined) {
        if (callback) callback(studentPhotos[name]);
        return;
    }
    db.collection('photos').doc(name).get().then(function(doc) {
        if (doc.exists) {
            var data = doc.data();
            // Storage URL 우선
            if (data.photoUrl) {
                studentPhotos[name] = data.photoUrl;
            } 
            // 기존 Base64 (마이그레이션 전)
            else if (data.photo) {
                studentPhotos[name] = data.photo;
            } 
            else {
                studentPhotos[name] = null;
            }
        } else {
            studentPhotos[name] = null;
        }
        if (callback) callback(studentPhotos[name]);
    }).catch(function() {
        studentPhotos[name] = null;
        if (callback) callback(null);
    });
}

function compressImage(file, maxSize, quality, callback) {
    var reader = new FileReader();
    reader.onload = function(e) {
        var img = new Image();
        img.onload = function() {
            var canvas = document.createElement('canvas');
            var ratio = maxSize / Math.max(img.width, img.height);
            if (ratio > 1) ratio = 1;
            canvas.width = Math.round(img.width * ratio);
            canvas.height = Math.round(img.height * ratio);
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            callback(canvas.toDataURL('image/jpeg', quality));
        };
        img.src = e.target.result;
    };
    reader.readAsDataURL(file);
}

// 무작위 ID 생성 함수 (전역에 추가)
function generatePhotoId() {
    var chars = 'abcdefghijklmnopqrstuvwxyz0123456789';
    var id = '';
    for (var i = 0; i < 20; i++) {
        id += chars.charAt(Math.floor(Math.random() * chars.length));
    }
    return id + Date.now().toString(36);
}

function uploadStudentPhoto(name) {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.onchange = function(e) {
        var file = e.target.files[0];
        if (!file) return;
        if (file.size > 10 * 1024 * 1024) { showToast('10MB 이하만 가능', 'warning'); return; }
        showToast('사진 처리 중...', 'info');
        compressImage(file, 200, 0.6, function(dataUrl) {
            fetch(dataUrl).then(function(res){return res.blob()}).then(function(blob){
                // ★ 보안 강화: 이름 대신 무작위 ID 사용
                var photoId = generatePhotoId();
                var storagePath = 'student_photos/' + photoId;
                var ref = storage.ref(storagePath);
                
                ref.put(blob, {contentType: 'image/jpeg'}).then(function(snapshot){
                    return snapshot.ref.getDownloadURL();
                }).then(function(downloadURL){
                    // ★ 기존 사진이 있으면 Storage에서 삭제
                    return db.collection('photos').doc(name).get().then(function(doc){
                        if (doc.exists && doc.data().storagePath) {
                            var oldPath = doc.data().storagePath;
                            // 새 경로와 다르면 기존 파일 삭제
                            if (oldPath !== storagePath) {
                                storage.ref(oldPath).delete().catch(function(){
                                    // 삭제 실패해도 무시 (없는 파일일 수 있음)
                                });
                            }
                        }
                        return db.collection('photos').doc(name).set({
                            photoUrl: downloadURL,
                            storagePath: storagePath,
                            photoId: photoId,
                            updatedAt: new Date().toISOString()
                        });
                    });
                }).then(function(){
                    studentPhotos[name] = dataUrl;
                    showToast(name + ' 사진 등록 완료', 'success');
                    render();
                }).catch(function(err){
                    console.error('Storage 업로드 실패:', err);

// ============ Storage 마이그레이션 도구 ============
async function migratePhotosToStorage() {
    if (!storage) {
        showToast('Storage가 초기화되지 않았습니다', 'error');
        return;
    }
    
    openConfirmModal('사진 일괄 이전',
        '<b>Firestore의 모든 사진을 Storage로 이전</b>합니다.<br><br>' +
        '⏱ 예상 시간: 약 5~10분<br>' +
        '📊 사진 1장당 약 1~3초 소요<br><br>' +
        '<span class="text-warning-600">⚠️ 작업 중 페이지 새로고침 금지!</span><br>' +
        '<span class="text-success-600">✅ 기존 사진은 그대로 유지됨 (안전)</span><br><br>' +
        '시작하시겠습니까?',
        async function() {
            var snap;
            try {
                snap = await db.collection('photos').get();
            } catch (e) {
                showToast('Firestore 조회 실패: ' + e.message, 'error');
                return;
            }
            
            // Base64 사진만 필터 (이미 Storage URL인 건 제외)
            var targets = [];
            snap.docs.forEach(function(doc) {
                var data = doc.data();
                if (data.photo && !data.photoUrl) {
                    targets.push({ name: doc.id, base64: data.photo });
                }
            });
            
            if (targets.length === 0) {
                showToast('이미 모든 사진이 Storage에 있습니다', 'info');
                return;
            }
            
            // 진행 상황 표시
            var overlay = document.createElement('div');
            overlay.id = 'migrationOverlay';
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:10000';
            overlay.innerHTML = 
                '<div style="background:white;border-radius:24px;padding:40px;text-align:center;min-width:400px;max-width:500px">' +
                '<i class="fas fa-cloud-upload-alt" style="font-size:48px;color:#6366f1;margin-bottom:16px"></i>' +
                '<div style="font-size:20px;font-weight:bold;color:#1f2937;margin-bottom:8px">사진 이전 중...</div>' +
                '<div id="migrationStatus" style="font-size:14px;color:#6b7280;margin-bottom:16px">준비 중...</div>' +
                '<div style="background:#f3f4f6;border-radius:12px;padding:4px;margin-bottom:8px"><div id="migrationBar" style="background:linear-gradient(90deg,#818cf8,#6366f1);height:12px;border-radius:8px;width:0%;transition:width 0.3s"></div></div>' +
                '<div id="migrationCount" style="font-size:14px;color:#374151;font-weight:bold">0 / ' + targets.length + '</div>' +
                '<div id="migrationLog" style="margin-top:16px;text-align:left;max-height:150px;overflow-y:auto;background:#f9fafb;border-radius:8px;padding:8px;font-size:12px;color:#4b5563"></div>' +
                '</div>';
            document.body.appendChild(overlay);
            
            var success = 0;
            var fail = 0;
            var failList = [];
            
            for (var i = 0; i < targets.length; i++) {
                var target = targets[i];
                var pct = Math.round((i / targets.length) * 100);
                
                document.getElementById('migrationStatus').textContent = '이전 중: ' + target.name;
                document.getElementById('migrationBar').style.width = pct + '%';
                document.getElementById('migrationCount').textContent = i + ' / ' + targets.length;
                
                try {
                    // Base64 → Blob 변환
                    var res = await fetch(target.base64);
                    var blob = await res.blob();
                    
                    // Storage 업로드
                    var ref = storage.ref('student_photos/' + target.name);
                    var snapshot = await ref.put(blob, { contentType: 'image/jpeg' });
                    var downloadURL = await snapshot.ref.getDownloadURL();
                    
                    // Firestore 업데이트 (photoUrl 추가, photo는 일단 유지)
                    await db.collection('photos').doc(target.name).set({
                        photoUrl: downloadURL,
                        storagePath: 'student_photos/' + target.name,
                        migratedAt: new Date().toISOString()
                    }, { merge: true });
                    
                    success++;
                    var logEl = document.getElementById('migrationLog');
                    if (logEl) logEl.innerHTML = '<div style="color:#059669">✓ ' + target.name + '</div>' + logEl.innerHTML;
                } catch (err) {
                    fail++;
                    failList.push(target.name);
                    var logEl2 = document.getElementById('migrationLog');
                    if (logEl2) logEl2.innerHTML = '<div style="color:#dc2626">✗ ' + target.name + ': ' + err.message + '</div>' + logEl2.innerHTML;
                }
            }
            
            // 완료
            document.getElementById('migrationStatus').textContent = '✅ 이전 완료!';
            document.getElementById('migrationBar').style.width = '100%';
            document.getElementById('migrationCount').textContent = targets.length + ' / ' + targets.length;
            
            setTimeout(function() {
                overlay.remove();
                
                var msg = '✅ 성공: ' + success + '명<br>';
                if (fail > 0) {
                    msg += '❌ 실패: ' + fail + '명<br>';
                    msg += '<div class="text-xs text-gray-500 mt-2">실패 목록: ' + failList.join(', ') + '</div>';
                }
                msg += '<br><span class="text-success-600">⚠️ 다음 단계: 일괄 이전이 정상 확인되면 기존 Base64 데이터를 정리할 수 있습니다.</span>';
                
                openModal(
                    '<div class="p-6 text-center">' +
                    '<i class="fas fa-check-circle text-success-500" style="font-size:48px;margin-bottom:16px"></i>' +
                    '<h3 class="text-xl font-bold text-gray-900 mb-3">사진 이전 완료</h3>' +
                    '<div class="text-sm text-gray-600 mb-4">' + msg + '</div>' +
                    '<button onclick="closeModal()" class="w-full py-3 bg-primary-500 text-white rounded-2xl font-bold btn-press">확인</button>' +
                    '</div>'
                );
                
                showToast('사진 이전 완료: ' + success + '/' + targets.length, 'success');
                render();
            }, 1000);
        }, '이전 시작'
    );
}

            var snap = await db.collection('photos').get();
            var targets = [];
            snap.docs.forEach(function(doc) {
                var data = doc.data();
                if (data.photo && data.photoUrl) {
                    targets.push(doc.id);
                }
            });
            
            if (targets.length === 0) {
                showToast('정리할 데이터가 없습니다', 'info');
                return;
            }
            
            showToast('정리 중...', 'info');
            
            var batch = db.batch();
            var count = 0;
            for (var i = 0; i < targets.length; i++) {
                batch.update(db.collection('photos').doc(targets[i]), {
                    photo: firebase.firestore.FieldValue.delete()
                });
                count++;
                if (count >= 400) {
                    await batch.commit();
                    batch = db.batch();
                    count = 0;
                }
            }
            if (count > 0) await batch.commit();
            
            showToast(targets.length + '명 Base64 데이터 정리 완료', 'success');
            showSuccessAnimation('정리 완료', targets.length + '명 데이터 정리');
        }, '정리 시작'
    );
}
// ============ Phase 2: 기존 사진 이름 → 무작위 ID 마이그레이션 ============
async function migratePhotosToRandomId() {
    if (!storage) {
        showToast('Storage가 초기화되지 않았습니다', 'error');
        return;
    }
    
    openConfirmModal('사진 ID 무작위화',
        '<b>기존 사진의 파일명을 무작위 ID로 변경</b>합니다.<br><br>' +
        '🔒 보안 효과: 이름으로 URL 추측 불가능<br>' +
        '⏱ 예상 시간: 약 10~15분<br>' +
        '📊 사진 1장당 약 2~3초 소요<br><br>' +
        '<span class="text-warning-600">⚠️ 작업 중 페이지 새로고침 금지!</span><br>' +
        '<span class="text-success-600">✅ 기존 파일은 검증 후 자동 삭제됨</span><br><br>' +
        '시작하시겠습니까?',
        async function() {
            var snap;
            try {
                snap = await db.collection('photos').get();
            } catch (e) {
                showToast('Firestore 조회 실패: ' + e.message, 'error');
                return;
            }
            
            // 무작위 ID가 아닌 사진만 대상
            var targets = [];
            snap.docs.forEach(function(doc) {
                var data = doc.data();
                // photoId가 없거나, storagePath가 이름 기반이면 대상
                if (data.photoUrl && (!data.photoId || (data.storagePath && data.storagePath === 'student_photos/' + doc.id))) {
                    targets.push({ name: doc.id, oldPath: data.storagePath || ('student_photos/' + doc.id), oldUrl: data.photoUrl });
                }
            });
            
            if (targets.length === 0) {
                showToast('이미 모든 사진이 무작위 ID로 저장되어 있습니다', 'info');
                return;
            }
            
            // 진행 상황 표시
            var overlay = document.createElement('div');
            overlay.id = 'migrationOverlay';
            overlay.style.cssText = 'position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.7);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center;z-index:10000';
            overlay.innerHTML = 
                '<div style="background:white;border-radius:24px;padding:40px;text-align:center;min-width:400px;max-width:500px">' +
                '<i class="fas fa-shield-alt" style="font-size:48px;color:#10b981;margin-bottom:16px"></i>' +
                '<div style="font-size:20px;font-weight:bold;color:#1f2937;margin-bottom:8px">사진 ID 무작위화 중...</div>' +
                '<div id="migrationStatus" style="font-size:14px;color:#6b7280;margin-bottom:16px">준비 중...</div>' +
                '<div style="background:#f3f4f6;border-radius:12px;padding:4px;margin-bottom:8px"><div id="migrationBar" style="background:linear-gradient(90deg,#34d399,#10b981);height:12px;border-radius:8px;width:0%;transition:width 0.3s"></div></div>' +
                '<div id="migrationCount" style="font-size:14px;color:#374151;font-weight:bold">0 / ' + targets.length + '</div>' +
                '<div id="migrationLog" style="margin-top:16px;text-align:left;max-height:200px;overflow-y:auto;background:#f9fafb;border-radius:8px;padding:8px;font-size:12px;color:#4b5563"></div>' +
                '</div>';
            document.body.appendChild(overlay);
            
            var success = 0;
            var fail = 0;
            var failList = [];
            
            for (var i = 0; i < targets.length; i++) {
                var target = targets[i];
                var pct = Math.round((i / targets.length) * 100);
                
                document.getElementById('migrationStatus').textContent = '이전 중: ' + target.name;
                document.getElementById('migrationBar').style.width = pct + '%';
                document.getElementById('migrationCount').textContent = i + ' / ' + targets.length;
                
                try {
                    // 1) 기존 사진 다운로드
                    var oldRef = storage.ref(target.oldPath);
                    var blob = await fetch(target.oldUrl).then(function(r){ return r.blob(); });
                    
                    // 2) 새 무작위 ID로 업로드
                    var newPhotoId = generatePhotoId();
                    var newPath = 'student_photos/' + newPhotoId;
                    var newRef = storage.ref(newPath);
                    var snapshot = await newRef.put(blob, { contentType: 'image/jpeg' });
                    var newUrl = await snapshot.ref.getDownloadURL();
                    
                    // 3) Firestore 업데이트
                    await db.collection('photos').doc(target.name).set({
                        photoUrl: newUrl,
                        storagePath: newPath,
                        photoId: newPhotoId,
                        migratedFromName: target.name,
                        migratedAt: new Date().toISOString(),
                        updatedAt: new Date().toISOString()
                    }, { merge: true });
                    
                    // 4) 기존 파일 삭제 (성공 시에만)
                    try {
                        await oldRef.delete();
                    } catch (delErr) {
                        // 삭제 실패해도 마이그레이션 자체는 성공
                        console.log('기존 파일 삭제 실패 (무시 가능):', target.name);
                    }
                    
                    success++;
                    var logEl = document.getElementById('migrationLog');
                    if (logEl) logEl.innerHTML = '<div style="color:#059669">✓ ' + target.name + ' → ' + newPhotoId.substring(0,12) + '...</div>' + logEl.innerHTML;
                } catch (err) {
                    fail++;
                    failList.push(target.name);
                    var logEl2 = document.getElementById('migrationLog');
                    if (logEl2) logEl2.innerHTML = '<div style="color:#dc2626">✗ ' + target.name + ': ' + err.message + '</div>' + logEl2.innerHTML;
                }
            }
            
            // 완료
            document.getElementById('migrationStatus').textContent = '✅ 마이그레이션 완료!';
            document.getElementById('migrationBar').style.width = '100%';
            document.getElementById('migrationCount').textContent = targets.length + ' / ' + targets.length;
            
            setTimeout(function() {
                overlay.remove();
                
                var msg = '✅ 성공: ' + success + '명<br>';
                if (fail > 0) {
                    msg += '❌ 실패: ' + fail + '명<br>';
                    msg += '<div class="text-xs text-gray-500 mt-2">실패 목록: ' + failList.slice(0,10).join(', ') + (failList.length > 10 ? ' 외 ' + (failList.length-10) + '명' : '') + '</div>';
                }
                msg += '<br><span class="text-success-600">🔒 이제 학생 이름으로 URL 추측이 불가능합니다!</span>';
                
                openModal(
                    '<div class="p-6 text-center">' +
                    '<i class="fas fa-shield-alt text-success-500" style="font-size:48px;margin-bottom:16px"></i>' +
                    '<h3 class="text-xl font-bold text-gray-900 mb-3">사진 보안 강화 완료</h3>' +
                    '<div class="text-sm text-gray-600 mb-4">' + msg + '</div>' +
                    '<button onclick="closeModal()" class="w-full py-3 bg-success-500 text-white rounded-2xl font-bold btn-press">확인</button>' +
                    '</div>'
                );
                
                showToast('보안 강화 완료: ' + success + '/' + targets.length, 'success');
                render();
            }, 1500);
        }, '시작'
    );
}


function uploadPhotoBatch() {
    var input = document.createElement('input');
    input.type = 'file';
    input.accept = 'image/*';
    input.multiple = true;
    input.onchange = async function(e) {
        var files = Array.from(e.target.files);
        if (files.length === 0) return;
        var allNames = new Set();
        departments.forEach(function(d) { (students[d] || []).forEach(function(n) { allNames.add(n); }); });
        var matched = [], unmatched = [];
        files.forEach(function(file) {
            var fn = file.name.replace(/\.[^.]+$/, '').trim();
            if (allNames.has(fn)) { matched.push({ name: fn, file: file }); }
            else if (allNames.has(fn + '(여)')) { matched.push({ name: fn + '(여)', file: file }); }
            else { unmatched.push(file.name); }
        });
        if (matched.length === 0) { showToast('매칭되는 교육생이 없습니다. 파일명을 이름으로 설정하세요 (예: 홍길동.jpg)', 'warning'); return; }
        var msg = '<div class="text-left"><div class="text-success-600 font-bold mb-1"><i class="fas fa-check-circle mr-1"></i>매칭 성공: ' + matched.length + '명</div>';
        if (unmatched.length > 0) msg += '<div class="text-danger-600 font-bold mb-1"><i class="fas fa-times-circle mr-1"></i>매칭 실패: ' + unmatched.length + '개</div><div class="text-xs text-gray-400 mb-2">' + unmatched.slice(0, 8).map(function(n) { return escapeHtml(n); }).join(', ') + (unmatched.length > 8 ? ' 외 ' + (unmatched.length - 8) + '개' : '') + '</div>';
        msg += '<div class="text-xs text-gray-500 mt-2">200×200px JPEG로 자동 압축됩니다</div></div>';
        openConfirmModal('사진 일괄 업로드', msg, async function() {
            showToast('업로드 중... (0/' + matched.length + ')', 'info');
            var success = 0, fail = 0;
            for (var i = 0; i < matched.length; i++) {
                try {
                    var dataUrl = await new Promise(function(resolve) { compressImage(matched[i].file, 200, 0.6, resolve); });
                    if (dataUrl.length > 900000) { fail++; continue; }
                    await db.collection('photos').doc(matched[i].name).set({ photo: dataUrl, updatedAt: new Date().toISOString() });
                    studentPhotos[matched[i].name] = dataUrl;
                    success++;
                    if ((i + 1) % 10 === 0 || i === matched.length - 1) showToast('업로드 중... (' + (i + 1) + '/' + matched.length + ')', 'info');
                } catch (err) { fail++; }
            }
            showToast(success + '명 사진 등록 완료' + (fail > 0 ? ' (' + fail + '명 실패)' : ''), 'success');
            if (success > 0) showSuccessAnimation('사진 등록 완료', success + '명 업로드 성공');
            render();
        }, '업로드');
    };
    input.click();
}

function getStarLabel(n){

    if(n===4)return'심각 (4단계)';
    if(n===5)return'위험 (5단계)';

function getStarColor(n){
    if(n===0)return{bg:'text-gray-400',iconColor:'#9ca3af',textClass:'text-gray-400',dotBg:'bg-gray-300'};
    if(n===1)return{bg:'text-green-500',iconColor:'#22c55e',textClass:'text-green-600',dotBg:'bg-green-400'};

  };
  var roomMap=buildRoomOccupancyMap(getCurrentDate(),true);
  Object.keys(floors).forEach(function(f){

var members=roomMap[rs]||[];
var isStaff=(window._staffRooms||[]).some(function(x){return (typeof x==='object'?x.room:x)===rs});
var isRepair=(window._repairRooms||[]).indexOf(rs)!==-1;
fl.rooms.push({room:rs,members:members,count:members.length,isStaff:isStaff,isRepair:isRepair||false});
    }
  });
  var total=0,empty=0,single=0,doubleUp=0,staffCount=0;
var female={total:0,empty:0,single:0,doubleUp:0},male={total:0,empty:0,single:0,doubleUp:0};

    total++;if(r.count===0)empty++;else if(r.count===1)single++;else doubleUp++;
    if(fl.type==='female'){female.total++;if(r.count===0)female.empty++;else if(r.count===1)female.single++;else female.doubleUp++;}

  })});
  return{floors:floors,totalRooms:total,emptyRooms:empty,singleRooms:single,doubleRooms:doubleUp,staffRooms:staffCount,
    femaleTotal:female.total,femaleEmpty:female.empty,femaleSingle:female.single,femaleDouble:female.doubleUp,

function roomCardFilter(keyword){
  roomSearchKeyword=keyword;
  window._roomFloorOpen={'1':true,'2':true,'3':true,'4':true};window._floorPlanOpen={'1F':true,'2F':true,'3F':true,'4F':true};
  render();
  setTimeout(function(){
    var firstMatch=document.querySelector('.room-card-match');
    if(firstMatch){firstMatch.scrollIntoView({behavior:'smooth',block:'center'});}
    setTimeout(function(){roomSearchKeyword='';var el=document.getElementById('roomSearchInput');if(el)el.value='';},5000);
  },100);
}
function showDeptFilterModal(){

        {icon:'fa-bolt',bg:'linear-gradient(135deg,#c4b5fd,#8b5cf6)',border:'rgba(139,92,246,0.5)',activeBg:'rgba(139,92,246,0.12)'},

    ];
    function getDeptIcon(name){
        if(name.indexOf('도장')>-1) return 'fa-paint-roller';
        if(name.indexOf('자동차')>-1||name.indexOf('차량')>-1) return 'fa-car-side';
        if(name.indexOf('전기')>-1||name.indexOf('전자')>-1) return 'fa-bolt';
        if(name.indexOf('기계')>-1||name.indexOf('설비')>-1) return 'fa-cogs';
        if(name.indexOf('반도체')>-1||name.indexOf('표면')>-1) return 'fa-microchip';
        if(name.indexOf('주얼리')>-1||name.indexOf('보석')>-1||name.indexOf('목공')>-1) return 'fa-gem';
        if(name.indexOf('산업')>-1) return 'fa-industry';
        if(name.indexOf('바리스타')>-1||name.indexOf('여성')>-1) return 'fa-coffee';
        if(name.indexOf('소방')>-1) return 'fa-fire-extinguisher';
        if(name.indexOf('용접')>-1) return 'fa-fire';
        return null;
    }

        var roomCount=Object.keys(roomSet).length;
        var floors={};
        Object.keys(roomSet).forEach(function(r){floors[r.charAt(0)]=1});
        var topFloor=Object.keys(floors).sort(function(a,b){return (students[dept]||[]).filter(function(n){var rm=window._secureData.getRoomNumber(n);return rm&&rm.charAt(0)===b}).length-(students[dept]||[]).filter(function(n){var rm=window._secureData.getRoomNumber(n);return rm&&rm.charAt(0)===a}).length})[0]||'1';

        html+='<button onclick="roomFilterDept=\''+dept.replace(/'/g,"\\'")+'\';roomSearchKeyword=\'\';window._roomFloorOpen={\'1\':true,\'2\':true,\'3\':true,\'4\':true};window._floorPlanOpen={\'1F\':true,\'2F\':true,\'3F\':true,\'4F\':true};window._scrollToFloor=\''+topFloor+'F\';document.getElementById(\'deptDropdown\').remove();render()" style="display:flex;align-items:center;gap:10px;width:100%;padding:10px 12px;border-radius:12px;border:2px solid '+(isActive?c.border:'transparent')+';background:'+(isActive?c.activeBg:'transparent')+';cursor:pointer;text-align:left;font-size:15px;margin-bottom:2px">';

        html+='<span style="font-size:13px;font-weight:600;color:#4b5563"><i class="fas fa-user" style="font-size:11px;opacity:0.5;margin-right:2px"></i>'+count+'명</span>';
        if(femCount>0) html+='<span style="font-size:13px;font-weight:600;color:#db2777"><i class="fas fa-female" style="font-size:11px;opacity:0.5;margin-right:2px"></i>'+femCount+'</span>';
        html+='<span style="font-size:13px;font-weight:600;color:#4b5563"><i class="fas fa-door-open" style="font-size:11px;opacity:0.5;margin-right:2px"></i>'+roomCount+'실</span>';
        html+='</div></div>';
        if(isActive) html+='<i class="fas fa-check-circle" style="color:'+c.border+';font-size:16px"></i>';
        html+='</button>';
    });

    div.innerHTML=html;
    document.body.appendChild(div);
    setTimeout(function(){
        document.addEventListener('click',function _close(e){
            var dd=document.getElementById('deptDropdown');
            if(!dd){document.removeEventListener('click',_close);return}
            if(!dd.contains(e.target)&&!e.target.closest('[onclick*="showDeptFilterModal"]')){dd.remove();document.removeEventListener('click',_close)}
        })
    },300);
}

function _doSectionMerge(sourceSecId, targetSecId, mergeClass, headerBg, headerBd, iconBg, iconColor, titleColor, iconClass, titleText){
    var sourceToggle=document.querySelector('[onclick="toggleManageSection(\''+sourceSecId+'\')"]');

    var targetSec=document.getElementById(targetSecId);
    if(!sourceToggle||!sourceSec||!targetSec)return;
    if(targetSec.querySelector('.'+mergeClass))return;
    var sourceParent=sourceToggle.closest('.mb-4');
    var wrapper=document.createElement('div');wrapper.className=mergeClass+' mt-5 pt-5';
    var header=document.createElement('div');header.className='flex items-center justify-between p-4 rounded-xl border cursor-pointer select-none';
    header.style.cssText='background:'+headerBg+';border-color:'+headerBd;
    header.innerHTML='<div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:'+iconBg+'"><i class="fas '+iconClass+'" style="color:'+iconColor+'"></i></div><h3 class="font-bold text-base" style="color:'+titleColor+'">'+titleText+'</h3></div><i class="fas fa-chevron-down transition-transform" style="color:#94a3b8"></i>';
    var content=document.createElement('div');content.style.display='none';content.className='mt-3';
    sourceSec.querySelectorAll(':scope > *').forEach(function(c){content.appendChild(c.cloneNode(true))});
    header.onclick=function(){var icon=header.querySelector('.fa-chevron-down,.fa-chevron-up');if(content.style.display==='none'){content.style.display='';if(icon)icon.className=icon.className.replace('fa-chevron-down','fa-chevron-up')}else{content.style.display='none';if(icon)icon.className=icon.className.replace('fa-chevron-up','fa-chevron-down')}};
    wrapper.appendChild(header);wrapper.appendChild(content);targetSec.appendChild(wrapper);
    if(sourceParent)sourceParent.remove();
}

function _attachAccordion(titleText){
    var span=null;document.querySelectorAll('span.font-bold.text-gray-700').forEach(function(s){if(s.textContent.trim()===titleText)span=s});
    if(!span)return;
    var header=span.closest('.flex.items-center.justify-between');
    if(!header||header.querySelector('.section-chevron'))return;
    var chevron=document.createElement('i');chevron.className='fas fa-chevron-down text-gray-400 transition-transform section-chevron';chevron.style.cssText='cursor:pointer;transition:transform 0.3s';header.appendChild(chevron);
    var parent=header.parentElement;var siblings=[];var started=false;
    for(var k=0;k<parent.children.length;k++){if(parent.children[k]===header){started=true;continue}if(started)siblings.push(parent.children[k])}
    var wrapper=document.createElement('div');wrapper.className='section-content';wrapper.style.cssText='transition:max-height 0.3s ease,opacity 0.3s ease;overflow:hidden';
    siblings.forEach(function(s){wrapper.appendChild(s)});parent.appendChild(wrapper);
    header.style.cursor='pointer';wrapper.style.maxHeight='none';wrapper.style.opacity='1';
    chevron.addEventListener('click',function(e){e.stopPropagation();var isOpen=wrapper.style.opacity!=='0';if(isOpen){wrapper.style.maxHeight=wrapper.scrollHeight+'px';wrapper.offsetHeight;wrapper.style.maxHeight='0px';wrapper.style.opacity='0';chevron.style.transform='rotate(-180deg)'}else{wrapper.style.maxHeight='none';wrapper.style.opacity='1';chevron.style.transform='rotate(0deg)'}});
    var obs=new MutationObserver(function(){if(wrapper.style.opacity!=='0')wrapper.style.maxHeight='none'});obs.observe(wrapper,{childList:true,subtree:true});
}
