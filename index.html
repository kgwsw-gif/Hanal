function calcAgeFromBirth(birthStr){
    if(!birthStr)return null;
    var s=String(birthStr).replace(/[^0-9]/g,'');
    var year=null;
    if(s.length===8){year=parseInt(s.substring(0,4))}
    else if(s.length===6){var yy=parseInt(s.substring(0,2));year=yy>=0&&yy<=30?2000+yy:1900+yy}
    else if(s.length===4){year=parseInt(s)}
    else if(s.length===2){var yy2=parseInt(s);year=yy2>=0&&yy2<=30?2000+yy2:1900+yy2}
    if(!year||year<1950||year>2015)return null;
    var age=new Date().getFullYear()-year;
    return age>0&&age<80?age:null;
}

    try{
        var AudioCtx=window.AudioContext||window.webkitAudioContext;
        if(!AudioCtx)return;
        var ctx=new AudioCtx();
        function beep(freq,startTime){
            var osc=ctx.createOscillator();
            var gain=ctx.createGain();
            osc.connect(gain);gain.connect(ctx.destination);
            osc.type='sine';
            osc.frequency.value=freq;
            gain.gain.setValueAtTime(0.5,ctx.currentTime+startTime);
            gain.gain.exponentialRampToValueAtTime(0.01,ctx.currentTime+startTime+0.3);
            osc.start(ctx.currentTime+startTime);
            osc.stop(ctx.currentTime+startTime+0.3);
        }
        beep(800,0);beep(1000,0.15);beep(1200,0.3);
    }catch(e){console.log('sound error:',e)}

function getAutoOutSubmissions(targetDate) {
    var isAutoOut = isWeekendOrHoliday(targetDate);
    var realSubs = submissions.filter(function(s) { return s.date === targetDate && s.status !== 'cancelled' });
    var realOuts = outings.filter(function(o) { return o.date === targetDate && (!o.status || o.status !== 'cancelled') });
    
    if (!isAutoOut) return { submissions: realSubs, outings: realOuts };
    
    // 주말/공휴일: 미제출자를 외박으로 자동 추가
    var submittedNames = new Set();
    realSubs.forEach(function(s) { submittedNames.add(s.department + '_' + s.name) });
    realOuts.forEach(function(o) { submittedNames.add(o.department + '_' + o.name) });
    submissions.filter(function(s) { return s.date === targetDate && s.status === 'cancelled' }).forEach(function(s) { submittedNames.add(s.department + '_' + s.name) });
    
    var autoSubs = realSubs.slice(); // 복사
    
    departments.forEach(function(dept) {
        var deptStudents = (students[dept] || []).filter(function(name) {
            var regDate = window._secureData.getRegisteredDate(name);
            return !regDate || regDate <= targetDate;
        });
        deptStudents.forEach(function(name) {
            var key = dept + '_' + name;
            if (!submittedNames.has(key)) {
                autoSubs.push({
                    id: 'auto_' + dept + '_' + name,
                    department: dept,
                    name: name,
                    status: 'out',
                    date: targetDate,
                    timestamp: '자동처리',
                    isAuto: true
                });
            }
        });
    });
    
    return { submissions: autoSubs, outings: realOuts };
}

        var tomorrowStr=tomorrow.getFullYear()+'-'+String(tomorrow.getMonth()+1).padStart(2,'0')+'-'+String(tomorrow.getDate()).padStart(2,'0');
        if(day===5||day===6||day===0)return{allowed:true};

        return{allowed:false,reason:'주말 및 공휴일 기숙사 잔류자 신청\n(금요일~일요일, 공휴일 전날~공휴일에만 신청 가능)'};

async function submitStatus(dept,name,status){
    if(!isOnline){showToast('오프라인 상태입니다. 인터넷 연결 후 다시 시도해주세요.','warning');return}
    var sd=getSelectedDate();
    var docId=sd+'_'+dept+'_'+name;
    // 21시 이후 변경 제한 (교육생만, 관리자/학과대표는 제외)
    if(currentMode==='student'){
        var now=new Date();
        var existingSub=submissions.find(function(s){return s.id===docId&&s.status!=='cancelled'});
        if(existingSub&&now.getHours()>=21){
            showToast('21시 이후에는 신청을 변경할 수 없습니다.','warning');
            return;
        }
    }
    try{
        await db.collection('submissions').doc(docId).set({department:dept,name:name,status:status,date:sd,timestamp:new Date().toLocaleTimeString('ko-KR'),submitDate:new Date().toISOString()});
        // 서버 저장 확인 (검증)
        var verifyDoc=await db.collection('submissions').doc(docId).get();
        if(verifyDoc.exists&&verifyDoc.data().status===status){
            showToast(status==='stay'?'잔류(Stay) 신청 완료':'외박(Out) 신청 완료','success');
            showSuccessAnimation(status==='stay'?'잔류(Stay) 신청 완료':'외박(Out) 신청 완료',name+' · '+new Date().toLocaleTimeString('ko-KR'));
        }else{
            showToast('⚠️ 신청이 서버에 저장되지 않았습니다. 다시 시도해주세요!','error');
            if(navigator.vibrate)navigator.vibrate([300,100,300,100,300]);
        }
        render();
    }catch(e){
        showToast('신청 실패: 인터넷 연결을 확인하고 다시 시도해주세요. ('+e.message+')','error');
        if(navigator.vibrate)navigator.vibrate([300,100,300,100,300]);
    }
}

async function submitHvacRequest(){
    var now=new Date();

    // 23시 넘으면 마감
    if(now.getHours()>=23){
        showToast('신청 시간이 마감되었습니다 (23시 이전)','warning');
        return;
    }

    // 오늘 날짜 구하기
    var todayStr=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0');
    var dayOfWeek=now.getDay(); // 0=일 1=월 2=화 3=수 4=목 5=금 6=토
    var isHolidayToday=!!HOLIDAYS[todayStr]; // 공휴일이면 true
    var isWeekend=(dayOfWeek===0||dayOfWeek===6); // 토일이면 true

    // 공휴일, 토, 일이 아닌 평일만 시간 체크
    if(!isHolidayToday && !isWeekend){
        var currentMinutes=now.getHours()*60+now.getMinutes();

        // 월(1), 수(3), 금(5) → 17시30분 이후
        if(dayOfWeek===1||dayOfWeek===3||dayOfWeek===5){
            if(currentMinutes<17*60+30){
                var rH=Math.floor((17*60+30-currentMinutes)/60);
                var rM=(17*60+30-currentMinutes)%60;
                showToast('월·수·금은 오후 5:30 이후 신청 가능 ('+rH+'시간 '+rM+'분 후)','warning');
                return;
            }
        }

        // 화(2), 목(4) → 15시30분 이후
        if(dayOfWeek===2||dayOfWeek===4){
            if(currentMinutes<15*60+30){
                var rH2=Math.floor((15*60+30-currentMinutes)/60);
                var rM2=(15*60+30-currentMinutes)%60;
                showToast('화·목은 오후 3:30 이후 신청 가능 ('+rH2+'시간 '+rM2+'분 후)','warning');
                return;
            }
        }
    }

    var student=currentStudent;
    if(!student){showToast('로그인 정보 없음','error');return}
    var roomNum=window._secureData.getRoomNumber(student);
    if(!roomNum){showToast('호실 정보를 확인할 수 없습니다','error');return}
    var today=getCurrentDate();
    try{
        var existing=await db.collection('hvacRequests').where('room','==',roomNum).where('date','==',today).get();
        if(!existing.empty){showToast('오늘 이미 신청된 호실입니다','warning');return}
        await db.collection('hvacRequests').add({room:roomNum,type:hvacMode,requestedBy:student,department:currentStudentDept(),date:today,createdAt:new Date().toISOString(),status:'pending'});
        showToast(roomNum+'호 '+(hvacMode==='heating'?'난방':'냉방')+' 신청 완료','success');
        showSuccessAnimation((hvacMode==='heating'?'난방':'냉방')+' 신청 완료',currentStudent+' · '+new Date().toLocaleTimeString('ko-KR'));
        render();
    }catch(e){showToast('신청 실패','error')}
}

function getLotteryMonth(){
    var now=new Date();
    var y=now.getFullYear();
    var m=now.getMonth()+1;
    return y+'-'+String(m).padStart(2,'0');
}
function isLotteryMonth(){
    var m=new Date().getMonth()+1;
    if(m===7||m===8||m===12)return false;
    return true;
}
function getLotteryMonthLabel(){
    var now=new Date();
    return now.getFullYear()+'년 '+(now.getMonth()+1)+'월';
}
function getMonthDateRange(){
    var now=new Date();
    var y=now.getFullYear();
    var m=now.getMonth();
    var first=new Date(y,m,1);
    var last=new Date(y,m+1,0);
    var startStr=y+'-'+String(m+1).padStart(2,'0')+'-01';
    var endStr=y+'-'+String(m+1).padStart(2,'0')+'-'+String(last.getDate()).padStart(2,'0');
    return{start:startStr,end:endStr,totalDays:last.getDate()};
}
function isMonthEnded(){
    var now=new Date();
    var last=new Date(now.getFullYear(),now.getMonth()+1,0);
    return now.getDate()>last.getDate()-1;
}
async function checkStudentLotteryEligible(studentName,dept){
    if(!isLotteryMonth())return{eligible:false,reason:'이번 달은 이벤트 기간이 아닙니다'};
    var range=getMonthDateRange();
    var today=getCurrentDate();
    var checkEnd=today<range.end?today:range.end;
    
    var allDates=[];
    var cur=new Date(range.start+'T00:00:00');
    var end=new Date(checkEnd+'T00:00:00');
    while(cur<=end){
        var ds=cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0');
        var regDate=window._secureData.getRegisteredDate(studentName);
        if(!regDate||regDate<=ds){
            allDates.push(ds);
        }
        cur.setDate(cur.getDate()+1);
    }
    
    if(allDates.length===0)return{eligible:false,reason:'이번 달 해당 기간이 없습니다'};
    
    try{
        var subSnap=await db.collection('submissions').where('name','==',studentName).where('department','==',dept).where('date','>=',range.start).where('date','<=',checkEnd).get();
        var outSnap=await db.collection('outings').where('name','==',studentName).where('department','==',dept).where('date','>=',range.start).where('date','<=',checkEnd).get();
        
        var submittedDates=new Set();
        subSnap.docs.forEach(function(d){
            var data=d.data();
            if(data.status!=='cancelled')submittedDates.add(data.date);
        });
        outSnap.docs.forEach(function(d){
            var data=d.data();
            if(!data.status||data.status!=='cancelled')submittedDates.add(data.date);
        });
        
        var missedDates=[];
        allDates.forEach(function(ds){
            if(!submittedDates.has(ds)){
                if(isWeekendOrHoliday(ds)){
                    submittedDates.add(ds);
                }else{
                    missedDates.push(ds);
                }
            }
        });
        
        var rate=Math.round((allDates.length-missedDates.length)/allDates.length*100);
        
        if(missedDates.length>0){
            return{eligible:false,reason:'인원보고 '+rate+'% (미제출 '+missedDates.length+'일)',rate:rate,missed:missedDates.length,total:allDates.length};
        }
        return{eligible:true,reason:'인원보고 100% 달성!',rate:100,missed:0,total:allDates.length};
    }catch(e){
        return{eligible:false,reason:'확인 중 오류 발생'};
    }
}
async function checkAlreadyScratched(studentName){
    var monthKey=getLotteryMonth();
    try{
        var doc=await db.collection('lotteryResults').doc(monthKey+'_'+studentName).get();
        if(doc.exists)return doc.data();
        return null;
    }catch(e){return null}
}
async function getMonthWinner(){
    var monthKey=getLotteryMonth();
    try{
        var snap=await db.collection('lotteryResults').where('month','==',monthKey).where('result','==','win').get();
        if(!snap.empty)return snap.docs[0].data();
        return null;
    }catch(e){return null}
}
async function scratchLottery(studentName,dept){
    var monthKey=getLotteryMonth();
    var already=await checkAlreadyScratched(studentName);
    if(already){
        if(already.result==='win'){
            showLotteryResult(true,studentName);
        }else{
            showLotteryResult(false,studentName);
        }
        return;
    }
    
    var winner=await getMonthWinner();
    var result='lose';
    
    if(!winner){
        var today=new Date();
        var lastDay=new Date(today.getFullYear(),today.getMonth()+1,0);
        var remainDays=lastDay.getDate()-today.getDate();
        
        var snap=await db.collection('lotteryResults').where('month','==',monthKey).get();
        var totalScratched=snap.docs.length;
        
        var allEligible=0;
        for(var i=0;i<departments.length;i++){
            var deptStudents=students[departments[i]]||[];
            for(var j=0;j<deptStudents.length;j++){
                var check=await checkStudentLotteryEligible(deptStudents[j],departments[i]);
                if(check.eligible)allEligible++;
            }
        }
        
        var remainEligible=Math.max(1,allEligible-totalScratched);
        var winChance=1/remainEligible;
        
        if(remainDays<=3)winChance=Math.min(1,winChance*3);
        if(remainDays<=1)winChance=1;
        
        if(Math.random()<winChance)result='win';
    }
    
    await db.collection('lotteryResults').doc(monthKey+'_'+studentName).set({
        month:monthKey,
        student:studentName,
        department:dept,
        result:result,
        scratchedAt:new Date().toISOString()
    });
    
    showLotteryResult(result==='win',studentName);
}

async function startScratchAnimation(){

    btn.innerHTML='<i class="fas fa-spinner fa-spin mr-2"></i>긁는 중...';
    
    var el=document.getElementById('lotteryContent');

    var emojis=['🎫','✨','🌟','💫','⭐','🎪','🎭','🎨'];
    
    for(var i=0;i<=100;i+=5){
        await new Promise(function(r){setTimeout(r,80)});
        if(bar)bar.style.width=i+'%';
        if(emoji&&i%15===0)emoji.textContent=emojis[Math.floor(Math.random()*emojis.length)];

    if(student&&dept){
        await scratchLottery(student,dept);

async function loadLotteryHistory(){
    var el=document.getElementById('lotteryHistoryContent');
    if(!el)return;
    el.innerHTML='<div class="text-center py-4 mt-3"><i class="fas fa-spinner fa-spin text-gray-400 text-xl"></i></div>';
    
    try{
        var snap=await db.collection('lotteryResults').where('result','==','win').get();
        var winners=snap.docs.map(function(d){return d.data()});
        winners.sort(function(a,b){return(b.month||'').localeCompare(a.month||'')});

            el.innerHTML='<div class="text-center py-4 mt-3 text-gray-400"><div class="text-sm">당첨 이력이 없습니다</div></div>';
            return;

async function resetLotteryMonth(){
    if(!isSuperAdmin){showToast('슈퍼 관리자만 가능','error');return}
    var monthKey=getLotteryMonth();
    openConfirmModal('이벤트 초기화',getLotteryMonthLabel()+' 이벤트 결과를 모두 초기화하시겠습니까?<br><br>모든 참여 기록과 당첨 결과가 삭제됩니다.',async function(){
        try{
            var snap=await db.collection('lotteryResults').where('month','==',monthKey).get();
            var batch=db.batch();
            snap.docs.forEach(function(d){batch.delete(d.ref)});
            await batch.commit();
            showToast('이벤트 초기화 완료','success');
            loadLotteryAdminData();
        }catch(e){showToast('초기화 실패','error')}
    },'초기화');
}

            overnight: oN.length,

var _tempDeptOrder=[];
function moveDeptOrder(idx,dir){
    if(!_tempDeptOrder.length)_tempDeptOrder=departments.slice();
    var newIdx=idx+dir;
    if(newIdx<0||newIdx>=_tempDeptOrder.length)return;
    var temp=_tempDeptOrder[idx];
    _tempDeptOrder[idx]=_tempDeptOrder[newIdx];
    _tempDeptOrder[newIdx]=temp;
    departments=_tempDeptOrder.slice();
    closeModal();
    showDeptOrderModal();
}
async function saveDeptOrder(){
    if(!_tempDeptOrder.length)_tempDeptOrder=departments.slice();

        departments=_tempDeptOrder.slice();

        render();
    }catch(e){
        showToast('저장 실패: '+e.message,'error');
    }
}

function selectStar(n){
    window._selectedStar=n;
    for(var i=1;i<=5;i++){
        var el=document.getElementById('star_'+i);
        if(el){
            if(i<=n){
                el.className='text-3xl transition-all btn-press text-yellow-400';
                el.style.filter='drop-shadow(0 0 4px rgba(250,204,21,0.5))';
            }else{
                el.className='text-3xl transition-all btn-press text-gray-300';
                el.style.filter='none';
            }
        }
    }
    var label=document.getElementById('starLabel');
    if(label){
        label.textContent=getStarLabel(n);
        label.className='text-xs font-bold '+getStarColor(n).textClass;
    }
}

function getStarLabel(n){
    if(n===0)return'미설정';
    if(n===1)return'관심 (1단계)';
    if(n===2)return'주의 (2단계)';
    if(n===3)return'경고 (3단계)';
    if(n===4)return'심각 (4단계)';
    if(n===5)return'위험 (5단계)';
    return'';
}

function getStarColor(n){
    if(n===0)return{bg:'text-gray-400',iconColor:'#9ca3af',textClass:'text-gray-400',dotBg:'bg-gray-300'};
    if(n===1)return{bg:'text-green-500',iconColor:'#22c55e',textClass:'text-green-600',dotBg:'bg-green-400'};
    if(n===2)return{bg:'text-yellow-500',iconColor:'#eab308',textClass:'text-yellow-600',dotBg:'bg-yellow-400'};
    if(n===3)return{bg:'text-orange-500',iconColor:'#f97316',textClass:'text-orange-600',dotBg:'bg-orange-400'};
    if(n===4)return{bg:'text-red-500',iconColor:'#ef4444',textClass:'text-red-600',dotBg:'bg-red-500'};
    if(n===5)return{bg:'text-red-700',iconColor:'#b91c1c',textClass:'text-red-700',dotBg:'bg-red-700'};
    return{bg:'text-gray-400',iconColor:'#9ca3af',textClass:'text-gray-400',dotBg:'bg-gray-300'};
}

function confirmSaveRoomMemo(roomNum){
    var memo=document.getElementById('roomMemoInput').value.trim();
    var star=window._selectedStar||0;
    
    if(!memo&&star===0){
        deleteRoomMemo(roomNum);
        return;
    }
    
    db.collection('roomMemos').doc(roomNum).set({
        memo:memo,
        star:star,
        updatedAt:new Date().toISOString()
    }).then(function(){
        roomMemos[roomNum]={memo:memo,star:star};
        closeModal();
        render();
        showToast(roomNum+'호 메모 저장 완료','success');
    });
}

}function getRoomStatus(){
  var STAFF_ROOMS=[];
  var EXCLUDED=['322'];
  var floors={
    '1':{label:'1층 (여학생)',rooms:[],start:101,end:111,type:'female'},
    '2':{label:'2층 (남학생)',rooms:[],start:201,end:229,type:'male'},
    '3':{label:'3층 (남학생)',rooms:[],start:301,end:329,type:'male'},
    '4':{label:'4층 (남학생)',rooms:[],start:401,end:429,type:'male'}
  };
  var roomMap={};
  departments.forEach(function(d){(students[d]||[]).forEach(function(name){
    var room=window._secureData.getRoomNumber(name);
    if(!room)return;
    if(!roomMap[room])roomMap[room]=[];
    roomMap[room].push({name:name,dept:d});
  })});
  Object.keys(floors).forEach(function(f){
    var fl=floors[f];
    for(var r=fl.start;r<=fl.end;r++){
      var rs=String(r);
      if(EXCLUDED.indexOf(rs)!==-1)continue;
var members=roomMap[rs]||[];
var isStaff=STAFF_ROOMS.indexOf(rs)!==-1;
fl.rooms.push({room:rs,members:members,count:members.length,isStaff:isStaff});
    }
  });
  var total=0,empty=0,single=0,doubleUp=0,staffCount=0;
var female={total:0,empty:0,single:0,doubleUp:0},male={total:0,empty:0,single:0,doubleUp:0};
Object.keys(floors).forEach(function(fk){var fl=floors[fk];fl.rooms.forEach(function(r){
    if(r.isStaff){staffCount++;return;}
    total++;if(r.count===0)empty++;else if(r.count===1)single++;else doubleUp++;
    if(fl.type==='female'){female.total++;if(r.count===0)female.empty++;else if(r.count===1)female.single++;else female.doubleUp++;}
    else{male.total++;if(r.count===0)male.empty++;else if(r.count===1)male.single++;else male.doubleUp++;}
  })});
  return{floors:floors,totalRooms:total,emptyRooms:empty,singleRooms:single,doubleRooms:doubleUp,staffRooms:staffCount,
    femaleTotal:female.total,femaleEmpty:female.empty,femaleSingle:female.single,femaleDouble:female.doubleUp,
    maleTotal:male.total,maleEmpty:male.empty,maleSingle:male.single,maleDouble:male.doubleUp};
}

function applyMenuControl(){
    var officeBtn=document.querySelector('button[onclick="showOfficeLogin()"]');if(officeBtn)officeBtn.style.display=menuControlSettings.showOfficeMenu?'':'none';
    document.querySelectorAll('button').forEach(function(b){if(b.textContent.trim()==='난방신청'||b.textContent.trim()==='냉방신청')b.style.display=menuControlSettings.showHvacTab?'':'none';if(b.textContent.trim()==='시설민원')b.style.display=menuControlSettings.showFacilityRequest!==false?'':'none'});
    var leaderMsgSec=document.getElementById('leaderMessageSection');if(leaderMsgSec)leaderMsgSec.style.display=menuControlSettings.showLeaderMessage!==false?'':'none';
    var adminMsgToggle=document.querySelector('[onclick="toggleManageSection(\'sec-messages-status\')"]');if(adminMsgToggle){var adminMsgWrapper=adminMsgToggle.closest('.bg-white.rounded-2xl');if(adminMsgWrapper)adminMsgWrapper.style.display=menuControlSettings.showLeaderMessage!==false?'':'none'}
    var t1=document.getElementById('toggleOfficeMenu'),t2=document.getElementById('toggleHvacTab'),t3=document.getElementById('toggleLeaderMessage'),t4=document.getElementById('toggleFacilityRequest');
    if(t1)t1.checked=menuControlSettings.showOfficeMenu;if(t2)t2.checked=menuControlSettings.showHvacTab;if(t3)t3.checked=menuControlSettings.showLeaderMessage!==false;if(t4)t4.checked=menuControlSettings.showFacilityRequest!==false;

}

function _doSectionMerge(sourceSecId, targetSecId, mergeClass, headerBg, headerBd, iconBg, iconColor, titleColor, iconClass, titleText){
    var sourceToggle=document.querySelector('[onclick="toggleManageSection(\''+sourceSecId+'\')"]');
    var sourceSec=document.getElementById(sourceSecId);
    var targetSec=document.getElementById(targetSecId);
    if(!sourceToggle||!sourceSec||!targetSec)return;
    if(targetSec.querySelector('.'+mergeClass))return;
    var sourceParent=sourceToggle.closest('.mb-4');
    var wrapper=document.createElement('div');wrapper.className=mergeClass+' mt-5 pt-5';
    var header=document.createElement('div');header.className='flex items-center justify-between p-4 rounded-xl border cursor-pointer select-none';
    header.style.cssText='background:'+headerBg+';border-color:'+headerBd;
    header.innerHTML='<div class="flex items-center gap-3"><div class="w-8 h-8 rounded-lg flex items-center justify-center" style="background:'+iconBg+'"><i class="fas '+iconClass+'" style="color:'+iconColor+'"></i></div><h3 class="font-bold text-base" style="color:'+titleColor+'">'+titleText+'</h3></div><i class="fas fa-chevron-down transition-transform" style="color:#94a3b8"></i>';
    var content=document.createElement('div');content.style.display='none';content.className='mt-3';
    sourceSec.querySelectorAll(':scope > *').forEach(function(c){content.appendChild(c.cloneNode(true))});
    header.onclick=function(){var icon=header.querySelector('.fa-chevron-down,.fa-chevron-up');if(content.style.display==='none'){content.style.display='';if(icon)icon.className=icon.className.replace('fa-chevron-down','fa-chevron-up')}else{content.style.display='none';if(icon)icon.className=icon.className.replace('fa-chevron-up','fa-chevron-down')}};
    wrapper.appendChild(header);wrapper.appendChild(content);targetSec.appendChild(wrapper);
    if(sourceParent)sourceParent.remove();
}

// ===== 아코디언 부착 헬퍼 =====
function _attachAccordion(titleText){
    var span=null;document.querySelectorAll('span.font-bold.text-gray-700').forEach(function(s){if(s.textContent.trim()===titleText)span=s});
    if(!span)return;
    var header=span.closest('.flex.items-center.justify-between');
    if(!header||header.querySelector('.section-chevron'))return;
    var chevron=document.createElement('i');chevron.className='fas fa-chevron-down text-gray-400 transition-transform section-chevron';chevron.style.cssText='cursor:pointer;transition:transform 0.3s';header.appendChild(chevron);
    var parent=header.parentElement;var siblings=[];var started=false;
    for(var k=0;k<parent.children.length;k++){if(parent.children[k]===header){started=true;continue}if(started)siblings.push(parent.children[k])}
    var wrapper=document.createElement('div');wrapper.className='section-content';wrapper.style.cssText='transition:max-height 0.3s ease,opacity 0.3s ease;overflow:hidden';
    siblings.forEach(function(s){wrapper.appendChild(s)});parent.appendChild(wrapper);
    header.style.cursor='pointer';wrapper.style.maxHeight='none';wrapper.style.opacity='1';
    chevron.addEventListener('click',function(e){e.stopPropagation();var isOpen=wrapper.style.opacity!=='0';if(isOpen){wrapper.style.maxHeight=wrapper.scrollHeight+'px';wrapper.offsetHeight;wrapper.style.maxHeight='0px';wrapper.style.opacity='0';chevron.style.transform='rotate(-180deg)'}else{wrapper.style.maxHeight='none';wrapper.style.opacity='1';chevron.style.transform='rotate(0deg)'}});
    var obs=new MutationObserver(function(){if(wrapper.style.opacity!=='0')wrapper.style.maxHeight='none'});obs.observe(wrapper,{childList:true,subtree:true});
}

function setAttendRange(days){
    var end=new Date(),start=new Date();
    start.setDate(start.getDate()-days+1);
    document.getElementById('attendStart').value=start.getFullYear()+'-'+String(start.getMonth()+1).padStart(2,'0')+'-'+String(start.getDate()).padStart(2,'0');
    document.getElementById('attendEnd').value=end.getFullYear()+'-'+String(end.getMonth()+1).padStart(2,'0')+'-'+String(end.getDate()).padStart(2,'0');
}

async function loadAttendance(){
    var name=document.getElementById('attendName').value;
    var startD=document.getElementById('attendStart').value;
    var endD=document.getElementById('attendEnd').value;
    var area=document.getElementById('attendResult');
    if(!name){showToast('교육생을 선택하세요','warning');return}
    if(!startD||!endD){showToast('기간을 선택하세요','warning');return}
    area.innerHTML='<div class="text-sm text-gray-400 text-center py-3 mt-3">조회 중...</div>';
    try{
        var subSnap=await db.collection('submissions').where('name','==',name).where('date','>=',startD).where('date','<=',endD).get();
        var outSnap=await db.collection('outings').where('name','==',name).where('date','>=',startD).where('date','<=',endD).get();
        var subs2=subSnap.docs.map(function(d){return Object.assign({id:d.id},d.data())}).filter(function(s){return s.status!=='cancelled'});
        var outs2=outSnap.docs.map(function(d){return Object.assign({id:d.id},d.data())}).filter(function(o){return !o.status||o.status!=='cancelled'});
        var stayCount=subs2.filter(function(s){return s.status==='stay'}).length;
        var outCount=subs2.filter(function(s){return s.status==='out'}).length;
        var outingCount=outs2.length;
        var allDates=[];var cur=new Date(startD+'T00:00:00');var endDate=new Date(endD+'T00:00:00');
        while(cur<=endDate){allDates.push(cur.getFullYear()+'-'+String(cur.getMonth()+1).padStart(2,'0')+'-'+String(cur.getDate()).padStart(2,'0'));cur.setDate(cur.getDate()+1)}
        var html='<div class="mt-3"><div class="grid grid-cols-4 gap-2 mb-3"><div class="text-center p-2 bg-surface-50 rounded-xl"><div class="text-lg font-black text-gray-700">'+allDates.length+'</div><div class="text-xs text-gray-500 font-bold">조회일</div></div><div class="text-center p-2 bg-success-50 rounded-xl"><div class="text-lg font-black text-success-600">'+stayCount+'</div><div class="text-xs text-success-600 font-bold">잔류</div></div><div class="text-center p-2 bg-warning-50 rounded-xl"><div class="text-lg font-black text-warning-600">'+outCount+'</div><div class="text-xs text-warning-600 font-bold">외박</div></div><div class="text-center p-2 bg-info-50 rounded-xl"><div class="text-lg font-black text-info-600">'+outingCount+'</div><div class="text-xs text-info-600 font-bold">외출</div></div></div>';
        html+='<div class="space-y-1 max-h-60 overflow-y-auto">';
        allDates.forEach(function(dateStr){
            var sub=subs2.find(function(s){return s.date===dateStr});
            var out=outs2.find(function(o){return o.date===dateStr});
            var di=formatDateWithDay(dateStr);
            var dateClass=di.isHoliday?'text-danger-600':di.isWeekend?'text-info-600':'text-gray-600';
            var status='미제출',statusClass='text-gray-400',icon='fa-minus';
            if(sub&&sub.status==='stay'){status='잔류';statusClass='text-success-600';icon='fa-check-circle'}
            else if(sub&&sub.status==='out'){status='외박';statusClass='text-warning-600';icon='fa-moon'}
            else if(out){status='외출';statusClass='text-info-600';icon='fa-walking'}
            else if(isWeekendOrHoliday(dateStr)){status='외박(자동)';statusClass='text-warning-400';icon='fa-moon'}
            html+='<div class="flex items-center justify-between py-2 px-3 border-b border-surface-100"><span class="text-sm font-medium '+dateClass+'">'+dateStr.substring(5)+(di.holiday?' '+di.holiday:'')+'</span><span class="text-sm font-bold '+statusClass+'"><i class="fas '+icon+' mr-1"></i>'+status+'</span></div>';
        });
        html+='</div></div>';
        area.innerHTML=html;
    }catch(e){area.innerHTML='<div class="text-sm text-danger-500 text-center py-3 mt-3">조회 실패: '+escapeHtml(e.message)+'</div>'}
}

async function loadResignHistory(){

    try{
        var approved=resignRequests.filter(function(r){return r.status==='approved'});

        if(approved.length===0&&pending.length===0){area.innerHTML='<div class="text-sm text-gray-400 text-center py-3">퇴사 이력이 없습니다</div>';return}
        var html='';

            html+='<div class="mb-4"><div class="text-sm font-bold text-warning-600 mb-2">대기 중 '+pending.length+'건</div><div class="space-y-2">';

            approved.sort(function(a,b){return(b.approvedDate||'').localeCompare(a.approvedDate||'')});
            approved.forEach(function(r){html+='<div class="flex items-center justify-between bg-surface-50 px-4 py-3 rounded-xl border border-surface-200"><div><span class="font-bold text-gray-700">'+escapeHtml(r.name)+'</span><span class="text-sm text-gray-500 ml-2">['+escapeHtml(r.department)+']</span><div class="text-xs text-gray-500 mt-1">퇴사일: '+escapeHtml(r.approvedDate||'')+' · 사유: '+escapeHtml(r.reason)+'</div></div><span class="text-xs font-bold text-gray-500">승인</span></div>'});

        }
        area.innerHTML=html;
    }catch(e){area.innerHTML='<div class="text-sm text-danger-500 text-center py-3">조회 실패</div>'}

async function downloadResignHistory(){
    try{
        await loadExcelJS();
        var all=resignRequests.slice();
        if(all.length===0){showToast('퇴사 이력이 없습니다','info');return}
        var wb=new ExcelJS.Workbook(),ws=wb.addWorksheet('퇴사이력');
        ws.columns=[{header:'학과',key:'dept',width:25},{header:'이름',key:'name',width:15},{header:'상태',key:'status',width:10},{header:'퇴사예정일',key:'resignDate',width:15},{header:'승인일',key:'approvedDate',width:15},{header:'사유',key:'reason',width:30}];
        ws.getRow(1).font={bold:true};
        all.forEach(function(r){ws.addRow({dept:r.department,name:r.name,status:r.status==='approved'?'승인':'대기',resignDate:r.resignDate||'',approvedDate:r.approvedDate||'',reason:r.reason||''})});
        var buf=await wb.xlsx.writeBuffer();
        var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='퇴사이력_'+getCurrentDate()+'.xlsx';a.click();
        showToast('다운로드 완료','success');
    }catch(e){showToast('다운로드 실패: '+e.message,'error')}
}

        var o=document.createElement('option');o.value=n;o.textContent=formatStudentNameRaw(n);sel.appendChild(o);
    });
}

async function updateStudentAge(){
    var name=document.getElementById('editStudentName').value;
    var birthYear=document.getElementById('editStudentBirthYear2').value.trim();
    if(!name){showToast('교육생을 선택하세요','warning');return}
    if(!birthYear){
        try{await db.collection('roomNumbers').doc(name).update({age:firebase.firestore.FieldValue.delete(),updatedAt:new Date().toISOString()});showToast(name+' 나이 정보 삭제','success')}catch(e){showToast('삭제 실패','error')}
        return;
    }
    var by=parseInt(birthYear);var ageVal=null;
    if(by>=1950&&by<=2015){ageVal=new Date().getFullYear()-by}
    else if(by>=0&&by<=99){var fullYear=by<=30?2000+by:1900+by;ageVal=new Date().getFullYear()-fullYear}
    if(!ageVal||ageVal<1||ageVal>79){showToast('올바른 생년을 입력하세요 (예: 1997 또는 97)','warning');return}
    try{await db.collection('roomNumbers').doc(name).set({age:ageVal,updatedAt:new Date().toISOString()},{merge:true});showToast(name+' 나이 '+ageVal+'세 저장 완료','success')}catch(e){showToast('저장 실패','error')}
}
async function updateStudentName(){
    var dept = document.getElementById('editStudentDept').value;
    var oldName = document.getElementById('editStudentName').value;
    var newName = document.getElementById('editStudentNewName').value.trim();
    
    if(!dept || !oldName){showToast('교육생을 선택하세요','warning');return}
    if(!newName){showToast('새 이름을 입력하세요','warning');return}
    if(oldName === newName){showToast('현재 이름과 동일합니다','warning');return}
    
    // 이미 존재하는 이름인지 확인
    var exists = false;
    departments.forEach(function(d){
        if((students[d]||[]).includes(newName)) exists = true;
    });
    if(exists){showToast('이미 존재하는 이름입니다','warning');return}
    
    openConfirmModal('이름 변경',
        '<b>' + escapeHtml(oldName) + '</b> → <b>' + escapeHtml(newName) + '</b><br><br>' +
        '다음 항목이 함께 변경됩니다:<br>' +
        '• 학생 명단<br>• 호실 정보<br>• 비밀번호<br>• 학과대표 (해당 시)',
        async function(){
            try{
                showToast('이름 변경 중...','info');
                
                // 1. 기존 데이터 가져오기
                var oldRoom = window._secureData.getRoomNumber(oldName);
                var oldPw = window._secureData.getPassword(oldName);
                var oldRegDate = window._secureData.getRegisteredDate(oldName);
                
                var batch = db.batch();
                
                // 2. students 컬렉션: 명단에서 이름 교체
                var studentList = (window._secureData.getStudentsByDept(dept) || []).slice();
                var idx = studentList.indexOf(oldName);
                if(idx !== -1) studentList[idx] = newName;
                batch.set(db.collection('students').doc(dept), {
                    students: studentList,
                    updatedAt: new Date().toISOString()
                });
                
                // 3. roomNumbers: 새 이름으로 복사 후 기존 삭제
                if(oldRoom){
                    batch.set(db.collection('roomNumbers').doc(newName), {
                        room: oldRoom,
                        department: dept,
                        registeredDate: oldRegDate || '',
                        updatedAt: new Date().toISOString()
                    });
                    batch.delete(db.collection('roomNumbers').doc(oldName));
                }
                
                // 4. passwords: 새 이름으로 복사 후 기존 삭제
                if(oldPw){
                    batch.set(db.collection('passwords').doc(newName), {
                        password: oldPw,
                        department: dept,
                        registeredDate: oldRegDate || '',
                        updatedAt: new Date().toISOString()
                    });
                    batch.delete(db.collection('passwords').doc(oldName));
                }
                
                // 5. 학과대표인 경우 업데이트
                if(DEPARTMENT_LEADERS[dept] && DEPARTMENT_LEADERS[dept].name === oldName){
                    batch.update(db.collection('departmentLeaders').doc(dept), {
                        name: newName,
                        updatedAt: new Date().toISOString()
                    });
                }
                
                await batch.commit();
                
                // 6. 과거 제출 이력(submissions)도 업데이트
                var subSnap = await db.collection('submissions')
                    .where('name','==',oldName)
                    .where('department','==',dept)
                    .get();
                if(!subSnap.empty){
                    var subBatch = db.batch();
                    var count = 0;
                    subSnap.docs.forEach(function(doc){
                        // 새 문서 ID 생성 (날짜_학과_새이름)
                        var data = doc.data();
                        var newDocId = data.date + '_' + dept + '_' + newName;
                        subBatch.set(db.collection('submissions').doc(newDocId), 
                            Object.assign({}, data, {name: newName, updatedAt: new Date().toISOString()})
                        );
                        subBatch.delete(doc.ref);
                        count++;
                        if(count >= 400){
                            subBatch.commit();
                            subBatch = db.batch();
                            count = 0;
                        }
                    });
                    if(count > 0) await subBatch.commit();
                }
                
                // 7. 외출 이력(outings)도 업데이트
                var outSnap = await db.collection('outings')
                    .where('name','==',oldName)
                    .where('department','==',dept)
                    .get();
                if(!outSnap.empty){
                    var outBatch = db.batch();
                    var count2 = 0;
                    outSnap.docs.forEach(function(doc){
                        var data = doc.data();
                        var newDocId = data.date + '_' + dept + '_' + newName;
                        outBatch.set(db.collection('outings').doc(newDocId),
                            Object.assign({}, data, {name: newName, updatedAt: new Date().toISOString()})
                        );
                        outBatch.delete(doc.ref);
                        count2++;
                        if(count2 >= 400){
                            outBatch.commit();
                            outBatch = db.batch();
                            count2 = 0;
                        }
                    });
                    if(count2 > 0) await outBatch.commit();
                }
                
                // 8. 퇴사 신청 업데이트
                var resignSnap = await db.collection('resignRequests')
                    .where('name','==',oldName)
                    .where('department','==',dept)
                    .get();
                if(!resignSnap.empty){
                    var resignBatch = db.batch();
                    resignSnap.docs.forEach(function(doc){
                        var data = doc.data();
                        var newDocId = dept + '_' + newName;
                        resignBatch.set(db.collection('resignRequests').doc(newDocId),
                            Object.assign({}, data, {name: newName, updatedAt: new Date().toISOString()})
                        );
                        resignBatch.delete(doc.ref);
                    });
                    await resignBatch.commit();
                }
                
                // 9. 냉난방 신청 업데이트
                var hvacSnap = await db.collection('hvacRequests')
                    .where('requestedBy','==',oldName)
                    .get();
                if(!hvacSnap.empty){
                    var hvacBatch = db.batch();
                    hvacSnap.docs.forEach(function(doc){
                        hvacBatch.update(doc.ref, {requestedBy: newName, updatedAt: new Date().toISOString()});
                    });
                    await hvacBatch.commit();
                }
                
                // 10. 시설 민원 업데이트
                var facSnap = await db.collection('facilityRequests')
                    .where('student','==',oldName)
                    .get();
                if(!facSnap.empty){
                    var facBatch = db.batch();
                    facSnap.docs.forEach(function(doc){
                        facBatch.update(doc.ref, {student: newName, updatedAt: new Date().toISOString()});
                    });
                    await facBatch.commit();
                }
                
                // 11. 출입 신청 업데이트
                var accSnap = await db.collection('accessRequests')
                    .where('student','==',oldName)
                    .get();
                if(!accSnap.empty){
                    var accBatch = db.batch();
                    accSnap.docs.forEach(function(doc){
                        accBatch.update(doc.ref, {student: newName, updatedAt: new Date().toISOString()});
                    });
                    await accBatch.commit();
                }
                
                // 12. 호실 메모 업데이트 (roomMemos는 호실 기준이라 변경 불필요)
                
                // 13. 비밀번호 변경 이력 업데이트
                var pwLogSnap = await db.collection('passwordChangeLogs')
                    .where('name','==',oldName)
                    .get();
                if(!pwLogSnap.empty){
                    var pwBatch = db.batch();
                    pwLogSnap.docs.forEach(function(doc){
                        pwBatch.update(doc.ref, {name: newName, updatedAt: new Date().toISOString()});
                    });
                    await pwBatch.commit();
                }
                
                showToast(oldName + ' → ' + newName + ' 이름 변경 완료', 'success');
                showSuccessAnimation('이름 변경 완료', oldName + ' → ' + newName);
                
                // UI 초기화
                document.getElementById('editStudentInfo').style.display = 'none';
                document.getElementById('editStudentName').value = '';
                document.getElementById('editStudentNewName').value = '';
                render();
                
            }catch(e){
                showToast('이름 변경 실패: ' + e.message, 'error');
                console.error('이름 변경 오류:', e);
            }
        }, '변경'
    );
}


async function moveStudentDept(){
    var oldDept=document.getElementById('editStudentDept').value;
    var name=document.getElementById('editStudentName').value;
    var newDept=document.getElementById('editStudentNewDept').value;
    if(!oldDept||!name||!newDept){showToast('모든 항목을 선택하세요','warning');return}
    if(oldDept===newDept){showToast('같은 학과입니다','warning');return}
    openConfirmModal('학과 이동',escapeHtml(name)+'을(를)<br><b>'+escapeHtml(oldDept)+'</b> → <b>'+escapeHtml(newDept)+'</b>로 이동?',async function(){
        try{
            var oldList=(window._secureData.getStudentsByDept(oldDept)||[]).filter(function(s){return s!==name});
            var newList=(window._secureData.getStudentsByDept(newDept)||[]).concat([name]);
            var batch=db.batch();
            batch.set(db.collection('students').doc(oldDept),{students:oldList,updatedAt:new Date().toISOString()});
            batch.set(db.collection('students').doc(newDept),{students:newList,updatedAt:new Date().toISOString()});
            batch.set(db.collection('roomNumbers').doc(name),{department:newDept,updatedAt:new Date().toISOString()},{merge:true});
            batch.set(db.collection('passwords').doc(name),{department:newDept,updatedAt:new Date().toISOString()},{merge:true});
            if(DEPARTMENT_LEADERS[oldDept]&&DEPARTMENT_LEADERS[oldDept].name===name){batch.delete(db.collection('departmentLeaders').doc(oldDept))}
            await batch.commit();
            showToast(name+' → '+newDept+' 이동 완료','success');
            document.getElementById('editStudentInfo').style.display='none';
            render();
        }catch(e){showToast('이동 실패: '+e.message,'error')}
    },'이동');
}

}
