function getAvailableDates(){
    var now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate()),todayStr=getCurrentDate();
    var result=[{date:todayStr,label:getDateLabel(todayStr)}],added=new Set([todayStr]);

function getStats(){
    var ts=submissions.filter(function(s){return s.date===currentDate&&s.status!=='cancelled'}),to=outings.filter(function(o){return o.date===currentDate&&(!o.status||o.status!=='cancelled')});
    var allKeys=new Set(),femKeys=new Set();
    var approvedBefore=resignRequests.filter(function(r){return r.status==='approved'&&r.approvedDate&&r.approvedDate<=currentDate});
    var approvedAfter=resignRequests.filter(function(r){return r.status==='approved'&&r.approvedDate&&r.approvedDate>currentDate});
    departments.forEach(function(dept){var currentList=students[dept]||[];var deptList=currentList.slice();approvedAfter.forEach(function(r){if(r.department===dept&&!deptList.includes(r.name))deptList.push(r.name)});deptList=deptList.filter(function(name){return !approvedBefore.some(function(r){return r.department===dept&&r.name===name})});deptList.forEach(function(name){allKeys.add(dept+'_'+name);if(name.includes('(여)'))femKeys.add(dept+'_'+name)})});
    var uSub=new Map();ts.forEach(function(s){var k=s.department+'_'+s.name;if(allKeys.has(k))uSub.set(k,s.status)});
    var stayCount=0,outCount=0,femStay=0,femOut=0;
    uSub.forEach(function(v,k){if(v==='stay'){stayCount++;if(femKeys.has(k))femStay++}if(v==='out'){outCount++;if(femKeys.has(k))femOut++}});
    var subKeys=new Set(uSub.keys());to.forEach(function(o){var k=o.department+'_'+o.name;if(allKeys.has(k))subKeys.add(k)});
    var outingCount=0,femOuting=0;to.forEach(function(o){var k=o.department+'_'+o.name;if(allKeys.has(k)&&!uSub.has(k)){outingCount++;if(femKeys.has(k))femOuting++}});
    var femNotSub=0;femKeys.forEach(function(k){if(!subKeys.has(k))femNotSub++});
    return{totalStudents:allKeys.size,totalFemales:femKeys.size,stayCount:stayCount,femaleStayCount:femStay,outCount:outCount,femaleOutCount:femOut,outingCount:outingCount,femaleOutingCount:femOuting,notSubmitted:Math.max(0,allKeys.size-subKeys.size),femaleNotSubmitted:femNotSub};
}

function isSubmitAllowed(){
    if(submitMode==='always')return{allowed:true};
    if(submitMode==='manual')return submitManualOpen?{allowed:true}:{allowed:false,reason:'현재 교육생 인원보고가 비활성화로 사용할 수 없습니다.'};
    if(submitMode==='auto'){
        var now=new Date(),day=now.getDay(),todayStr=getCurrentDate();
        var tomorrow=new Date(now);tomorrow.setDate(tomorrow.getDate()+1);
        var tomorrowStr=tomorrow.getFullYear()+'-'+String(tomorrow.getMonth()+1).padStart(2,'0')+'-'+String(tomorrow.getDate()).padStart(2,'0');
        if(day===5||day===6||day===0)return{allowed:true};
        if(HOLIDAYS[todayStr]||HOLIDAYS[tomorrowStr])return{allowed:true};
        return{allowed:false,reason:'주말 및 공휴일 기숙사 잔류자 신청\n(금요일~일요일, 공휴일 전날~공휴일에만 신청 가능)'};

}

async function sendMessage(){

    if(!text){showToast('내용을 입력하세요','warning');return}
    try{await db.collection('messages').add({department:leaderDepartment,author:DEPARTMENT_LEADERS[leaderDepartment]?DEPARTMENT_LEADERS[leaderDepartment].name:leaderDepartment,text:text,createdAt:new Date().toISOString(),status:'pending',reply:''});document.getElementById('messageInput').value='';showToast('전달사항이 전송되었습니다','success')}catch(e){showToast('전송 실패','error')}

    try{await db.collection('messages').doc(msgId).delete();showToast('삭제 완료','success')}catch(e){showToast('삭제 실패','error')}

async function confirmReadMessage(msgId){

    var now=new Date();if(now.getHours()>=23){showToast('신청 시간이 마감되었습니다 (23시 이전)','warning');return}
    var student=currentStudent;if(!student){showToast('로그인 정보 없음','error');return}
    var roomNum=window._secureData.getRoomNumber(student);if(!roomNum){showToast('호실 정보를 확인할 수 없습니다','error');return}
    var today=new Date().toISOString().split('T')[0];
    try{var existing=await db.collection('hvacRequests').where('room','==',roomNum).where('date','==',today).get();if(!existing.empty){showToast('오늘 이미 신청된 호실입니다','warning');return}
    await db.collection('hvacRequests').add({room:roomNum,type:hvacMode,requestedBy:student,department:currentStudentDept(),date:today,createdAt:new Date().toISOString(),status:'pending'});
    showToast(roomNum+'호 '+(hvacMode==='heating'?'난방':'냉방')+' 신청 완료','success');showSuccessAnimation((hvacMode==='heating'?'난방':'냉방')+' 신청 완료',currentStudent+' · '+new Date().toLocaleTimeString('ko-KR'));render()}catch(e){showToast('신청 실패','error')}
}

    // 통계
    h+='<div class="grid grid-cols-4 gap-2 mb-4"><div class="text-center p-3 bg-warning-50 rounded-xl border border-warning-200"><div class="text-xl font-black text-warning-600">'+pending.length+'</div><div class="text-xs text-warning-600 font-bold">대기</div></div><div class="text-center p-3 bg-success-50 rounded-xl border border-success-200"><div class="text-xl font-black text-success-600">'+replied.length+'</div><div class="text-xs text-success-600 font-bold">답변</div></div><div class="text-center p-3 bg-info-50 rounded-xl border border-info-200"><div class="text-xl font-black text-info-600">'+adminMsgs.length+'</div><div class="text-xs text-info-600 font-bold">발송</div></div><div class="text-center p-3 bg-surface-50 rounded-xl border border-surface-200"><div class="text-xl font-black text-gray-600">'+readMsgs.length+'</div><div class="text-xs text-gray-600 font-bold">확인</div></div></div>';

    // 메시지 보내기 (오늘만)
    if(msgDate===todayStr){
        h+='<div class="mb-4 p-4 bg-info-50 rounded-2xl border border-info-200"><div class="text-sm font-bold text-info-700 mb-2"><i class="fas fa-paper-plane mr-1"></i>학과대표에게 메시지 보내기</div><div class="flex gap-2 mb-2"><select id="adminMsgDept" class="flex-1 px-3 py-2.5 bg-white border border-surface-200 rounded-xl text-sm font-medium"><option value="">학과 선택</option>'+deptOptions+'</select></div><textarea id="adminMsgInput" rows="3" class="w-full px-4 py-3 bg-white border border-surface-200 rounded-xl text-sm resize-none mb-2" placeholder="학과대표에게 전달할 내용을 입력하세요..."></textarea><button onclick="sendAdminMessage()" class="w-full py-2.5 bg-info-500 text-white rounded-xl text-sm font-bold btn-press"><i class="fas fa-paper-plane mr-1"></i>전달하기</button></div>';
    }

    // 답변 대기
    if(pending.length>0){
        h+='<div class="mb-4"><div class="text-sm font-bold text-warning-600 mb-3"><i class="fas fa-clock mr-1"></i>답변 대기 '+pending.length+'건</div><div class="space-y-3">';

        });
        h+='</div></div>';
    }

    // 관리자 발송
    if(adminMsgs.length>0){
        h+='<div class="mb-4"><div class="text-sm font-bold text-info-600 mb-3"><i class="fas fa-paper-plane mr-1"></i>관리자 발송 '+adminMsgs.length+'건</div><div class="space-y-3">';
        adminMsgs.forEach(function(m){

        });
        h+='</div></div>';
    }

    // 확인 완료
    if(readMsgs.length>0){
        h+='<div class="mb-4"><div class="text-sm font-bold text-gray-500 mb-3"><i class="fas fa-check-double mr-1"></i>확인 완료 '+readMsgs.length+'건</div><div class="space-y-3">';

        });
        h+='</div></div>';
    }

    // 데이터 없음
    if(adminMsgs.length===0&&pending.length===0&&replied.length===0&&readMsgs.length===0){
        h+='<div class="text-center py-6 text-gray-400"><i class="fas fa-inbox text-2xl mb-2"></i><div class="text-sm">'+(msgDate===todayStr?'오늘 전달사항이 없습니다':'해당 날짜에 전달사항이 없습니다')+'</div></div>';
    }

    return h;
}

async function confirmBatchSubmit(){
    if(!quickSubmitMode){showToast('잔류(Stay)/외박(Out) 먼저 선택','warning');return}
    if(!isOnline){showToast('오프라인 상태입니다','warning');return}
    var checks=document.querySelectorAll('.batch-check');var all=[],checked=[],unchecked=[];
    checks.forEach(function(c){all.push(c.value);if(c.checked)checked.push(c.value)});
    unchecked=all.filter(function(s){return checked.indexOf(s)===-1});
    var cS=quickSubmitMode,uS=quickSubmitMode==='stay'?'out':'stay';
    var sd=getSelectedDate();
    openConfirmModal('일괄 제출','체크 '+checked.length+'명 → '+(cS==='stay'?'잔류':'외박')+'<br>나머지 '+unchecked.length+'명 → '+(uS==='stay'?'잔류':'외박'),async function(){
        try{
            var batch=db.batch(),ts=new Date().toLocaleTimeString('ko-KR');
            checked.forEach(function(name){batch.set(db.collection('submissions').doc(sd+'_'+leaderDepartment+'_'+name),{department:leaderDepartment,name:name,status:cS,date:sd,timestamp:ts})});
            unchecked.forEach(function(name){batch.set(db.collection('submissions').doc(sd+'_'+leaderDepartment+'_'+name),{department:leaderDepartment,name:name,status:uS,date:sd,timestamp:ts})});
            await batch.commit();
            showToast((checked.length+unchecked.length)+'명 일괄 제출 완료','success');showSuccessAnimation('일괄 제출 완료',(checked.length+unchecked.length)+'명 · '+new Date().toLocaleTimeString('ko-KR'));quickSubmitMode=null;render();
        }catch(e){showToast('일괄 제출 실패','error')}
    },'제출하기');
}
