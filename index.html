    <style>
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .fade-in { animation: fadeIn 0.3s ease-out; }
        .loading { 
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-size: 24px;
        }
        
        /* 커스텀 셀렉트 박스 스타일 */
        .custom-select {
            position: relative;
        }
        .custom-select select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-right: 3rem;
        }
        .custom-select::after {
            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);
            pointer-events: none;
            color: #6366f1;
            font-size: 1.25rem;
        }
        
        /* 활성화 애니메이션 */
        @keyframes activeButton {
            0%, 100% { transform: scale(1.05); box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
            50% { transform: scale(1.08); box-shadow: 0 6px 25px rgba(0,0,0,0.2); }
        }
        .active-mode-btn {
            animation: activeButton 2s ease-in-out infinite;
        }
        
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce {
            animation: bounce 1.5s ease-in-out infinite;
        }
        
        /* 비밀번호 입력 모달 스타일 */
        .password-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .password-modal.active {
            display: flex;
        }
        .password-modal-content {
            background: white;
            padding: 2rem;
            border-radius: 1.5rem;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 400px;

    const month = String(now.getMonth() + 1).padStart(2, '0');

    return `${year}-${month}-${day}`;
}

// 공휴일 체크 함수
function isHoliday(dateStr) {
    return HOLIDAYS.includes(dateStr);
}

// 신청 가능한 날짜 계산
function getAvailableDates() {
    // 실시간 현재 날짜 가져오기
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const date = now.getDate();
    
    const today = new Date(year, month, date); // 시간 정보 제거
    const dayOfWeek = today.getDay(); // 0(일) ~ 6(토)
    const availableDates = [];
    const addedDates = new Set(); // 중복 방지
    
    // 오늘 날짜 추가
    const todayStr = getCurrentDate(); // 실시간 날짜 함수 사용
    availableDates.push({
        date: todayStr,
        label: `오늘 (${getDateLabel(todayStr)})`
    });
    addedDates.add(todayStr);
    
    // 연속된 휴일(주말+공휴일) 찾기
    let checkDate = new Date(year, month, date);
    checkDate.setDate(checkDate.getDate() + 1);
    let consecutiveDays = 0;
    
    // 최대 7일까지 체크 (연휴 고려)
    for (let i = 1; i <= 7; i++) {
        const checkYear = checkDate.getFullYear();
        const checkMonth = String(checkDate.getMonth() + 1).padStart(2, '0');
        const checkDay = String(checkDate.getDate()).padStart(2, '0');
        const checkDateStr = `${checkYear}-${checkMonth}-${checkDay}`;
        const checkDayOfWeek = checkDate.getDay();
        
        // 주말이거나 공휴일인 경우
        const isWeekend = checkDayOfWeek === 0 || checkDayOfWeek === 6;
        const isHolidayDay = isHoliday(checkDateStr);
        
        if (isWeekend || isHolidayDay) {
            // 연속된 휴일
            if (!addedDates.has(checkDateStr)) {
                let label = '';
                if (i === 1) {
                    if (isHolidayDay && !isWeekend) {
                        label = `내일 공휴일 (${getDateLabel(checkDateStr)})`;
                    } else if (checkDayOfWeek === 6) {
                        label = `내일 토요일 (${getDateLabel(checkDateStr)})`;
                    } else if (checkDayOfWeek === 0) {
                        label = `내일 일요일 (${getDateLabel(checkDateStr)})`;
                    }
                } else {
                    const dayName = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'][checkDayOfWeek];
                    if (isHolidayDay && !isWeekend) {
                        label = `${dayName} 공휴일 (${getDateLabel(checkDateStr)})`;
                    } else {
                        label = `${dayName} (${getDateLabel(checkDateStr)})`;
                    }
                }
                
                availableDates.push({
                    date: checkDateStr,
                    label: label
                });
                addedDates.add(checkDateStr);
            }
            consecutiveDays++;
        } else {
            // 평일을 만나면 중단
            break;
        }
        
        checkDate.setDate(checkDate.getDate() + 1);
    }
    
    // 금요일인 경우 무조건 토요일, 일요일 추가 (위에서 추가 안 된 경우)
    if (dayOfWeek === 5) {
        const saturday = new Date(year, month, date);
        saturday.setDate(saturday.getDate() + 1);
        const satYear = saturday.getFullYear();
        const satMonth = String(saturday.getMonth() + 1).padStart(2, '0');
        const satDay = String(saturday.getDate()).padStart(2, '0');
        const saturdayStr = `${satYear}-${satMonth}-${satDay}`;
        
        if (!addedDates.has(saturdayStr)) {
            availableDates.push({
                date: saturdayStr,
                label: `내일 토요일 (${getDateLabel(saturdayStr)})`
            });
            addedDates.add(saturdayStr);
        }
        
        const sunday = new Date(year, month, date);
        sunday.setDate(sunday.getDate() + 2);
        const sunYear = sunday.getFullYear();
        const sunMonth = String(sunday.getMonth() + 1).padStart(2, '0');
        const sunDay = String(sunday.getDate()).padStart(2, '0');
        const sundayStr = `${sunYear}-${sunMonth}-${sunDay}`;
        
        if (!addedDates.has(sundayStr)) {
            availableDates.push({
                date: sundayStr,
                label: `일요일 (${getDateLabel(sundayStr)})`
            });
            addedDates.add(sundayStr);
        }
    }
    
    return availableDates;
}

// 날짜 라벨 생성 (월/일)
function getDateLabel(dateStr) {
    const [year, month, day] = dateStr.split('-');
    return `${parseInt(month)}/${parseInt(day)}`;
}

// 날짜 변경 함수 (관리자용)
function changeDate(days) {
    const [year, month, day] = currentDate.split('-');
    const date = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
    date.setDate(date.getDate() + days);
    
    const newYear = date.getFullYear();
    const newMonth = String(date.getMonth() + 1).padStart(2, '0');
    const newDay = String(date.getDate()).padStart(2, '0');
    currentDate = `${newYear}-${newMonth}-${newDay}`;
    
    console.log('날짜 변경:', days > 0 ? `+${days}일` : `${days}일`, '-> ', currentDate);
    render();
}

// 퇴사 승인 함수
async function approveResign(docId, name) {
    // 퇴사 요청 정보 찾기
    const resignRequest = resignRequests.find(r => r.id === docId);
    if (!resignRequest) {
        alert('× 퇴사 신청 정보를 찾을 수 없습니다.');
        return;
    }
    
    const dept = resignRequest.department;
    
    if (!confirm(`${name} 학생의 퇴사를 승인하시겠습니까?\n\n승인 시:\n- 학과 인원에서 제외됩니다\n- 전체 인원수가 감소합니다\n- 해당 학생의 모든 제출 기록이 삭제됩니다`)) {
        return;
    }
    
    try {
        // 1. 퇴사 승인 상태 업데이트
        await db.collection('resignRequests').doc(docId).update({
            status: 'approved',
            approvedDate: new Date().toISOString().split('T')[0]
        });
        
        // 2. 학생 명단에서 제거
        const studentIndex = students[dept].indexOf(name);
        if (studentIndex > -1) {
            students[dept].splice(studentIndex, 1);
        }
        
        // 3. 해당 학생의 모든 제출 기록 삭제 (submissions)
        const studentSubmissions = await db.collection('submissions')
            .where('department', '==', dept)
            .where('name', '==', name)
            .get();
        
        for (const doc of studentSubmissions.docs) {
            await doc.ref.delete();
        }
        
        // 4. 해당 학생의 모든 외출 기록 삭제 (outings)
        const studentOutings = await db.collection('outings')
            .where('department', '==', dept)
            .where('name', '==', name)
            .get();
        
        for (const doc of studentOutings.docs) {
            await doc.ref.delete();
        }
        
        alert(`✓ ${name} 학생의 퇴사가 승인되었습니다.\n\n- ${dept}에서 제외되었습니다\n- 모든 제출 기록이 삭제되었습니다`);
        render();
    } catch (error) {
        alert('× 승인 실패: ' + error.message);
    }
}

// 통계 계산
function getStats() {
    const todaySubmissions = submissions.filter(s => s.date === currentDate);
    const todayOutings = outings.filter(o => o.date === currentDate);
    const stayCount = todaySubmissions.filter(s => s.status === 'stay').length;
    const outCount = todaySubmissions.filter(s => s.status === 'out').length;
    const outingCount = todayOutings.length;
    const totalStudents = Object.values(students).flat().length;
    return {
        totalStudents,
        stayCount,
        outCount,
        outingCount,
        notSubmitted: totalStudents - stayCount - outCount - outingCount
    };
}

function renderDepartmentStatus(todaySubmissions, todayOutings) {
    return departments.map(dept => {
        const deptStudents = students[dept];
        
        // 학생별 상태 계산
        const studentStatus = deptStudents.map(student => {
            const stayRecord = todaySubmissions.find(s => s.status === 'stay' && s.department === dept && s.name === student);
            const outRecord = todaySubmissions.find(s => s.status === 'out' && s.department === dept && s.name === student);
            const outingRecord = todayOutings.find(o => o.department === dept && o.name === student);
            
            let status = 'none';
            let detail = null;
            let id = null;
            
            if (stayRecord) {
                status = 'stay';
                id = stayRecord.id;
            } else if (outRecord) {
                status = 'out';
                id = outRecord.id;
            } else if (outingRecord) {
                status = 'outing';
                detail = `${outingRecord.outingTime}~${outingRecord.returnTime} (${outingRecord.reason})`;
                id = outingRecord.id;
            }
            
            return { student, status, detail, id };
        });
        
        const stayCount = studentStatus.filter(s => s.status === 'stay').length;
        const outCount = studentStatus.filter(s => s.status === 'out').length;
        const outingCount = studentStatus.filter(s => s.status === 'outing').length;
        const noneCount = studentStatus.filter(s => s.status === 'none').length;
        
        return `
            <div class="bg-gray-50 rounded-2xl p-6 border border-gray-200 hover:shadow-md transition-all">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-xl font-bold text-gray-800">${dept}</h3>
                    <div class="text-sm font-medium text-gray-600">
                        전체 ${deptStudents.length}명 | 
                        <span class="text-teal-700">잔류 ${stayCount}</span> | 
                        <span class="text-amber-700">외박 ${outCount}</span> | 
                        <span class="text-sky-700">외출 ${outingCount}</span> | 
                        <span class="text-rose-700">미제출 ${noneCount}</span>

                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${studentStatus.map(({ student, status, detail, id }) => {

                            textColor = 'text-emerald-800';
                            icon = '<i class="fas fa-check-circle"></i>';
                            statusText = '잔류';
                            deleteBtn = `<button onclick="deleteSubmission('${id}', '${student}')" class="ml-2 text-red-600 hover:text-red-800" title="삭제"><i class="fas fa-times-circle"></i></button>`;
                        } else if (status === 'out') {
                            bgColor = 'bg-orange-100 border-orange-300';
                            textColor = 'text-orange-800';
                            icon = '<i class="fas fa-moon"></i>';
                            statusText = '외박';
                            deleteBtn = `<button onclick="deleteSubmission('${id}', '${student}')" class="ml-2 text-red-600 hover:text-red-800" title="삭제"><i class="fas fa-times-circle"></i></button>`;
                        } else if (status === 'outing') {
                            bgColor = 'bg-indigo-100 border-indigo-300';
                            textColor = 'text-indigo-800';
                            icon = '<i class="fas fa-walking"></i>';
                            statusText = '외출';
                            deleteBtn = `<button onclick="deleteOuting('${id}', '${student}')" class="ml-2 text-red-600 hover:text-red-800" title="삭제"><i class="fas fa-times-circle"></i></button>`;
                        } else {
                            bgColor = 'bg-gray-100 border-gray-300';
                            textColor = 'text-gray-600';
                            icon = '<i class="fas fa-exclamation-circle"></i>';
                            statusText = '미제출';
                            deleteBtn = '';
                        }
                        
                        return `
                            <div class="${bgColor} border-2 rounded-xl p-3">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-2">
                                        <span class="${textColor}">${icon}</span>
                                        <span class="font-medium ${textColor}">${student}</span>
                                    </div>
                                    <div class="flex items-center">
                                        <span class="text-xs font-bold ${textColor} px-2 py-1 rounded-lg bg-white/50">${statusText}</span>
                                        ${deleteBtn}
                                    </div>
                                </div>
                                ${detail ? `<div class="text-xs ${textColor} mt-2 pl-6">${detail}</div>` : ''}
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    }).join('');
}

function renderFemaleStatus(todaySubmissions, todayOutings) {
    // 모든 여학생 수집
    const allFemales = [];
    departments.forEach(dept => {
        students[dept].forEach(name => {
            if (name.includes('(여)')) {
                allFemales.push({ dept, name });
            }
        });
    });
    
    if (allFemales.length === 0) return '';
    
    // 여학생 상태별 분류
    const femaleStay = [];
    const femaleOut = [];
    const femaleOuting = [];
    const femaleNotSubmitted = [];
    
    allFemales.forEach(({ dept, name }) => {
        const stayRecord = todaySubmissions.find(s => s.department === dept && s.name === name && s.status === 'stay');
        const outRecord = todaySubmissions.find(s => s.department === dept && s.name === name && s.status === 'out');
        const outingRecord = todayOutings.find(o => o.department === dept && o.name === name);
        
        if (stayRecord) {
            femaleStay.push({ ...stayRecord, dept });
        } else if (outRecord) {
            femaleOut.push({ ...outRecord, dept });
        } else if (outingRecord) {
            femaleOuting.push({ ...outingRecord, dept });
        } else {
            femaleNotSubmitted.push({ dept, name });
        }
    });
    
    return `
        <div class="bg-gradient-to-br from-pink-50 to-rose-50 rounded-3xl shadow-lg p-8 mb-6 fade-in border-2 border-pink-200">
            <h2 class="text-2xl font-bold mb-6 text-pink-700"><i class="fas fa-female"></i> 여학생 현황 (전체 ${allFemales.length}명)</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 잔류 -->
                <div class="bg-white/80 rounded-2xl p-5 border-2 border-emerald-200">
                    <div class="font-bold text-emerald-700 mb-3 text-lg flex items-center gap-2">
                        <i class="fas fa-check-circle"></i> 잔류 (${femaleStay.length}명)
                    </div>
                    ${femaleStay.length > 0 ? `
                        <div class="space-y-2">
                            ${femaleStay.map(s => `
                                <div class="bg-emerald-50 px-4 py-2 rounded-lg flex items-center justify-between">
                                    <div>
                                        <span class="font-medium">${s.name}</span>
                                        <span class="text-xs text-gray-500 ml-2">[${s.dept}]</span>
                                    </div>
                                    <button onclick="deleteSubmission('${s.id}', '${s.name}')" class="text-red-600 hover:text-red-800" title="삭제">
                                        <i class="fas fa-times-circle"></i>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<div class="text-gray-400 text-center py-4">없음</div>'}
                </div>
                
                <!-- 외박 -->
                <div class="bg-white/80 rounded-2xl p-5 border-2 border-orange-200">
                    <div class="font-bold text-orange-700 mb-3 text-lg flex items-center gap-2">
                        <i class="fas fa-moon"></i> 외박 (${femaleOut.length}명)
                    </div>
                    ${femaleOut.length > 0 ? `
                        <div class="space-y-2">
                            ${femaleOut.map(s => `
                                <div class="bg-orange-50 px-4 py-2 rounded-lg flex items-center justify-between">
                                    <div>
                                        <span class="font-medium">${s.name}</span>
                                        <span class="text-xs text-gray-500 ml-2">[${s.dept}]</span>
                                    </div>
                                    <button onclick="deleteSubmission('${s.id}', '${s.name}')" class="text-red-600 hover:text-red-800" title="삭제">
                                        <i class="fas fa-times-circle"></i>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<div class="text-gray-400 text-center py-4">없음</div>'}
                </div>
                
                <!-- 외출 -->
                <div class="bg-white/80 rounded-2xl p-5 border-2 border-indigo-200">
                    <div class="font-bold text-indigo-700 mb-3 text-lg flex items-center gap-2">
                        <i class="fas fa-walking"></i> 외출 (${femaleOuting.length}명)
                    </div>
                    ${femaleOuting.length > 0 ? `
                        <div class="space-y-2">
                            ${femaleOuting.map(o => `
                                <div class="bg-indigo-50 px-4 py-2 rounded-lg">
                                    <div class="flex items-center justify-between mb-1">
                                        <div>
                                            <span class="font-medium">${o.name}</span>
                                            <span class="text-xs text-gray-500 ml-2">[${o.dept}]</span>
                                        </div>
                                        <button onclick="deleteOuting('${o.id}', '${o.name}')" class="text-red-600 hover:text-red-800" title="삭제">
                                            <i class="fas fa-times-circle"></i>
                                        </button>
                                    </div>
                                    <div class="text-xs text-gray-600">${o.outingTime} ~ ${o.returnTime} | ${o.reason}</div>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<div class="text-gray-400 text-center py-4">없음</div>'}
                </div>
                
                <!-- 미제출 -->
                <div class="bg-white/80 rounded-2xl p-5 border-2 border-red-200">
                    <div class="font-bold text-red-700 mb-3 text-lg flex items-center gap-2">
                        <i class="fas fa-exclamation-circle"></i> 미제출 (${femaleNotSubmitted.length}명)
                    </div>
                    ${femaleNotSubmitted.length > 0 ? `
                        <div class="space-y-2">
                            ${femaleNotSubmitted.map(s => `
                                <div class="bg-red-50 px-4 py-2 rounded-lg">
                                    <span class="font-medium text-red-800">${s.name}</span>
                                    <span class="text-xs text-gray-500 ml-2">[${s.dept}]</span>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<div class="text-gray-400 text-center py-4">전원 제출 완료 ✓</div>'}
                </div>
            </div>
        </div>
    `;
}

function renderResignRequests() {
    const pendingRequests = resignRequests.filter(r => r.status === 'pending');
    const approvedRequests = resignRequests.filter(r => r.status === 'approved');
    
    if (pendingRequests.length === 0 && approvedRequests.length === 0) {
        return '';
    }
    
    return `
        <div class="bg-white/80 backdrop-blur-md rounded-3xl shadow-lg p-8 fade-in border border-gray-200">
            <h2 class="text-2xl font-bold mb-6 text-gray-800"><i class="fas fa-door-open text-slate-500"></i> 퇴사 신청 관리</h2>
            
            ${pendingRequests.length > 0 ? `
                <div class="mb-6">
                    <h3 class="text-xl font-bold mb-4 text-orange-700"><i class="fas fa-clock"></i> 승인 대기 중 (${pendingRequests.length}건)</h3>
                    <div class="space-y-3">
                        ${pendingRequests.map(r => `
                            <div class="bg-orange-50 rounded-2xl p-5 border-2 border-orange-200">
                                <div class="flex items-center justify-between mb-3">
                                    <div>
                                        <span class="font-bold text-lg">${r.name}</span>
                                        <span class="text-sm text-gray-600 ml-3">[${r.department}]</span>
                                    </div>
                                    <div class="flex gap-2">
                                        <button onclick="approveResign('${r.id}', '${r.name}')" class="px-4 py-2 bg-green-500 text-white rounded-lg font-medium hover:bg-green-600 transition-all">
                                            <i class="fas fa-check"></i> 승인
                                        </button>
                                        <button onclick="rejectResign('${r.id}', '${r.name}')" class="px-4 py-2 bg-red-500 text-white rounded-lg font-medium hover:bg-red-600 transition-all">
                                            <i class="fas fa-times"></i> 거부
                                        </button>
                                    </div>
                                </div>
                                <div class="text-sm text-gray-700">
                                    <div class="mb-1"><strong>신청일:</strong> ${r.requestDate}</div>
                                    <div class="mb-1"><strong>퇴사예정일:</strong> ${r.resignDate}</div>
                                    <div><strong>사유:</strong> ${r.reason}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            ` : ''}
            
            ${approvedRequests.length > 0 ? `
                <div>
                    <h3 class="text-xl font-bold mb-4 text-gray-700"><i class="fas fa-check-circle"></i> 승인 완료 (${approvedRequests.length}명)</h3>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">
                        ${approvedRequests.map(r => `
                            <div class="bg-gray-100 rounded-xl p-4 border-2 border-gray-300">
                                <div class="font-bold text-gray-800">${r.name}</div>
                                <div class="text-sm text-gray-600 mt-1">
                                    <div>[${r.department}]</div>
                                    <div>퇴사일: ${r.resignDate}</div>
                                    <div>승인일: ${r.approvedDate || '-'}</div>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                </div>
            ` : ''}
        </div>
    `;
}

function renderNotSubmitted(todaySubmissions, todayOutings) {
    return departments.map(dept => {
        const notSubmitted = students[dept].filter(student => 
            !todaySubmissions.find(s => s.department === dept && s.name === student) &&
            !todayOutings.find(o => o.department === dept && o.name === student)
        );
        
        if (notSubmitted.length === 0) return '';
        
        return `
            <div class="bg-red-50 border-2 border-red-200 rounded-2xl p-5">
                <div class="font-bold text-red-800 mb-3">${dept} (${notSubmitted.length}명)</div>
                <div class="grid grid-cols-4 gap-2">
                    ${notSubmitted.map(s => `<div class="text-sm bg-red-100 px-3 py-2 rounded-lg font-medium text-red-700">${s}</div>`).join('')}
                </div>
            </div>
        `;
    }).join('');
}

// 학과 선택 시 학생 목록 업데이트
document.addEventListener('change', e => {
    if (e.target.id === 'deptSelect') {
        const dept = e.target.value;
        const studentSelect = document.getElementById('studentSelect');
        if (dept) {
            const studentOptions = students[dept].map(s => {
                const resigned = isResigned(dept, s);
                if (resigned) {
                    return `<option value="${s}" disabled style="color: #ccc;">${s} (퇴사)</option>`;
                } else {
                    return `<option value="${s}">${s}</option>`;
                }
            }).join('');
            studentSelect.innerHTML = '<option value="">학생 선택</option>' + studentOptions;
        } else {
            studentSelect.innerHTML = '<option value="">학생 선택</option>';
        }
    }
});

// 버튼 클릭 핸들러
function handleStayClick() {
    const dept = document.getElementById('deptSelect').value;
    const name = document.getElementById('studentSelect').value;
    if (!dept || !name) {
        alert('학과와 학생을 선택해주세요.');
        return;
    }
    if (isResigned(dept, name)) {
        alert('⚠️ 퇴사가 승인된 학생은 시스템을 이용할 수 없습니다.\n관리자에게 문의하세요.');
        return;
    }
    // 생년월일 확인
    if (!verifyBirthDate(name)) {
        return;
    }
    submitStay(dept, name);
}

function handleOutClick() {
    const dept = document.getElementById('deptSelect').value;
    const name = document.getElementById('studentSelect').value;
    if (!dept || !name) {
        alert('학과와 학생을 선택해주세요.');
        return;
    }
    if (isResigned(dept, name)) {
        alert('⚠️ 퇴사가 승인된 학생은 시스템을 이용할 수 없습니다.\n관리자에게 문의하세요.');
        return;
    }
    // 생년월일 확인
    if (!verifyBirthDate(name)) {
        return;
    }
    submitOut(dept, name);
}

// 모달 함수들
function showAdminLogin() {
    if (isAdminLoggedIn) {
        currentMode = 'admin';
        render();
        return;
    }
    
    // 모달 표시
    const modal = document.getElementById('passwordModal');
    const input = document.getElementById('adminPasswordInput');
    modal.classList.add('active');
    input.value = '';
    input.focus();
    
    // Enter 키 이벤트
    input.onkeypress = function(e) {
        if (e.key === 'Enter') {
            confirmAdminLogin();
        }
    };
}

function cancelAdminLogin() {
    const modal = document.getElementById('passwordModal');
    modal.classList.remove('active');
}

function confirmAdminLogin() {
    const input = document.getElementById('adminPasswordInput');
    const pw = input.value;
    
    if (pw === ADMIN_PASSWORD) {
        isAdminLoggedIn = true;
        currentMode = 'admin';
        cancelAdminLogin();
        alert('✓ 환영합니다!');
        render();
    } else {
        alert('× 비밀번호가 올바르지 않습니다.');
        input.value = '';
        input.focus();
    }
}

function logout() {
    isAdminLoggedIn = false;
    isLeaderLoggedIn = false;
    leaderDepartment = null;
    currentMode = 'student';
    render();
}

// 과대표 로그인 함수들
function showLeaderLogin() {
    // 관리자가 로그인한 경우 항상 학과 선택 가능 (다른 과로 변경 가능)
    if (isAdminLoggedIn) {
        showAdminAsLeaderSelection();
        return;
    }
    
    if (isLeaderLoggedIn) {
        currentMode = 'leader';
        render();
        return;
    }
    
    // 학과 선택 드롭다운 채우기 (여성재취업(바리스타)과정 제외)
    const deptSelect = document.getElementById('leaderDeptSelect');
    deptSelect.innerHTML = '<option value="">학과를 선택하세요</option>' +
        Object.keys(DEPARTMENT_LEADERS)
            .filter(dept => dept !== '여성재취업(바리스타)과정')
            .map(dept => `<option value="${dept}">${dept} (${DEPARTMENT_LEADERS[dept].name})</option>`).join('');
    
    // 모달 표시
    const modal = document.getElementById('leaderModal');
    const input = document.getElementById('leaderPasswordInput');
    modal.classList.add('active');
    input.value = '';
    
    // Enter 키 이벤트
    input.onkeypress = function(e) {
        if (e.key === 'Enter') {
            confirmLeaderLogin();
        }
    };
}

function showAdminAsLeaderSelection() {
    const depts = Object.keys(DEPARTMENT_LEADERS).filter(dept => dept !== '여성재취업(바리스타)과정');
    
    // 학과 목록 생성
    const deptListHTML = depts.map(dept => {
        const leaderInfo = DEPARTMENT_LEADERS[dept];
        const studentCount = students[dept].length;
        return `
            <button 
                onclick="selectAdminDept('${dept}')" 
                class="w-full px-6 py-4 bg-gradient-to-r from-blue-100 to-indigo-100 hover:from-blue-200 hover:to-indigo-200 text-left rounded-xl border-2 border-blue-200 hover:border-blue-400 transition-all"
            >
                <div class="font-bold text-lg text-gray-800">${dept}</div>
                <div class="text-sm text-gray-600">과대표: ${leaderInfo.name} | 학생: ${studentCount}명</div>
            </button>
        `;
    }).join('');
    
    // 모달에 학과 목록 삽입
    document.getElementById('adminDeptSelectList').innerHTML = deptListHTML;
    
    // 모달 표시
    const modal = document.getElementById('adminDeptSelectModal');
    modal.classList.add('active');
}

function selectAdminDept(dept) {
    isLeaderLoggedIn = true;
    leaderDepartment = dept;
    currentMode = 'leader';
    cancelAdminDeptSelect();
    alert(`✓ ${dept} 과대표로 전환되었습니다.`);
    render();
}

function cancelAdminDeptSelect() {
    const modal = document.getElementById('adminDeptSelectModal');
    modal.classList.remove('active');
}

function cancelLeaderLogin() {
    const modal = document.getElementById('leaderModal');
    modal.classList.remove('active');
}

function confirmLeaderLogin() {
    const deptSelect = document.getElementById('leaderDeptSelect');
    const dept = deptSelect.value;
    const input = document.getElementById('leaderPasswordInput');
    const pw = input.value;
    
    if (!dept) {

    const leaderInfo = DEPARTMENT_LEADERS[dept];

        input.value = '';
        input.focus();
    }
}

        outBtn.className += ' bg-gradient-to-br from-orange-200 to-amber-200 text-orange-800 border-3 border-orange-400 shadow-xl ring-2 ring-orange-300 active-mode-btn';
        outBtn.innerHTML = '<i class="fas fa-bed text-2xl mb-1"></i><div class="text-lg font-bold">외박 선택됨</div>';

// 일괄 제출 확인
async function confirmBatchSubmit() {
    if (!quickSubmitMode) {
        alert('⚠️ 먼저 잔류 또는 외박을 선택하세요!');
        return;
    }
    
    const checkboxes = document.querySelectorAll('.leader-student-check');
    const allStudents = Array.from(checkboxes).map(cb => cb.value);
    const checkedStudents = Array.from(checkboxes).filter(cb => cb.checked).map(cb => cb.value);
    const uncheckedStudents = allStudents.filter(s => !checkedStudents.includes(s));
    
    if (allStudents.length === 0) {
        alert('⚠️ 미제출 학생이 없습니다.');
        return;
    }
    
    const checkedStatus = quickSubmitMode; // 'stay' 또는 'out'
    const uncheckedStatus = quickSubmitMode === 'stay' ? 'out' : 'stay';
    
    const checkedText = checkedStatus === 'stay' ? '잔류' : '외박';
    const uncheckedText = uncheckedStatus === 'stay' ? '잔류' : '외박';
    
    const confirmMsg = `다음과 같이 일괄 제출하시겠습니까?\n\n` +
        `✅ 체크한 학생 ${checkedStudents.length}명 → ${checkedText}\n` +
        `${checkedStudents.length > 0 ? checkedStudents.slice(0, 5).join(', ') + (checkedStudents.length > 5 ? ' 외 ' + (checkedStudents.length - 5) + '명' : '') : '없음'}\n\n` +
        `⬜ 나머지 학생 ${uncheckedStudents.length}명 → ${uncheckedText}\n` +
        `${uncheckedStudents.length > 0 ? uncheckedStudents.slice(0, 5).join(', ') + (uncheckedStudents.length > 5 ? ' 외 ' + (uncheckedStudents.length - 5) + '명' : '') : '없음'}`;
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    try {
        let successCount = 0;
        const submitDate = getCurrentDate();
        
        // 체크된 학생들 저장
        for (const name of checkedStudents) {
            const docId = `${submitDate}_${leaderDepartment}_${name}`;
            await db.collection('submissions').doc(docId).set({
                department: leaderDepartment,
                name: name,
                status: checkedStatus,
                date: submitDate,
                timestamp: new Date().toLocaleTimeString('ko-KR')
            });
            successCount++;
        }
        
        // 체크 안 된 학생들 저장
        for (const name of uncheckedStudents) {
            const docId = `${submitDate}_${leaderDepartment}_${name}`;
            await db.collection('submissions').doc(docId).set({
                department: leaderDepartment,
                name: name,
                status: uncheckedStatus,
                date: submitDate,
                timestamp: new Date().toLocaleTimeString('ko-KR')
            });
            successCount++;
        }
        
        alert(`✅ 일괄 제출 완료!\n\n총 ${successCount}명 처리\n${checkedText}: ${checkedStudents.length}명\n${uncheckedText}: ${uncheckedStudents.length}명`);
        
        // 초기화 및 재렌더링
        quickSubmitMode = null;
        render();
        
    } catch (error) {
        alert('❌ 저장 실패: ' + error.message);
    }
}

async function saveBatchSubmission() {
    const submitDate = document.getElementById('batchDateSelect').value;
    const checkboxes = document.querySelectorAll('.batch-student-check');
    const deptStudents = students[leaderDepartment];
    
    // 체크된 학생 목록
    const checkedStudents = Array.from(checkboxes)
        .filter(cb => cb.checked)
        .map(cb => cb.value);
    
    // 체크 안 된 학생 목록
    const uncheckedStudents = deptStudents.filter(s => !checkedStudents.includes(s));
    
    if (checkedStudents.length === 0 && uncheckedStudents.length === 0) {
        alert('학생이 없습니다.');
        return;
    }
    
    const checkedStatus = batchMode; // 'stay' 또는 'out'
    const uncheckedStatus = batchMode === 'stay' ? 'out' : 'stay';
    
    const checkedText = checkedStatus === 'stay' ? '잔류' : '외박';
    const uncheckedText = uncheckedStatus === 'stay' ? '잔류' : '외박';
    
    const confirmMsg = `다음과 같이 저장하시겠습니까?\n\n` +
        `✓ 체크한 학생 ${checkedStudents.length}명 → ${checkedText}\n` +
        `✓ 나머지 학생 ${uncheckedStudents.length}명 → ${uncheckedText}\n\n` +
        `날짜: ${submitDate}`;
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    try {
        // 체크된 학생들 저장
        for (const name of checkedStudents) {
            const docId = `${submitDate}_${leaderDepartment}_${name}`;
            await db.collection('submissions').doc(docId).set({
                department: leaderDepartment,
                name: name,
                status: checkedStatus,
                date: submitDate,
                timestamp: new Date().toLocaleTimeString('ko-KR')
            });
        }
        
        // 체크 안 된 학생들 저장
        for (const name of uncheckedStudents) {
            const docId = `${submitDate}_${leaderDepartment}_${name}`;
            await db.collection('submissions').doc(docId).set({
                department: leaderDepartment,
                name: name,
                status: uncheckedStatus,
                date: submitDate,
                timestamp: new Date().toLocaleTimeString('ko-KR')
            });

        alert(`✓ 일괄 저장 완료!\n\n${checkedText} ${checkedStudents.length}명\n${uncheckedText} ${uncheckedStudents.length}명`);

    }
}

// 엑셀 다운로드 함수
function downloadExcel() {
    // 선택된 날짜의 데이터 필터링
    const selectedSubmissions = submissions.filter(s => s.date === currentDate);
    const selectedOutings = outings.filter(o => o.date === currentDate);
    
    // CSV 헤더
    let csv = '\uFEFF날짜,학과,이름,구분,상세정보,제출시간\n';
    
    // 잔류 데이터
    selectedSubmissions.filter(s => s.status === 'stay').forEach(s => {
        csv += `${s.date},${s.department},${s.name},잔류,-,${s.timestamp}\n`;
    });
    
    // 외박 데이터
    selectedSubmissions.filter(s => s.status === 'out').forEach(s => {
        csv += `${s.date},${s.department},${s.name},외박,-,${s.timestamp}\n`;
    });
    
    // 외출 데이터
    selectedOutings.forEach(o => {
        csv += `${o.date},${o.department},${o.name},외출,"${o.outingTime}~${o.returnTime} (${o.reason})",${o.timestamp}\n`;
    });
    
    // 미제출 데이터
    departments.forEach(dept => {
        const notSubmitted = students[dept].filter(student => 
            !selectedSubmissions.find(s => s.department === dept && s.name === student) &&
            !selectedOutings.find(o => o.department === dept && o.name === student)
        );
        notSubmitted.forEach(name => {
            csv += `${currentDate},${dept},${name},미제출,-,-\n`;
        });
    });
    
    // 다운로드
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', `기숙사관리_${currentDate}.csv`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    alert(`✓ ${currentDate} 데이터 다운로드 완료!\n파일을 엑셀에서 열어보세요.`);
}

function downloadAllData() {
    // CSV 헤더
    let csv = '\uFEFF날짜,학과,이름,구분,상세정보,제출시간\n';
    
    // 모든 잔류/외박 데이터
    submissions.forEach(s => {
        const status = s.status === 'stay' ? '잔류' : '외박';
        csv += `${s.date},${s.department},${s.name},${status},-,${s.timestamp}\n`;
    });
    
    // 모든 외출 데이터
    outings.forEach(o => {
        csv += `${o.date},${o.department},${o.name},외출,"${o.outingTime}~${o.returnTime} (${o.reason})",${o.timestamp}\n`;
    });
    
    // 모든 퇴사 신청 데이터
    resignRequests.forEach(r => {
        const status = r.status === 'pending' ? '퇴사신청(대기)' : '퇴사신청(승인)';
        csv += `${r.requestDate},${r.department},${r.name},${status},"퇴사예정일: ${r.resignDate} (${r.reason})",-\n`;
    });
    
    // 다운로드
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', `기숙사관리_전체데이터_${new Date().toISOString().split('T')[0]}.csv`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    alert('✓ 전체 데이터 다운로드 완료!\n파일을 엑셀에서 열어보세요.');
}

// 미제출자 카카오톡 메시지 복사
function copyNotificationMessage() {
    const todaySubmissions = submissions.filter(s => s.date === currentDate);
    const todayOutings = outings.filter(o => o.date === currentDate);
    
    let message = `[기숙사 잔류/외박 신청 안내]\n\n`;
    message += `📅 날짜: ${currentDate}\n\n`;
    message += `아래 학생분들은 아직 잔류/외박 신청을 하지 않았습니다.\n`;
    message += `빠른 시일 내에 신청 부탁드립니다.\n\n`;
    message += `━━━━━━━━━━━━━━━━\n\n`;
    
    let hasNotSubmitted = false;
    departments.forEach(dept => {
        const notSubmitted = students[dept].filter(student => 
            !todaySubmissions.find(s => s.department === dept && s.name === student) &&
            !todayOutings.find(o => o.department === dept && o.name === student)
        );
        
        if (notSubmitted.length > 0) {
            hasNotSubmitted = true;
            message += `【${dept}】\n`;
            notSubmitted.forEach(name => {
                message += `  • ${name}\n`;
            });
            message += `\n`;
        }
    });
    
    if (!hasNotSubmitted) {
        alert('✓ 모든 학생이 신청을 완료했습니다!');
        return;
    }
    
    message += `━━━━━━━━━━━━━━━━\n`;
    message += `신청 방법: 기숙사 관리 시스템 접속 후 신청`;
    
    // 클립보드에 복사
    navigator.clipboard.writeText(message).then(() => {
        alert('✓ 카카오톡 메시지가 클립보드에 복사되었습니다!');
        
        // 미리보기 표시
        const preview = document.getElementById('notification-preview');
        preview.textContent = message;
        preview.classList.remove('hidden');
    }).catch(err => {
        alert('× 복사 실패: ' + err);
    });
}

// 미제출자 명단 복사
function copyPhoneNumbers() {
    const todaySubmissions = submissions.filter(s => s.date === currentDate);
    const todayOutings = outings.filter(o => o.date === currentDate);
    
    let list = `[${currentDate} 미제출자 명단]\n\n`;
    
    let hasNotSubmitted = false;
    let totalCount = 0;
    
    departments.forEach(dept => {
        const notSubmitted = students[dept].filter(student => 
            !todaySubmissions.find(s => s.department === dept && s.name === student) &&
            !todayOutings.find(o => o.department === dept && o.name === student)
        );
        
        if (notSubmitted.length > 0) {
            hasNotSubmitted = true;
            totalCount += notSubmitted.length;
            list += `【${dept}】 ${notSubmitted.length}명\n`;
            notSubmitted.forEach(name => {
                list += `${name}\n`;
            });
            list += `\n`;
        }
    });
    
    if (!hasNotSubmitted) {
        alert('✓ 모든 학생이 신청을 완료했습니다!');
        return;
    }
    
    list = `[${currentDate} 미제출자 명단] 총 ${totalCount}명\n\n` + list;
    
    // 클립보드에 복사
    navigator.clipboard.writeText(list).then(() => {
        alert('✓ 미제출자 명단이 클립보드에 복사되었습니다!');
        
        // 미리보기 표시
        const preview = document.getElementById('notification-preview');
        preview.textContent = list;
        preview.classList.remove('hidden');
    }).catch(err => {
        alert('× 복사 실패: ' + err);
    });
}
