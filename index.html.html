    setTimeout(() => {
        if (window.notSubmittedStudents && currentMode === 'admin') {
            window.notSubmittedStudents.forEach(student => {

                if (element) {
                    element.addEventListener('click', function(e) {

            });
        }
    }, 100);

            to { opacity: 1; transform: translateY(0); }

        .fade-in { animation: fadeIn 0.3s ease-out; }

            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            font-size: 24px;
        }
        
        /* 커스텀 셀렉트 박스 스타일 */
        .custom-select {
            position: relative;
        }
        .custom-select select {
            appearance: none;
            -webkit-appearance: none;
            -moz-appearance: none;
            padding-right: 3rem;
        }

            content: '\f107';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 1.5rem;
            top: 50%;
            transform: translateY(-50%);

            color: #6366f1;
            font-size: 1.25rem;

            padding-right: 3rem;

            color: #6366f1;
            font-size: 1.25rem;

        @keyframes activeButton {
            0%, 100% { transform: scale(1.05); box-shadow: 0 4px 20px rgba(0,0,0,0.15); }

        .active-mode-btn {
            animation: activeButton 2s ease-in-out infinite;
        }

            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .animate-bounce {
            animation: bounce 1.5s ease-in-out infinite;
        }

            display: none;

            top: 0;
            left: 0;

// 공휴일 체크 함수
function isHoliday(dateStr) {
    return HOLIDAYS.includes(dateStr);
}

// 신청 가능한 날짜 계산
function getAvailableDates() {
    // 실시간 현재 날짜 가져오기
    const now = new Date();
    const year = now.getFullYear();
    const month = now.getMonth();
    const date = now.getDate();
    
    const today = new Date(year, month, date); // 시간 정보 제거
    const dayOfWeek = today.getDay(); // 0(일) ~ 6(토)
    const availableDates = [];
    const addedDates = new Set(); // 중복 방지
    
    // 오늘 날짜 추가
    const todayStr = getCurrentDate(); // 실시간 날짜 함수 사용
    availableDates.push({
        date: todayStr,
        label: getDateLabel(todayStr)
    });
    addedDates.add(todayStr);
    
    // 연속된 휴일(주말+공휴일) 찾기
    let checkDate = new Date(year, month, date);
    checkDate.setDate(checkDate.getDate() + 1);
    let consecutiveDays = 0;
    
    // 최대 7일까지 체크 (연휴 고려)
    for (let i = 1; i <= 7; i++) {
        const checkYear = checkDate.getFullYear();
        const checkMonth = String(checkDate.getMonth() + 1).padStart(2, '0');
        const checkDay = String(checkDate.getDate()).padStart(2, '0');
        const checkDateStr = `${checkYear}-${checkMonth}-${checkDay}`;
        const checkDayOfWeek = checkDate.getDay();
        
        // 주말이거나 공휴일인 경우
        const isWeekend = checkDayOfWeek === 0 || checkDayOfWeek === 6;
        const isHolidayDay = isHoliday(checkDateStr);
        
        if (isWeekend || isHolidayDay) {
            // 연속된 휴일
            if (!addedDates.has(checkDateStr)) {
                availableDates.push({
                    date: checkDateStr,
                    label: getDateLabel(checkDateStr)
                });
                addedDates.add(checkDateStr);
            }
            consecutiveDays++;
        } else {
            // 평일을 만나면 중단
            break;
        }
        
        checkDate.setDate(checkDate.getDate() + 1);
    }
    
    // 금요일인 경우 무조건 토요일, 일요일 추가 (위에서 추가 안 된 경우)
    if (dayOfWeek === 5) {
        const saturday = new Date(year, month, date);
        saturday.setDate(saturday.getDate() + 1);
        const satYear = saturday.getFullYear();
        const satMonth = String(saturday.getMonth() + 1).padStart(2, '0');
        const satDay = String(saturday.getDate()).padStart(2, '0');
        const saturdayStr = `${satYear}-${satMonth}-${satDay}`;
        
        if (!addedDates.has(saturdayStr)) {
            availableDates.push({
                date: saturdayStr,
                label: getDateLabel(saturdayStr)
            });
            addedDates.add(saturdayStr);
        }
        
        const sunday = new Date(year, month, date);
        sunday.setDate(sunday.getDate() + 2);
        const sunYear = sunday.getFullYear();
        const sunMonth = String(sunday.getMonth() + 1).padStart(2, '0');
        const sunDay = String(sunday.getDate()).padStart(2, '0');
        const sundayStr = `${sunYear}-${sunMonth}-${sunDay}`;
        
        if (!addedDates.has(sundayStr)) {
            availableDates.push({
                date: sundayStr,
                label: getDateLabel(sundayStr)
            });
            addedDates.add(sundayStr);
        }
    }
    
    return availableDates;
}

// 날짜 라벨 생성 (월/일)
function getDateLabel(dateStr) {
    const [year, month, day] = dateStr.split('-');
    const date = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
    const weekdays = ['일요일', '월요일', '화요일', '수요일', '목요일', '금요일', '토요일'];
    const weekday = weekdays[date.getDay()];
    return `${parseInt(month)}월${parseInt(day)}일 ${weekday}`;
}

// 날짜 변경 함수 (관리자용)
function changeDate(days) {
    const [year, month, day] = currentDate.split('-');
    const date = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
    date.setDate(date.getDate() + days);
    
    const newYear = date.getFullYear();
    const newMonth = String(date.getMonth() + 1).padStart(2, '0');
    const newDay = String(date.getDate()).padStart(2, '0');
    currentDate = `${newYear}-${newMonth}-${newDay}`;
    
    console.log('날짜 변경:', days > 0 ? `+${days}일` : `${days}일`, '-> ', currentDate);
    render();
}

            approvedDate: approvedDate
        });
        
        // 2. 승인일 이후의 제출 기록만 삭제 (submissions)
        const studentSubmissions = await db.collection('submissions')
            .where('department', '==', dept)
            .where('name', '==', name)
            .get();
        
        let deletedSubmissions = 0;
        for (const doc of studentSubmissions.docs) {
            const data = doc.data();
            // 승인일 이후의 데이터만 삭제
            if (data.date >= approvedDate) {
                await doc.ref.delete();
                deletedSubmissions++;
            }
        }
        
        // 3. 승인일 이후의 외출 기록만 삭제 (outings)
        const studentOutings = await db.collection('outings')
            .where('department', '==', dept)
            .where('name', '==', name)
            .get();
        
        let deletedOutings = 0;
        for (const doc of studentOutings.docs) {
            const data = doc.data();
            // 승인일 이후의 데이터만 삭제
            if (data.date >= approvedDate) {
                await doc.ref.delete();
                deletedOutings++;
            }
        }
        
        alert(`✓ ${name} 교육생의 퇴사가 승인되었습니다.\n\n- ${dept}에서 제외되었습니다\n- ${approvedDate} 이후 제출 기록 ${deletedSubmissions}건 삭제\n- ${approvedDate} 이후 외출 기록 ${deletedOutings}건 삭제\n- 이전 데이터는 보존되었습니다`);
        
        // students 목록 업데이트는 onSnapshot에서 자동으로 처리됨
    } catch (error) {
        alert('× 승인 실패: ' + error.message);
    }
}

// 생년월일 검증 함수
function verifyBirthDate(name) {
    const birthDate = studentPasswords[name];
    
    // 생년월일 정보가 없는 경우 (000000)
    if (!birthDate || birthDate === '000000') {
        const proceed = confirm(`${name} 교육생의 생년월일 정보가 등록되어 있지 않습니다.\n\n생년월일 확인 없이 진행하시겠습니까?\n(보안을 위해 관리자에게 생년월일 등록을 요청하세요)`);
        return proceed;
    }
    
    const input = prompt(`본인 확인을 위해 생년월일 6자리를 입력하세요.\n(예: 990312 = 1999년 3월 12일)`);
    
    // 취소 버튼을 누르거나 빈 값을 입력한 경우
    if (input === null) {
        alert('❌ 생년월일 입력이 취소되었습니다.');
        return false;
    }
    
    if (input.trim() === '') {
        alert('❌ 생년월일을 입력해주세요.');
        return false;
    }
    
    if (input === birthDate) {
        return true;
    } else {
        alert('❌ 생년월일이 일치하지 않습니다.\n본인이 아닌 경우 다른 사람의 정보를 제출할 수 없습니다.');
        return false;
    }
}

// 통계 계산
function getStats() {
    const todaySubmissions = submissions.filter(s => s.date === currentDate);
    const todayOutings = outings.filter(o => o.date === currentDate);
    
    // 잔류/외박 신청한 학생들의 학과-이름 목록 (우선순위가 높음)
    const submissionStudentKeys = todaySubmissions.map(s => `${s.department}_${s.name}`);
    
    // 잔류/외박 카운트 (그대로)
    const stayCount = todaySubmissions.filter(s => s.status === 'stay').length;
    const outCount = todaySubmissions.filter(s => s.status === 'out').length;
    
    // 외출 카운트 - 잔류/외박이 있는 학생은 외출에서 제외
    const outingCount = todayOutings.filter(o => 
        !submissionStudentKeys.includes(`${o.department}_${o.name}`)
    ).length;
    
    const totalStudents = Object.values(students).flat().length;
    
    return {
        totalStudents,
        stayCount,
        outCount,
        outingCount,
        notSubmitted: totalStudents - stayCount - outCount - outingCount
    };
}

// 날짜 버튼 레이블 생성 함수
function getDateButtonLabel(days) {
    const [year, month, day] = currentDate.split('-');
    const date = new Date(parseInt(year), parseInt(month) - 1, parseInt(day));
    date.setDate(date.getDate() + days);
    
    const targetMonth = date.getMonth() + 1;
    const targetDay = date.getDate();
    const weekdays = ['일', '월', '화', '수', '목', '금', '토'];
    const weekday = weekdays[date.getDay()];
    
    // 날짜와 요일 표시
    return `${targetMonth}월${targetDay}일(${weekday})`;
}

                    const replacedOutings = allDeptOutings.filter(o => submissionStudentNames.includes(o.name));
                    if (replacedOutings.length > 0) {

                                <div class="bg-gray-50 rounded-xl p-3 space-y-2 border border-gray-300">

                                            s.department === leaderDepartment && s.name === o.name
                                        );
                                        const statusText = submission.status === 'stay' ? '잔류' : '외박';

                    return '';
                })()}

                ` : '<div class="text-center text-teal-600 font-bold text-lg py-4"><i class="fas fa-check-circle"></i> 전원 제출 완료!</div>'}

        </div>
    `;
}

function renderDepartmentStatus(todaySubmissions, todayOutings) {
    return departments.map(dept => {
        const deptStudents = students[dept];
        
        // 학생별 상태 계산 (잔류/외박이 우선순위, 외출은 보조)
        const studentStatus = deptStudents.map(student => {
            const stayRecord = todaySubmissions.find(s => s.status === 'stay' && s.department === dept && s.name === student);
            const outRecord = todaySubmissions.find(s => s.status === 'out' && s.department === dept && s.name === student);
            const outingRecord = todayOutings.find(o => o.department === dept && o.name === student);
            
            let status = 'none';
            let detail = null;
            let id = null;
            
            // 잔류/외박이 최우선 순위
            if (stayRecord) {
                status = 'stay';
                id = stayRecord.id;
            } else if (outRecord) {
                status = 'out';
                id = outRecord.id;
            } else if (outingRecord) {
                status = 'outing';
                detail = `${outingRecord.outingTime}~${outingRecord.returnTime} (${outingRecord.reason})`;
                id = outingRecord.id;
            }
            
            return { student, status, detail, id, outingRecord };
        });
        
        const stayCount = studentStatus.filter(s => s.status === 'stay').length;
        const outCount = studentStatus.filter(s => s.status === 'out').length;
        const outingCount = studentStatus.filter(s => s.status === 'outing').length;
        const noneCount = studentStatus.filter(s => s.status === 'none').length;
        
        return `
            <div class="bg-gray-50 rounded-2xl p-6 border border-gray-200 hover:shadow-md transition-all">
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-2xl font-bold text-gray-800">${dept}</h3>
                    <div class="text-sm font-medium text-gray-600">
                        전체 ${deptStudents.length}명 | 
                        <span class="text-teal-700">잔류 ${stayCount}</span> | 
                        <span class="text-amber-700">외박 ${outCount}</span> | 
                        <span class="text-sky-700">외출 ${outingCount}</span> | 
                        <span class="text-rose-700">미제출 ${noneCount}</span>
                    </div>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                    ${studentStatus.map(({ student, status, detail, id, outingRecord }) => {
                        let bgColor, textColor, icon, statusText, deleteBtn;
                        let outingInfo = '';
                        
                        if (status === 'stay') {
                            bgColor = 'bg-emerald-100 border-emerald-300';
                            textColor = 'text-emerald-800';
                            icon = '<i class="fas fa-check-circle"></i>';
                            statusText = '잔류';
                            deleteBtn = `<button onclick="deleteSubmission('${id}', '${student}')" class="ml-2 text-red-600 hover:text-red-800" title="삭제"><i class="fas fa-times-circle"></i></button>`;
                            // 외출 신청 내역이 있으면 표시
                            if (outingRecord) {
                                outingInfo = `<div class="text-xs text-gray-600 mt-2 pl-6 line-through">외출신청: ${outingRecord.outingTime}~${outingRecord.returnTime} (${outingRecord.reason})</div>`;
                            }
                        } else if (status === 'out') {
                            bgColor = 'bg-orange-100 border-orange-300';
                            textColor = 'text-orange-800';
                            icon = '<i class="fas fa-moon"></i>';
                            statusText = '외박';
                            deleteBtn = `<button onclick="deleteSubmission('${id}', '${student}')" class="ml-2 text-red-600 hover:text-red-800" title="삭제"><i class="fas fa-times-circle"></i></button>`;
                            // 외출 신청 내역이 있으면 표시
                            if (outingRecord) {
                                outingInfo = `<div class="text-xs text-gray-600 mt-2 pl-6 line-through">외출신청: ${outingRecord.outingTime}~${outingRecord.returnTime} (${outingRecord.reason})</div>`;
                            }
                        } else if (status === 'outing') {
                            bgColor = 'bg-indigo-100 border-indigo-300';
                            textColor = 'text-indigo-800';
                            icon = '<i class="fas fa-walking"></i>';
                            statusText = '외출';
                            deleteBtn = `<button onclick="deleteOuting('${id}', '${student}')" class="ml-2 text-red-600 hover:text-red-800" title="삭제"><i class="fas fa-times-circle"></i></button>`;
                        } else {
                            bgColor = 'bg-gray-100 border-gray-300';
                            textColor = 'text-gray-600';
                            icon = '<i class="fas fa-exclamation-circle"></i>';
                            statusText = '미제출';
                            deleteBtn = '';
                        }
                        
                        return `
                            <div class="${bgColor} border-2 rounded-xl p-3">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center gap-2">
                                        <span class="${textColor}">${icon}</span>
                                        <span class="font-medium ${textColor}">${formatStudentName(student)}</span>
                                    </div>
                                    <div class="flex items-center">
                                        <span class="text-sm font-bold ${textColor} px-2 py-1 rounded-lg bg-white/50">${statusText}</span>
                                        ${deleteBtn}
                                    </div>
                                </div>
                                ${detail ? `<div class="text-xs ${textColor} mt-2 pl-6">${detail}</div>` : ''}
                                ${outingInfo}
                            </div>
                        `;
                    }).join('')}
                </div>
            </div>
        `;
    }).join('');
}

function renderFemaleStatus(todaySubmissions, todayOutings) {
    // 모든 여자교육생 수집
    const allFemales = [];
    departments.forEach(dept => {
        students[dept].forEach(name => {
            if (name.includes('(여)')) {
                allFemales.push({ dept, name });
            }
        });
    });
    
    if (allFemales.length === 0) return '';
    
    // 여자교육생 상태별 분류
    const femaleStay = [];
    const femaleOut = [];
    const femaleOuting = [];
    const femaleNotSubmitted = [];
    
    allFemales.forEach(({ dept, name }) => {
        const stayRecord = todaySubmissions.find(s => s.department === dept && s.name === name && s.status === 'stay');
        const outRecord = todaySubmissions.find(s => s.department === dept && s.name === name && s.status === 'out');
        const outingRecord = todayOutings.find(o => o.department === dept && o.name === name);
        
        // 잔류/외박이 최우선 순위
        if (stayRecord) {
            femaleStay.push({ ...stayRecord, dept });
        } else if (outRecord) {
            femaleOut.push({ ...outRecord, dept });
        } else if (outingRecord) {
            femaleOuting.push({ ...outingRecord, dept });
        } else {
            femaleNotSubmitted.push({ dept, name });
        }
    });
    
    // 호실 순으로 정렬하는 함수
    const sortByRoomNumber = (a, b) => {
        const roomA = studentRoomNumbers[a.name];
        const roomB = studentRoomNumbers[b.name];
        
        if (!roomA && !roomB) return 0;
        if (!roomA) return 1;
        if (!roomB) return -1;
        
        return parseInt(roomA) - parseInt(roomB);
    };
    
    // 각 섹션을 호실 순으로 정렬
    femaleStay.sort(sortByRoomNumber);
    femaleOut.sort(sortByRoomNumber);
    femaleOuting.sort(sortByRoomNumber);
    femaleNotSubmitted.sort(sortByRoomNumber);
    return `
        <div class="bg-gradient-to-br from-pink-50 to-rose-50 rounded-3xl shadow-lg p-8 mb-6 fade-in border-2 border-pink-200">
            <h2 class="text-2xl font-bold mb-6 text-pink-700"><i class="fas fa-female"></i> 여자교육생 현황 (전체 ${allFemales.length}명)</h2>
            
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <!-- 잔류 -->
                <div class="bg-white/80 rounded-2xl p-5 border-2 border-emerald-200">
                    <div class="font-bold text-emerald-700 mb-3 text-lg flex items-center gap-2">
                        <i class="fas fa-check-circle"></i> 잔류 (${femaleStay.length}명)
                    </div>
                    ${femaleStay.length > 0 ? `
                        <div class="space-y-2">
                            ${femaleStay.map(s => `
                                <div class="bg-emerald-50 px-4 py-2 rounded-lg flex items-center justify-between">
                                    <div>
                                        <span class="font-medium">${formatStudentName(s.name)}</span>
                                        <span class="text-sm text-gray-600 ml-2">[${s.dept}]</span>
                                    </div>
                                    <button onclick="deleteSubmission('${s.id}', '${s.name}')" class="text-red-600 hover:text-red-800" title="삭제">
                                        <i class="fas fa-times-circle"></i>
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    ` : '<div class="text-gray-400 text-center py-4">없음</div>'}
                </div>
                
                <!-- 외박 -->
                <div class="bg-white/80 rounded-2xl p-5 border-2 border-orange-200">
                    <div class="font-bold text-orange-700 mb-3 text-lg flex items-center gap-2">
                        <i class="fas fa-moon"></i> 외박 (${femaleOut.length}명)
                    </div>

function renderNotSubmitted(todaySubmissions, todayOutings) {
    return departments.map(dept => {
        const notSubmitted = students[dept].filter(student => 
            !todaySubmissions.find(s => s.department === dept && s.name === student) &&
            !todayOutings.find(o => o.department === dept && o.name === student)
        );
        
        if (notSubmitted.length === 0) return '';
        
        return `
            <div class="bg-red-50 border-2 border-red-200 rounded-2xl p-5">
                <div class="font-bold text-red-800 mb-3 text-base">${dept} (${notSubmitted.length}명)</div>
                <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-2">
                    ${notSubmitted.map(s => `<div class="text-base bg-red-100 px-3 py-2 rounded-lg font-medium text-red-700">${s}</div>`).join('')}
                </div>
            </div>
        `;
    }).join('');
}

// 학과 선택 시 학생 목록 업데이트
document.addEventListener('change', e => {
    if (e.target.id === 'deptSelect') {
        const dept = e.target.value;
        const studentSelect = document.getElementById('studentSelect');
        if (dept) {
            const studentOptions = students[dept].map(s => {
                const resigned = isResigned(dept, s);
                if (resigned) {
                    return `<option value="${s}" disabled style="color: #ccc;">${formatStudentName(s)} (퇴사)</option>`;
                } else {
                    return `<option value="${s}">${formatStudentName(s)}</option>`;
                }
            }).join('');
            studentSelect.innerHTML = '<option value="">교육생 선택</option>' + studentOptions;
        } else {
            studentSelect.innerHTML = '<option value="">교육생 선택</option>';
        }
    }
});

// 버튼 클릭 핸들러
function handleStayClick() {
    const dept = document.getElementById('deptSelect').value;
    const name = document.getElementById('studentSelect').value;
    if (!dept || !name) {
        alert('학과와 교육생을 선택해주세요.');
        return;
    }
    if (isResigned(dept, name)) {
        alert('⚠️ 퇴사가 승인된 학생은 시스템을 이용할 수 없습니다.\n관리자에게 문의하세요.');
        return;
    }
    // 생년월일 확인
    if (!verifyBirthDate(name)) {
        return;
    }
    submitStay(dept, name);
}

function handleOutClick() {
    const dept = document.getElementById('deptSelect').value;
    const name = document.getElementById('studentSelect').value;
    if (!dept || !name) {
        alert('학과와 교육생을 선택해주세요.');
        return;
    }
    if (isResigned(dept, name)) {
        alert('⚠️ 퇴사가 승인된 학생은 시스템을 이용할 수 없습니다.\n관리자에게 문의하세요.');
        return;
    }
    // 생년월일 확인
    if (!verifyBirthDate(name)) {
        return;
    }
    submitOut(dept, name);
}

// 모달 함수들
function showAdminLogin() {
    if (isAdminLoggedIn) {
        currentMode = 'admin';
        render();
        return;
    }
    
    // 모달 표시
    const modal = document.getElementById('passwordModal');
    const input = document.getElementById('adminPasswordInput');
    modal.classList.add('active');
    input.value = '';
    input.focus();
    
    // Enter 키 이벤트
    input.onkeypress = function(e) {
        if (e.key === 'Enter') {
            confirmAdminLogin();
        }
    };
}

function cancelAdminLogin() {
    const modal = document.getElementById('passwordModal');
    modal.classList.remove('active');
}

function confirmAdminLogin() {
    const input = document.getElementById('adminPasswordInput');
    const pw = input.value;
    
    if (pw === ADMIN_PASSWORD) {
        isAdminLoggedIn = true;
        currentMode = 'admin';
        cancelAdminLogin();
        alert('✓ 환영합니다!');
        render();
    } else {
        alert('× 비밀번호가 올바르지 않습니다.');
        input.value = '';
        input.focus();
    }
}

function logout() {
    isAdminLoggedIn = false;
    isLeaderLoggedIn = false;
    leaderDepartment = null;
    currentMode = 'student';
    render();
}

// 학과대표 로그인 함수들
function showLeaderLogin() {
    // 관리자가 로그인한 경우 항상 학과 선택 가능 (다른 과로 변경 가능)
    if (isAdminLoggedIn) {
        showAdminAsLeaderSelection();
        return;
    }
    
    if (isLeaderLoggedIn) {
        currentMode = 'leader';
        render();
        return;
    }
    
    // 학과 선택 드롭다운 채우기 (여성재취업(바리스타)과정 제외)
    const deptSelect = document.getElementById('leaderDeptSelect');
    deptSelect.innerHTML = '<option value="">학과를 선택하세요</option>' +
        Object.keys(DEPARTMENT_LEADERS)
            .filter(dept => dept !== '여성재취업(바리스타)과정')
            .map(dept => `<option value="${dept}">${dept} (${DEPARTMENT_LEADERS[dept].name})</option>`).join('');
    
    // 모달 표시
    const modal = document.getElementById('leaderModal');
    const input = document.getElementById('leaderPasswordInput');
    modal.classList.add('active');
    input.value = '';
    
    // Enter 키 이벤트
    input.onkeypress = function(e) {
        if (e.key === 'Enter') {
            confirmLeaderLogin();
        }
    };
}

function showAdminAsLeaderSelection() {
    const depts = Object.keys(DEPARTMENT_LEADERS).filter(dept => dept !== '여성재취업(바리스타)과정');
    
    // 학과 목록 생성
    const deptListHTML = depts.map(dept => {
        const leaderInfo = DEPARTMENT_LEADERS[dept];
        const studentCount = students[dept].length;
        return `
            <button 
                onclick="selectAdminDept('${dept}')" 
                class="w-full px-6 py-4 bg-gradient-to-r from-blue-100 to-indigo-100 hover:from-blue-200 hover:to-indigo-200 text-left rounded-xl border-2 border-blue-200 hover:border-blue-400 transition-all"
            >
                <div class="font-bold text-lg text-gray-800">${dept}</div>
                <div class="text-sm text-gray-600">학과대표: ${leaderInfo.name} | 학생: ${studentCount}명</div>
            </button>
        `;
    }).join('');
    
    // 모달에 학과 목록 삽입
    document.getElementById('adminDeptSelectList').innerHTML = deptListHTML;
    
    // 모달 표시
    const modal = document.getElementById('adminDeptSelectModal');
    modal.classList.add('active');
}

function selectAdminDept(dept) {
    isLeaderLoggedIn = true;
    leaderDepartment = dept;
    currentMode = 'leader';
    cancelAdminDeptSelect();
    alert(`✓ ${dept} 학과대표로 전환되었습니다.`);

}

function cancelAdminDeptSelect() {
    const modal = document.getElementById('adminDeptSelectModal');
    modal.classList.remove('active');
}

function cancelLeaderLogin() {
    const modal = document.getElementById('leaderModal');
    modal.classList.remove('active');
}

function confirmLeaderLogin() {
    const deptSelect = document.getElementById('leaderDeptSelect');
    const dept = deptSelect.value;
    const input = document.getElementById('leaderPasswordInput');
    const pw = input.value;
    
    if (!dept) {
        alert('학과를 선택해주세요.');
        return;

        render();
    } else {
        alert('× 비밀번호가 올바르지 않습니다.');
        input.value = '';
        input.focus();
    }
}

function setAdminBatchMode(mode) {
    adminBatchMode = mode;
    
    const stayBtn = document.getElementById('adminBatchStay');
    const outBtn = document.getElementById('adminBatchOut');
    const offBtn = document.getElementById('adminBatchOff');

    outBtn.className = 'flex-1 px-4 py-4 rounded-xl font-bold transition-all hover:scale-105';
    offBtn.className = 'flex-1 px-4 py-4 rounded-xl font-bold transition-all hover:scale-105';
    
    if (mode === 'stay') {
        stayBtn.className += ' bg-gradient-to-br from-emerald-200 to-teal-200 text-emerald-800 border-3 border-emerald-400 shadow-xl ring-2 ring-emerald-300 active-mode-btn';

        offBtn.innerHTML = '<i class="fas fa-times-circle text-xl"></i><div class="text-lg">끄기</div>';
    } else if (mode === 'out') {
        stayBtn.className += ' bg-gray-100 text-gray-500 border-2 border-gray-200';
        stayBtn.innerHTML = '<i class="fas fa-home text-xl"></i><div class="text-lg">잔류</div>';
        outBtn.className += ' bg-gradient-to-br from-orange-200 to-amber-200 text-orange-800 border-3 border-orange-400 shadow-xl ring-2 ring-orange-300 active-mode-btn';
        outBtn.innerHTML = '<i class="fas fa-bed text-2xl mb-1"></i><div class="text-lg font-bold">외박 선택됨</div>';
        offBtn.className += ' bg-gray-100 text-gray-500 border-2 border-gray-200';
        offBtn.innerHTML = '<i class="fas fa-times-circle text-xl"></i><div class="text-lg">끄기</div>';
    } else {
        stayBtn.className += ' bg-gray-100 text-gray-500 border-2 border-gray-200 hover:bg-emerald-50 hover:text-emerald-700 hover:border-emerald-300';
        stayBtn.innerHTML = '<i class="fas fa-home text-xl"></i><div class="text-lg">잔류</div>';
        outBtn.className += ' bg-gray-100 text-gray-500 border-2 border-gray-200 hover:bg-orange-50 hover:text-orange-700 hover:border-orange-300';
        outBtn.innerHTML = '<i class="fas fa-bed text-xl"></i><div class="text-lg">외박</div>';
        offBtn.className += ' bg-gradient-to-br from-slate-100 to-gray-100 text-gray-600 border-2 border-gray-300 shadow-md';
        offBtn.innerHTML = '<i class="fas fa-times-circle text-xl"></i><div class="text-lg">끄기</div>';
    }

        `✅ 체크한 학생 ${checkedStudents.length}명 → ${checkedText}\n` +

        `${uncheckedStudents.length > 0 ? uncheckedStudents.slice(0, 5).map(s => s.name).join(', ') + (uncheckedStudents.length > 5 ? ' 외 ' + (uncheckedStudents.length - 5) + '명' : '') : '없음'}`;
    
    if (!confirm(confirmMsg)) {

    }

        let successCount = 0;

        for (const student of checkedStudents) {

// 개별 학생 신청 메뉴 표시
function showIndividualSubmitMenu(event, dept, name) {
    event.stopPropagation();
    
    // 기존 메뉴 제거
    const existingMenu = document.getElementById('individualSubmitMenu');
    if (existingMenu) {
        existingMenu.remove();
    }
    
    // 메뉴 생성
    const menu = document.createElement('div');
    menu.id = 'individualSubmitMenu';
    menu.className = 'fixed bg-white rounded-xl shadow-2xl border-2 border-indigo-300 p-4 z-50';
    menu.style.left = event.pageX + 'px';
    menu.style.top = event.pageY + 'px';
    
    menu.innerHTML = `
        <div class="mb-3 font-bold text-gray-800 text-center border-b-2 border-gray-200 pb-2">
            ${formatStudentName(name)}
            <div class="text-xs text-gray-500 font-normal">${dept}</div>
        </div>
        <div class="flex flex-col gap-2">
            <button onclick="submitIndividualStudent('${dept}', '${name}', 'stay')" class="px-4 py-3 bg-gradient-to-r from-emerald-100 to-teal-100 text-emerald-700 rounded-lg font-bold hover:shadow-lg hover:scale-105 transition-all border border-emerald-300">
                <i class="fas fa-home"></i> 잔류 신청
            </button>
            <button onclick="submitIndividualStudent('${dept}', '${name}', 'out')" class="px-4 py-3 bg-gradient-to-r from-orange-100 to-amber-100 text-orange-700 rounded-lg font-bold hover:shadow-lg hover:scale-105 transition-all border border-orange-300">
                <i class="fas fa-bed"></i> 외박 신청
            </button>
            <button onclick="closeIndividualSubmitMenu()" class="px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300 transition-all">
                <i class="fas fa-times"></i> 취소
            </button>
        </div>
    `;
    
    document.body.appendChild(menu);
    
    // 화면 밖으로 나가지 않도록 조정
    const rect = menu.getBoundingClientRect();
    if (rect.right > window.innerWidth) {
        menu.style.left = (event.pageX - rect.width) + 'px';
    }
    if (rect.bottom > window.innerHeight) {
        menu.style.top = (event.pageY - rect.height) + 'px';
    }
    
    // 외부 클릭 시 메뉴 닫기
    setTimeout(() => {
        document.addEventListener('click', closeIndividualSubmitMenu);
    }, 100);
}

// 개별 학생 신청 메뉴 닫기
function closeIndividualSubmitMenu() {
    const menu = document.getElementById('individualSubmitMenu');
    if (menu) {
        menu.remove();
    }
    document.removeEventListener('click', closeIndividualSubmitMenu);
}

        return;
    }
    
    const checkedStatus = batchMode; // 'stay' 또는 'out'
    const uncheckedStatus = batchMode === 'stay' ? 'out' : 'stay';
    
    const checkedText = checkedStatus === 'stay' ? '잔류' : '외박';
    const uncheckedText = uncheckedStatus === 'stay' ? '잔류' : '외박';
    
    const confirmMsg = `다음과 같이 저장하시겠습니까?\n\n` +
        `✓ 체크한 학생 ${checkedStudents.length}명 → ${checkedText}\n` +
        `✓ 나머지 학생 ${uncheckedStudents.length}명 → ${uncheckedText}\n\n` +
        `날짜: ${submitDate}`;
    
    if (!confirm(confirmMsg)) {
        return;
    }
    
    try {
        // 체크된 교육생들 저장
        for (const name of checkedStudents) {
            const docId = `${submitDate}_${leaderDepartment}_${name}`;
            await db.collection('submissions').doc(docId).set({
                department: leaderDepartment,
                name: name,
                status: checkedStatus,
                date: submitDate,
                timestamp: new Date().toLocaleTimeString('ko-KR')
            });
        }
        
        // 체크 안 된 교육생들 저장
        for (const name of uncheckedStudents) {
            const docId = `${submitDate}_${leaderDepartment}_${name}`;
            await db.collection('submissions').doc(docId).set({
                department: leaderDepartment,
                name: name,
                status: uncheckedStatus,
                date: submitDate,
                timestamp: new Date().toLocaleTimeString('ko-KR')
            });
        }
        
        alert(`✓ 일괄 저장 완료!\n\n${checkedText} ${checkedStudents.length}명\n${uncheckedText} ${uncheckedStudents.length}명`);
        
        // 체크박스 초기화
        deselectAllStudents();
        
    } catch (error) {
        alert('× 저장 실패: ' + error.message);
    }
}

// 엑셀 다운로드 함수
function downloadExcel() {
    // 선택된 날짜의 데이터 필터링
    const selectedSubmissions = submissions.filter(s => s.date === currentDate);
    const selectedOutings = outings.filter(o => o.date === currentDate);
    
    // CSV 헤더
    let csv = '\uFEFF날짜,학과,이름,구분,상세정보,제출시간\n';
    
    // 잔류 데이터
    selectedSubmissions.filter(s => s.status === 'stay').forEach(s => {
        csv += `${s.date},${s.department},${s.name},잔류,-,${s.timestamp}\n`;
    });
    
    // 외박 데이터
    selectedSubmissions.filter(s => s.status === 'out').forEach(s => {
        csv += `${s.date},${s.department},${s.name},외박,-,${s.timestamp}\n`;
    });
    
    // 외출 데이터
    selectedOutings.forEach(o => {
        csv += `${o.date},${o.department},${o.name},외출,"${o.outingTime}~${o.returnTime} (${o.reason})",${o.timestamp}\n`;
    });
    
    // 미제출 데이터
    departments.forEach(dept => {
        const notSubmitted = students[dept].filter(student => 
            !selectedSubmissions.find(s => s.department === dept && s.name === student) &&
            !selectedOutings.find(o => o.department === dept && o.name === student)
        );
        notSubmitted.forEach(name => {
            csv += `${currentDate},${dept},${formatStudentName(name)},미제출,-,-\n`;
        });
    });
    
    // 다운로드
    const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
    const link = document.createElement('a');
    const url = URL.createObjectURL(blob);
    link.setAttribute('href', url);
    link.setAttribute('download', `기숙사관리_${currentDate}.csv`);
    link.style.visibility = 'hidden';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    
    alert(`✓ ${currentDate} 데이터 다운로드 완료!\n파일을 엑셀에서 열어보세요.`);
}

// 교육생 추가
async function addStudent() {
    const dept = document.getElementById('addStudentDept').value;
    const name = document.getElementById('addStudentName').value.trim();
    const room = document.getElementById('addStudentRoom').value.trim();
    const password = document.getElementById('addStudentPassword').value.trim();
    
    if (!dept) {
        alert('학과를 선택해주세요.');
        return;
    }
    
    if (!name) {
        alert('이름을 입력해주세요.');
        return;
    }
    
    // 중복 체크
    if (students[dept].includes(name)) {
        alert('이미 존재하는 교육생입니다.');
        return;
    }
    
    try {
        // Firestore에 저장
        await db.collection('students').doc(dept).set({
            students: [...students[dept], name],
            updatedAt: new Date().toISOString()
        });
        
        // 호실번호 저장
        if (room) {
            await db.collection('roomNumbers').doc(name).set({
                room: room,
                department: dept,
                updatedAt: new Date().toISOString()
            });
            studentRoomNumbers[name] = room;
        }
        
        // 비밀번호 저장
        if (password) {
            await db.collection('passwords').doc(name).set({
                password: password,
                department: dept,
                updatedAt: new Date().toISOString()
            });
            studentPasswords[name] = password;
        }
        
        // 로컬 데이터 업데이트
        students[dept].push(name);
        
        alert(`✓ ${name} 교육생이 ${dept}에 추가되었습니다!`);
        
        // 입력 필드 초기화
        document.getElementById('addStudentName').value = '';
        document.getElementById('addStudentRoom').value = '';
        document.getElementById('addStudentPassword').value = '';
        
        render();
        
    } catch (error) {
        console.error('교육생 추가 실패:', error);
        alert('× 교육생 추가 실패: ' + error.message);
    }
}

// 교육생 삭제 목록 업데이트
function updateDeleteStudentList() {
    const dept = document.getElementById('deleteStudentDept').value;
    const selectElement = document.getElementById('deleteStudentName');
    
    selectElement.innerHTML = '<option value="">교육생 선택</option>';
    
    if (dept && students[dept]) {
        students[dept].forEach(name => {
            const option = document.createElement('option');
            option.value = name;
            option.textContent = formatStudentName(name);
            selectElement.appendChild(option);
        });
    }
}

// 교육생 삭제
async function deleteStudent() {
    const dept = document.getElementById('deleteStudentDept').value;
    const name = document.getElementById('deleteStudentName').value;
    
    if (!dept || !name) {
        alert('학과와 교육생을 선택해주세요.');
        return;
    }
    
    if (!confirm(`정말로 ${formatStudentName(name)} 교육생을 삭제하시겠습니까?\n\n관련된 모든 제출 기록도 삭제됩니다.`)) {
        return;
    }
    
    try {
        // 학생 목록에서 제거
        const updatedStudents = students[dept].filter(s => s !== name);
        
        await db.collection('students').doc(dept).set({
            students: updatedStudents,
            updatedAt: new Date().toISOString()
        });
        
        // 호실번호 삭제
        if (studentRoomNumbers[name]) {
            await db.collection('roomNumbers').doc(name).delete();
            delete studentRoomNumbers[name];
        }
        
        // 비밀번호 삭제
        if (studentPasswords[name]) {
            await db.collection('passwords').doc(name).delete();
            delete studentPasswords[name];
        }
        
        // 제출 기록 삭제
        const submissionsQuery = await db.collection('submissions')
            .where('department', '==', dept)
            .where('name', '==', name)
            .get();
        
        const batch1 = db.batch();
        submissionsQuery.docs.forEach(doc => {
            batch1.delete(doc.ref);
        });
        await batch1.commit();
        
        // 외출 기록 삭제
        const outingsQuery = await db.collection('outings')
            .where('department', '==', dept)
            .where('name', '==', name)
            .get();
        
        const batch2 = db.batch();
        outingsQuery.docs.forEach(doc => {
            batch2.delete(doc.ref);
        });
        await batch2.commit();
        
        // 로컬 데이터 업데이트
        students[dept] = updatedStudents;
        
        alert(`✓ ${formatStudentName(name)} 교육생이 삭제되었습니다.`);
        
        // 목록 초기화
        document.getElementById('deleteStudentDept').value = '';
        updateDeleteStudentList();
        
        render();
        
    } catch (error) {
        console.error('교육생 삭제 실패:', error);
        alert('× 교육생 삭제 실패: ' + error.message);
    }
}

// 학과 추가
async function addDepartment() {
    const deptName = document.getElementById('addDeptName').value.trim();
    const leaderName = document.getElementById('addDeptLeaderName').value.trim();
    const leaderPassword = document.getElementById('addDeptLeaderPassword').value.trim();
    
    if (!deptName) {
        alert('학과명을 입력해주세요.');
        return;
    }
    
    if (departments.includes(deptName)) {
        alert('이미 존재하는 학과입니다.');
        return;
    }
    
    if (!leaderName || !leaderPassword) {
        alert('학과대표 이름과 비밀번호를 입력해주세요.');
        return;
    }
    
    try {
        // departments 배열에 추가
        const updatedDepartments = [...departments, deptName];
        
        await db.collection('config').doc('departments').set({
            list: updatedDepartments,
            updatedAt: new Date().toISOString()
        });
        
        // 빈 학생 목록 생성
        await db.collection('students').doc(deptName).set({
            students: [],
            updatedAt: new Date().toISOString()
        });
        
        // 학과대표 정보 저장
        await db.collection('departmentLeaders').doc(deptName).set({
            name: leaderName,
            password: leaderPassword,
            updatedAt: new Date().toISOString()
        });
        
        // 로컬 데이터 업데이트
        departments.push(deptName);
        students[deptName] = [];
        DEPARTMENT_LEADERS[deptName] = {
            name: leaderName,
            password: leaderPassword
        };
        
        alert(`✓ ${deptName} 학과가 추가되었습니다!`);
        
        // 입력 필드 초기화
        document.getElementById('addDeptName').value = '';
        document.getElementById('addDeptLeaderName').value = '';
        document.getElementById('addDeptLeaderPassword').value = '';
        
        render();
        
    } catch (error) {
        console.error('학과 추가 실패:', error);
        alert('× 학과 추가 실패: ' + error.message);
    }
}

// 학과 삭제
async function deleteDepartment() {
    const deptName = document.getElementById('deleteDeptName').value;
    
    if (!deptName) {
        alert('학과를 선택해주세요.');
        return;
    }
    
    const studentCount = students[deptName] ? students[deptName].length : 0;
    
    if (!confirm(`정말로 ${deptName} 학과를 삭제하시겠습니까?\n\n해당 학과의 교육생 ${studentCount}명과 모든 데이터가 삭제됩니다!`)) {
        return;
    }
    
    if (!confirm(`다시 한번 확인합니다.\n${deptName} 학과를 삭제하면 복구할 수 없습니다. 계속하시겠습니까?`)) {
        return;
    }
    
    try {
        // departments 배열에서 제거
        const updatedDepartments = departments.filter(d => d !== deptName);
        
        await db.collection('config').doc('departments').set({
            list: updatedDepartments,
            updatedAt: new Date().toISOString()
        });
        
        // 학생 목록 삭제
        await db.collection('students').doc(deptName).delete();
        
        // 학과대표 정보 삭제
        await db.collection('departmentLeaders').doc(deptName).delete();
        
        // 해당 학과의 모든 제출 기록 삭제
        const submissionsQuery = await db.collection('submissions')
            .where('department', '==', deptName)
            .get();
        
        const batch1 = db.batch();
        submissionsQuery.docs.forEach(doc => {
            batch1.delete(doc.ref);
        });
        await batch1.commit();
        
        // 해당 학과의 모든 외출 기록 삭제
        const outingsQuery = await db.collection('outings')
            .where('department', '==', deptName)
            .get();
        
        const batch2 = db.batch();
        outingsQuery.docs.forEach(doc => {
            batch2.delete(doc.ref);
        });
        await batch2.commit();
        
        // 로컬 데이터 업데이트
        departments.splice(departments.indexOf(deptName), 1);
        delete students[deptName];
        delete DEPARTMENT_LEADERS[deptName];
        
        alert(`✓ ${deptName} 학과가 삭제되었습니다.`);
        
        document.getElementById('deleteDeptName').value = '';
        
        render();
        
    } catch (error) {
        console.error('학과 삭제 실패:', error);
        alert('× 학과 삭제 실패: ' + error.message);
    }
}
